- type: entity
  parent: [ClothingOuterBaseLarge, AllowSuitStorageClothingGasTanks]
  id: ClothingOuterBioGeneral
  name: bio suit
  suffix: Generic
  description: A suit that protects against biological contamination.
  components:
  - type: Sprite
    sprite: _Omu/Clothing/OuterClothing/Bio/general.rsi # Omu
  - type: Clothing
    sprite: _Omu/Clothing/OuterClothing/Bio/general.rsi # Omu
  - type: Armor
    coverage:
    - Chest
    - Groin
    - Arm
    - Hand
    - Leg
    - Foot
    - Tail
    modifiers:
      coefficients:
        Caustic: 0.2
      flatReductions:
        Slash: 1 # mice trolled
  - type: ZombificationResistance
    zombificationResistanceCoefficient: 0.35
  - type: GroupExamine
  - type: HideClothingLayerClothing # Goobstation
    hiddenSlots:
    - jumpsuit
  - type: ClothingSpeedModifier
    walkModifier: 0.95
    sprintModifier: 0.95
  # Goobstation
  - type: DiseaseProtection
    # full prot
    incoming:
      powerModifiers:
        Blood: -1 # immune to plague mice
      chanceMultipliers:
        Blood: 0.5

- type: entity
  parent: ClothingOuterBioGeneral
  id: ClothingOuterBioCmo
  name: bio suit
  suffix: CMO
  description: An advanced suit that protects against biological contamination, in CMO colors.
  components:
  - type: Sprite
    sprite: _Omu/Clothing/OuterClothing/Bio/cmo.rsi # Omu
  - type: Clothing
    sprite: _Omu/Clothing/OuterClothing/Bio/cmo.rsi # Omu

- type: entity
  parent: ClothingOuterBioGeneral
  id: ClothingOuterBioJanitor
  name: bio suit
  suffix: Janitor
  description: A suit that protects against biological contamination and caustic spills, has a clip on the back to hold a mop. # Omu
  components:
  - type: Sprite
    sprite: _Omu/Clothing/OuterClothing/Bio/janitor.rsi # Omu
  - type: Clothing
    sprite: _Omu/Clothing/OuterClothing/Bio/janitor.rsi # Omu
  - type: Armor
    modifiers:
      coefficients:
        Caustic: 0.4
  # Omu start
  - type: AllowSuitStorage
    whitelist:
      tags:
        - Mop
  # Omu end

