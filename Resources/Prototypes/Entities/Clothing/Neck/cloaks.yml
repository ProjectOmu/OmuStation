- type: entity
  parent: [ClothingNeckBase, BaseCentcommContraband] # Omu - For some reason the CentComm contraband tag wasn't present.
  id: ClothingNeckCloakCentcom
  name: central commander's cloak
  description: A pompous and elite green cloak with a nice gold trim, tailored specifically to the Central Commander. It's so heavy, the gold trim might be real.
  components:
  - type: Sprite
    sprite: Clothing/Neck/Cloaks/centcomcloakformal.rsi
  - type: StealTarget
    stealGroup: HeadCloak # leaving this here because I suppose it might be interesting?

- type: entity
  parent: [ClothingNeckBase, BaseCommandContraband]
  id: ClothingNeckCloakCap
  name: captain's cloak
  description: A pompous and comfy blue cloak with a nice gold trim, while not particularly valuable as your other possessions, it sure is fancy.
  components:
  - type: Sprite
    sprite: _Goobstation/Clothing/Neck/Cloaks/cap.rsi # Goob Station - cloak resprite
  - type: StealTarget
    stealGroup: HeadCloak

- type: entity
  parent: [ClothingNeckBase, BaseCommandContraband]
  id: ClothingNeckCloakHos
  name: head of security's cloak
  description: An exquisite dark and red cloak fitting for those who can assert dominance over wrongdoers. Take a stab at being civil in prosecution! Built-in camera. # Omu
  components:
  - type: Sprite
    sprite: _Goobstation/Clothing/Neck/Cloaks/hos.rsi # Goob Station - cloak resprite
  - type: StealTarget
    stealGroup: HeadCloak
  # Omu Begin
  - type: DeviceNetwork
    deviceNetId: Wired # :clueless:
    receiveFrequencyId: SurveillanceCameraCommand
    transmitFrequencyId: SurveillanceCamera
  - type: SurveillanceCamera
    networkSet: true
    nameSet: True
    mobile: True  # Goobstation - mobile cameras fix
    id: Bodycam
  - type: Eye
  - type: WirelessNetworkConnection
    range: 200
  - type: SurveillanceCameraMicrophone
    blacklist:
      components:
      - SurveillanceCamera
      - SurveillanceCameraMonitor
      - RadioSpeaker
  - type: ActiveListener
    range: 10
  - type: ClothingGrantComponent
    component:
    - type: StationAiVision
      range: 4
  # Omu End

