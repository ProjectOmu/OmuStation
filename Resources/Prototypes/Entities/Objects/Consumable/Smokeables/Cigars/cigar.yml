- type: entity
  id: Cigar
  parent: BaseCigar
  name: cigar
  description: "A brown roll of tobacco and... well, you're not quite sure."
  components:
  - type: Sprite
    sprite: Objects/Consumable/Smokeables/Cigars/cigar.rsi
    state: unlit-icon
  - type: Tag
    tags:
      - Cigar
      - Trash
  - type: Clothing
    sprite: Objects/Consumable/Smokeables/Cigars/cigar.rsi
    slots: [ mask ]
    equippedPrefix: unlit
  - type: Item
    size: Tiny
    sprite: Objects/Consumable/Smokeables/Cigars/cigar.rsi
    heldPrefix: unlit
  # Omu start
  - type: Edible
    requiresSpecialDigestion: true
  - type: SolutionContainerManager
    solutions:
      smokable:
        maxVol: 25
        reagents:
          - ReagentId: Nicotine
            Quantity: 15
      food:
        maxVol: 5
        reagents:
        - ReagentId: Nicotine
          Quantity: 5
  # Omu end

- type: entity
  id: CigarSpent
  parent: Cigar
  suffix: spent
  components:
  - type: Sprite
    state: burnt-icon
  - type: Smokable
    state: Burnt
  - type: SolutionContainerManager
    solutions:
      smokable:
        maxVol: 20
      # Omu start
      food:
        maxVol: 5
        reagents:
          - ReagentId: Nicotine
            Quantity: 1
      # Omu end
  - type: Tag
    tags:
      - Cigar
      - Trash
      - Burnt

- type: entity
  id: CigarGold
  parent: Cigar
  name: premium Havanian cigar
  description: A cigar fit for only the best of the best.
  components:
  - type: Sprite
    sprite: Objects/Consumable/Smokeables/Cigars/cigar-gold.rsi
    state: unlit-icon
  - type: Clothing
    sprite: Objects/Consumable/Smokeables/Cigars/cigar-gold.rsi
    slots: [ mask ]
    equippedPrefix: unlit
  - type: Item
    size: Tiny
  - type: Tag
    tags:
      - Cigarette #Goobstation - whitelisted cig pack strorage (added tag)
      # Omu start - correct incomplete tagging
      - Cigar
      - Trash
      # Omu end

- type: entity
  id: CigarGoldSpent
  parent: CigarGold
  suffix: spent
  components:
  - type: Sprite
    state: burnt-icon
  - type: Smokable
    state: Burnt
  - type: SolutionContainerManager
    solutions:
      smokable:
        maxVol: 20
      # Omu start
      food:
        maxVol: 5
        reagents:
          - ReagentId: Nicotine
            Quantity: 1
      # Omu end
  # Omu start - correct incomplete tagging
  - type: Tag
    tags:
    - Cigarette
    - Cigar
    - Trash
    - Burnt
  # Omu end
