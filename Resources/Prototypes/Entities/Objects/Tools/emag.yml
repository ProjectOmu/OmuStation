- type: entity
  parent: [BaseItem, BaseSyndicateContraband]
  id: EmagUnlimited
  suffix: Unlimited
  name: cryptographic sequencer
  description: The all-in-one hacking solution. Friend of any syndicate. The iconic EMAG.
  components:
  - type: Emag
  - type: Sprite
    sprite: _Omu/Objects/Tools/emag.rsi # Omu
    state: icon
  - type: Item
    sprite: _Omu/Objects/Tools/emag.rsi # Omu
    storedRotation: -90
  - type: Tag # Goobstation
    tags:
    - Hacking
  # EE start
  - type: ExtendDescription
    descriptionList:
      - description: "emag-extenddescription-command"
        fontSize: 12
        color: "#1155ff"
        requireDetailRange: true
        requirements:
        - !type:CharacterDepartmentRequirement
          departments:
            - Command
      - description: "emag-extenddescription-engineering"
        fontSize: 12
        color: "#ffaf00"
        requireDetailRange: true
        requirements:
        - !type:CharacterDepartmentRequirement
          departments:
            - Engineering
      - description: "emag-extenddescription-security"
        fontSize: 12
        color: "#ff0000"
        requireDetailRange: true
        requirements:
        - !type:CharacterDepartmentRequirement
          departments:
            - Security
      - description: "emag-extenddescription-epistemics"
        fontSize: 12
        color: "#aa00aa"
        requireDetailRange: true
        requirements:
        - !type:CharacterDepartmentRequirement
          departments:
            - Science
      - description: "emag-extenddescription-syndicate"
        fontSize: 12
        color: "#880000"
        requireDetailRange: false
        requirements:
        - !type:CharacterAntagonistRequirement
          antagonists:
            - Traitor
            - TraitorSleeper
            - SpaceNinja
            - Nukeops
            - NukeopsMedic
            - NukeopsCommander
      - description: "mindshield-extenddescription-emag"
        fontSize: 12
        color: "#11aaff"
        requireDetailRange: true
        requirements:
        - !type:CharacterMindshieldRequirement
  # EE end

- type: entity
  parent: EmagUnlimited
  id: Emag
  suffix: Limited
  components:
  - type: LimitedCharges
  - type: AutoRecharge
  - type: StaticPrice
    price: 2500
