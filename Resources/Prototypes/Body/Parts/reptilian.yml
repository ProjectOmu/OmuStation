- type: entity
  id: PartReptilian
  parent: [BaseItem, BasePart]
  name: "unathi body part" # Omu unathi
  abstract: true
  components:
  - type: Icon # Shitmed Change
    sprite: Mobs/Species/Reptilian/parts.rsi
  - type: BodyPart # Shitmed Change
    species: Reptilian
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 3
      - ReagentId: Blood
        Quantity: 10
  - type: Damageable # Shitmed
    damageModifierSet: Scale

