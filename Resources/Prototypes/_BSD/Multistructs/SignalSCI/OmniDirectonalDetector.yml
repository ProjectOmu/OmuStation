- type: entity
  id: OmniDirectionalDetectorMultistructCore
  parent: [ MultistructBaseCore ]
  name: OmniDirectionalDetectorMultistructCoreName
  description: OmniDirectionalDetectorMultistructCoreNameDesc
  components:
  - type: IngameServerClientLinkInfrastructure
  - type: IngameConsole
    allowedTypes:
    - ICC_PRINT
  - type: MultiBlockPart
    PartTypes: 
    - OmniDirectionalDetectorControll
    - OmniDirectionalDetectorHull
    allowedConnectionTypesNorth:
    - OmniDirectionalDetectorSensor
    allowedConnectionTypesEast:
    - OmniDirectionalDetectorHull
    allowedConnectionTypesSouth:
    - NONE
    allowedConnectionTypesWest:
    - OmniDirectionalDetectorHull
  - type: MultiBlockStructure
    allowedTypes:
    - OmniDirectionalDetectorControll
    - OmniDirectionalDetectorHull
    - OmniDirectionalDetectorSensor
    - EnergyTransfair
    - EnergyCapacityProvider
    - Productivity
  - type: SignalSciOmniDirectonalDetector
  - type: Sprite
    sprite: _BSD/Structures/OmnidirectionalDetector.rsi
    layers:
    - state: hullInterfacePlaceHolder
  - type: ActivatableUI
    key: enum.IngameConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.IngameConsoleUiKey.Key:
        type: IngameConsoleBoundUserInterface

