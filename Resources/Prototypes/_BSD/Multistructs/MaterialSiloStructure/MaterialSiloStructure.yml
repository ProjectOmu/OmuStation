- type: entity
  id: MaterialSiloMultistructCore
  parent: [ MultistructBaseCore , BaseComputerAiAccess ]
  name: StationSiloCoreName
  description: StationSiloMultistructCoreDesc
  components:
  - type: IngameServerClientLinkInfrastructure
  - type: IngameServer
    storedPointsCapacity:
     Steel: 10000
  - type: IngameConsole
    allowedTypes:
    - ICC_ASSIGN
    - ICC_Print
  - type: SignalSalvMaterialReciverStructure
  - type: MultiBlockPart
    PartTypes: 
    - MaterialSiloStructureCore
    allowedConnectionTypesNorth:
    - ALL
    allowedConnectionTypesEast:
    - ALL
    allowedConnectionTypesSouth:
    - ALL
    allowedConnectionTypesWest:
    - ALL
  - type: MultiBlockStructure
    allowedTypes:
    - MaterialSiloReciver
    - MaterialSiloStructureConnector
    - MaterialSiloStorageExtender
  - type: ActivatableUI
    key: enum.IngameConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.IngameConsoleUiKey.Key:
        type: IngameConsoleBoundUserInterface


#
#Connectors
# Stright, Corner, Corner(inverted), TJunction
#
- type: entity
  parent: [ MultistructPartBase ]
  id: MaterialSiloMultistructConnectorStright
  name: MaterialSiloMultistructConnectorStrightName
  description: MaterialSiloMultistructConnectorStrightDesc
  components:
  - type: Sprite
    sprite: _BSD/Structures/MaterialSiloConnectors.rsi
    layers:
    - state: stright
  - type: MultiBlockPart
    transmissionEfficency: 1
    PartTypes: 
    - MaterialSiloStructureConnector
    allowedConnectionTypesNorth:
    - ALL
    allowedConnectionTypesEast:
    - NONE
    allowedConnectionTypesSouth:
    - ALL
    allowedConnectionTypesWest:
    - NONE

- type: entity
  parent: [ MultistructPartBaseNoCollission ]
  id: MaterialSiloMultistructConnectorStrightBridge
  name: MaterialSiloMultistructConnectorStrightBridgeName
  description: MaterialSiloMultistructConnectorStrightBridgeDesc
