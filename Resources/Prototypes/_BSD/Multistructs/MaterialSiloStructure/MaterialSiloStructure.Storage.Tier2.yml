#
# Tier 1 materials
#

- type: entity
  parent: [ MultistructPartBase ]
  id: MaterialSiloMultistructStorageSteelTier2
  name: MaterialSiloMultistructStorageSteelTier2Name
  description: MaterialSiloMultistructStorageSteelTier2Desc
  components:
  - type: Sprite
    sprite: _BSD/Structures/MaterialSiloTier1Storage.rsi
    layers:
    - state: base
    - state: steel
  - type: IngameServerPointCapacity
    CapacityExpansion:
      Steel: 0 #100 additional sheets
    MultistructScaling: true
    MaxMultistructPower: 16
    CapacityBaseline: 
      Steel: 10000 #100 plates basline
    CapacityLinearGrowth:
      Steel: 20000 #200 plates per additional component
  - type: MultiBlockStructure
    allowedTypes:
    - MaterialSiloSubSiloHull
    - MaterialSiloSubSiloStorage
  - type: MultiBlockPart
    transmissionEfficency: 1
    PartTypes: 
    - MaterialSiloSubSiloHull
    - MaterialSiloSubSiloCore
    - MaterialSiloStructureConnector #this is to permitt the master structure to connect via this substructure
    allowedConnectionTypesNorth:
    - MaterialSiloSubSiloStorage
    - MaterialSiloStructureConnector
    allowedConnectionTypesEast:
    - MaterialSiloSubSiloHull
    allowedConnectionTypesSouth:
    - MaterialSiloStructureConnector
    allowedConnectionTypesWest:
    - MaterialSiloSubSiloHull

