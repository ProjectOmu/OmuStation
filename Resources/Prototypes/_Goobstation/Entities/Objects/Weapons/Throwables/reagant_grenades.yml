- type: entity
  parent: SmokeGrenade
  id: LubeGrenade
  name: Lube Grenade
  description: A grenade that releases Space Lube foam.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Grenades/foamdart.rsi
  - type: SmokeOnTrigger
    duration: 5
    spreadAmount: 25
    smokePrototype: Foam
    solution:
      reagents:
      - ReagentId: SpaceLube
        Quantity: 20
  # Omu start - porting over borg modules form byrd
  - type: CartridgeAmmo
    # proto: LubeGrenadeArmed test
    deleteOnSpawn: true
  - type: Tag
    tags:
      - LubeGrenade # just here for the crafting recipe
  # Omu end - porting over borg modules form byrd

- type: entity
  parent: SmokeGrenade
