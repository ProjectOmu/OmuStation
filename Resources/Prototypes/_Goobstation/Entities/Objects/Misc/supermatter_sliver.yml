- type: entity
  parent: BaseItem
  id: SupermatterSliver
  name: supermatter sliver
  description: A shard from the station's supermatter crystal. Highly radioactive.
  components:
    - type: PointLight
      enabled: true
      radius: 3
      energy: 2
      color: "#fff633"
    - type: RadiationSource
      intensity: .75
    - type: Icon
      sprite: _Goobstation/Supermatter/supermatter_sliver.rsi
      state: icon
    - type: Sprite
      sprite: _Goobstation/Supermatter/supermatter_sliver.rsi
      state: icon
    - type: StealTarget
      stealGroup: SupermatterSliver
    - type: SupermatterImmune
    - type: Tag
      tags:
        - HighRiskItem
    # Omu start
        - Trash
    - type: Edible
      requiresSpecialDigestion: true
    - type: SolutionContainerManager
      solutions:
        food:
          maxVol: 0.5
          reagents:
          - ReagentId: Supermatter
            Quantity: 0.5
    # Omu end
