- type: entity
  parent: [ ClothingNeckBase, BaseCentcommContraband ]
  id: ClothingNeckMantleBlueshield
  name: blueshield officer mantle
  description: A well-balanced, protective mantle, designed for optimal bodyguarding efficiency.
  components:
  - type: Sprite
    sprite: _Goobstation/Clothing/Neck/Mantle/bsomantle.rsi
  - type: Clothing
    sprite: _Goobstation/Clothing/Neck/Mantle/bsomantle.rsi

#Senior Security mantle
- type: entity
  parent: [ ClothingNeckBase ]
  id: ClothingNeckMantleVeteranSecurity
  name: veteran security's mantle
  description: Personally awarded by HOS for repealing a Syndicate attack, looking at it seems to boost your morale by a bit. Equipped with a bodycam. # Omu
  components:
  - type: Sprite
    sprite: _Goobstation/Clothing/Neck/Mantle/veteran_security.rsi
  - type: Clothing
    sprite: _Goobstation/Clothing/Neck/Mantle/veteran_security.rsi
  # Omu Begin
  - type: DeviceNetwork
    deviceNetId: Wired # :clueless:
    receiveFrequencyId: SurveillanceCameraSecurity
    transmitFrequencyId: SurveillanceCamera
  - type: SurveillanceCamera
    networkSet: true
    nameSet: True
    mobile: True  # Goobstation - mobile cameras fix
    id: Bodycam
  - type: Eye
  - type: WirelessNetworkConnection
    range: 200
  - type: SurveillanceCameraMicrophone
    blacklist:
      components:
        - SurveillanceCamera
        - SurveillanceCameraMonitor
        - RadioSpeaker
  - type: ActiveListener
    range: 10
  - type: ClothingGrantComponent
    component:
      - type: StationAiVision
        range: 4
  # Omu End

#Central command epaulettes
- type: entity
  parent: [ ClothingNeckBase, BaseCentcommContraband ]
  id: ClothingNeckMantleEpaulettes
  name: golden epaulettes
  description: Exquisitely-crafted gold epaulettes symbolizing admiralty within Central Command.
  components:
  - type: Sprite
    sprite: _Goobstation/Clothing/Neck/Mantle/epaulettes.rsi
  - type: Clothing
    sprite: _Goobstation/Clothing/Neck/Mantle/epaulettes.rsi
