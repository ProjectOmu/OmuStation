- type: entity
  parent: BaseGameRule
  id: SpacePirates
  components:
  - type: StationEvent
    weight: 3
    duration: null
    earliestStart: 20
    reoccurrenceDelay: 60
    minimumPlayers: 30
    maxOccurrences: 1 # Omu
    chaos:
      Hostile: 200 # Omu, was 100
      Medical: 200 # Omu, was 100
      Death: 100 # Omu, was 25
    eventType: HostilesSpawn
  - type: GameRule
    chaosScore: 1000 # Omu, was 500
  - type: PendingPirateRule
    ransomPrototype: BikeHornRansom
  - type: Tag
    tags:
    - MidroundAntag

- type: entity
  parent: BaseGameRule
  id: PiratesSpawn
  components:
  - type: ActivePirateRule
  - type: RuleGrids
  - type: LoadMapRule
    mapPath: /Maps/_Omu/Shuttles/pirates_irs.yml # Omu
  - type: AntagLoadProfileRule
    speciesOverride: Human
    alwaysUseSpeciesOverride: true
  - type: AntagSelection
    definitions:
    - spawnerPrototype: SpawnPointPirateCaptain
      pickPlayer: false
      min: 5
      max: 5
      mindRoles:
      - MindRolePirate
      startingGear: PirateGear
      components:
      - type: RandomMetadata
        nameSegments:
        - NamesDeathCommando
  - type: Tag
    tags:
    - MidroundAntag

- type: entity
  parent: BikeHorn
  id: BikeHornRansom
  categories: [ HideSpawnMenu ]
  components:
  - type: Ransom
