- type: entity
  id: ActionFlipLights
  name: spook-action-lights-flicker # Omu edit
  description: Light switches that are on turn off and off on.
  components:
  - type: Sprite
    sprite: _Goobstation/Wraith/UI/spook.rsi
    state: flip
  - type: Action
    useDelay: 60
    icon:
      sprite: _Goobstation/Wraith/UI/spook.rsi
      state: flip
  - type: InstantAction
    event: !type:FlipLightsEvent

- type: entity
  id: ActionBurnLights
  name: spook-action-burn-lights # Omu edit
  description: Breaks up to four light tubes and bulbs in the area, creating sparks that can ignite flammables.
  components:
  - type: Sprite
    sprite: _Goobstation/Wraith/UI/spook.rsi
    state: burn
  - type: Action
    useDelay: 60
    icon:
      sprite: _Goobstation/Wraith/UI/spook.rsi
      state: burn
  - type: InstantAction
    event: !type:BurnLightsEvent

- type: entity
  id: ActionOpenDoors
  name: spook-action-open-doors # Omu edit
  description: Opens and closes a few random doors, lockers, and crates in the area.
  components:
  - type: Sprite
    sprite: _Goobstation/Wraith/UI/spook.rsi
    state: open
  - type: Action
    useDelay: 60
    icon:
      sprite: _Goobstation/Wraith/UI/spook.rsi
      state: open
  - type: InstantAction
    event: !type:OpenDoorsSpookEvent

- type: entity
  id: ActionCreateSmoke
  name: spook-action-create-smoke # Omu edit
  description: Creates multiple clouds of smoke near you that can completely obscure people's vision. Clouds persist for about a minute.
  components:
  - type: Sprite
    sprite: _Goobstation/Wraith/UI/spook.rsi
    state: smoke
  - type: Action
    useDelay: 60
    icon:
      sprite: _Goobstation/Wraith/UI/spook.rsi
      state: smoke
  - type: InstantAction
    event: !type:CreateSmokeSpookEvent

- type: entity
  id: ActionCreateEctoplasm
  name: spook-action-create-ectoplasm # Omu edit
  description: Spawns a few globs of ectoplasm in the area.
  components:
  - type: Sprite
    sprite: _Goobstation/Wraith/UI/spook.rsi
    state: ectoplasm
  - type: Action
    useDelay: 60
    icon:
      sprite: _Goobstation/Wraith/UI/spook.rsi
      state: ectoplasm
  - type: InstantAction
