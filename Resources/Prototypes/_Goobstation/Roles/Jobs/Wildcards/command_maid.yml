- type: job
  id: CommandMaid
  name: job-name-command-maid
  description: job-description-command-maid
  playTimeTracker: JobCommandMaid
  requirements:
    - !type:OverallPlaytimeRequirement
      time: 10h #10 hrs
    - !type:RoleTimeRequirement
      role: JobJanitor
      time: 1h #1 hr
  startingGear: CommandMaidGear
  icon: "JobIconCommandMaid"
  supervisors: job-supervisors-command
  setPreference: false
  access:
  - Service
  - Janitor
  - Maintenance
  - Command
  special:
  #Omu Start
  - !type:AddImplantSpecial
    implants: [ MindShieldImplant ]
  - !type:AddComponentSpecial
    components:
    - type: CommandStaff
    - type: RoundStartSkillGranting #omu skill system 
      department: CentralCommand
      skillDic:
        Cargo: 1
        Combat: 1
        Command: 1
        Engineering: 1
        Medical: 1
    - type: SpeciesBasedSkillAddition #omu skill system
      skillDic:
        Harpy:
          Cargo: -1
          Combat: -1
          Command: -1
          Engineering: -1
          Medical: -1
  #Omu End
  - !type:GiveItemOnHolidaySpecial
    holiday: GarbageDay
    prototype: WeaponRevolverInspector

- type: startingGear
  id: CommandMaidGear
  equipment:
    jumpsuit: ClothingUniformJumpskirtCommandMaid
    id: CommandMaidPDA
    gloves: ClothingHandsGlovesLatex
    ears: ClothingHeadsetCommandService
    eyes: ClothingEyesGlassesCommand
    belt: ClothingBeltJanitorFilled
    shoes: ClothingShoesBootsJackGaloshes
    pocket1: KeyRingJanitor # Omu
  inhand:
  - AdvMopItem

- type: chameleonOutfit
  id: CommandMaidChameleonOutfit
  job: CommandMaid
  equipment:
    jumpsuit: ClothingUniformJumpskirtCommandMaid
    id: CommandMaidPDA
    gloves: ClothingHandsGlovesLatex
    ears: ClothingHeadsetCommandService
    eyes: ClothingEyesGlassesCommand
    belt: ClothingBeltJanitor
    shoes: ClothingShoesBootsJackGaloshes
