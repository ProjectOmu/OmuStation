  startingGear: PartyMakerGear
  icon: "JobIconPartyMaker"
  supervisors: job-supervisors-hop
  setPreference: false
  access:
  - Service
  - Maintenance
  - Theatre
  special:
  - !type:AddComponentSpecial
    components:
    - type: CommandStaff
    - type: RoundStartSkillGranting #omu skill system 
      department: CentralCommand
      skillDic:
        Cargo: 0
        Combat: 0
        Command: 0
        Engineering: 0
        Medical: 0
