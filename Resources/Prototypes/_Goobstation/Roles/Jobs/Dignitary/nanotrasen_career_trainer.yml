- type: job
  id: NanotrasenCareerTrainer
  name: job-name-nct
  description: job-description-nct
  playTimeTracker: JobNanotrasenCareerTrainer
  goobcoins: 45
  weight: 20
  startingGear: NanotrasenCareerTrainerGear
  icon: "JobIconNanotrasenTrainer"
  joinNotifyCrew: true
  supervisors: job-supervisors-ntr-centcom
  canBeAntag: false
  whitelisted: true # 1984
  setPreference: true # Omu, enable NCT for admins
  accessGroups:
  - AllAccess
  access:
  - CentralCommand
  - NanotrasenRepresentative
  - BlueshieldOfficer
  special:
  - !type:AddImplantSpecial
    implants: [ MindShieldImplantCentComm, BluespaceLifelineImplant ] # Omu, use CC mindshield
#  - !type:AddComponentSpecial # Intentionally not command. I don't want them to ruin rev rounds.
#    components:
#    - type: CommandStaff
  - !type:AddComponentSpecial
    components:
    - type: Condemned
      soulOwnedNotDevil: true
    - type: RoundStartSkillGranting #omu skill system 
      department: [ CentralCommand ]
      skillDic:
        Cargo: 4
        Combat: 4
        Command: 0
        Engineering: 4
        Medical: 4
    - type: SpeciesBasedSkillAddition #omu skill system
      skillDic:
        Harpy:
          Cargo: 1
          Combat: 1
          Command: -1
          Engineering: 1
          Medical: 1

