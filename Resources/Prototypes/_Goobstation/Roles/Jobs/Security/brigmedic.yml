- type: job
  id: Brigmedic
  name: job-name-brigmedic
  description: job-description-brigmedic
  playTimeTracker: JobBrigmedic
  requirements:
  - !type:DepartmentTimeRequirement
    department: Medical
    time: 36000 # 10 hrs
  - !type:DepartmentTimeRequirement
    department: Security
    time: 36000 # 10 hrs
  startingGear: BrigmedicGear
  icon: "JobIconBrigmedic"
  supervisors: job-supervisors-hos
  canBeAntag: false
  guides:
  - MedicalDoctor
  - CorpsmanSOP # Omu Brigmed -> Corpsman
  - Medicine
  goobcoins: 35
  access: # EE parity, make corpsman able function.
  - Corpsman # Omu
  - Security
  - Brig
  - Medical
  - Maintenance
  - Service
  - External
  - Cryogenics
  special:
  - !type:AddImplantSpecial
    implants: [ MindShieldImplant ]
  - !type:AddComponentSpecial
    components:
    - type: SecurityStaff
    #- type: SurgerySpeedModifier
    #  speedModifier: 1.5
    - type: RoundStartSkillGranting #omu skill system 
      department: Security
      skillDic:
        Cargo: 0
        Combat: 1
        Command: 0
        Engineering: 0
        Medical: 2
    - type: SpeciesBasedSkillAddition #omu skill system
      skillDic:
        Harpy:
          Cargo: -1
          Combat: 1
          Command: -1
          Engineering: -1
          Medical: 1

- type: chameleonOutfit
  id: BrigmedicChameleonOutfit
  job: Brigmedic
  equipment:
    eyes: ClothingEyesGlassesMedSec
    mask: ClothingMaskBreathMedicalSecurity
