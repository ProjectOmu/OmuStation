- type: entity
  parent: BaseGameRule
  id: Heretic
  components:
  - type: HereticRule
  - type: GameRule
    minPlayers: 20 # Omu, was 15, we do not need heretics on lowpop.
  - type: AntagObjectives
    objectives:
    - HereticKnowledgeObjective
    - HereticSacrificeObjective
    - HereticSacrificeHeadObjective
  - type: AntagSelection
    selectionTime: IntraPlayerSpawn
    agentName: heretic-roundend-name
    definitions:
    - prefRoles: [ Heretic ]
      max: 3
      playerRatio: 20 # Omu, was 15, we dont need loads of heretics on lowpop.
      chaosScore: 250
      lateJoinAdditional: true
      jobBlacklist: [ Chaplain, ] # GOOBSTATION
      blacklist:
        components:
        - CommandStaff
      mindRoles:
      - MindRoleHeretic
  - type: Tag
    tags:
      - RoundstartAntag

- type: entity
  parent: BaseGameRule
  id: CalmHeretic
  components:
  - type: HereticRule
  - type: GameRule
    minPlayers: 20 # Omu, was 15, we don't need heretics on lowpop.
  - type: AntagObjectives
    objectives:
    - HereticKnowledgeObjective
    - HereticSacrificeObjective
    - HereticSacrificeHeadObjective
  - type: AntagSelection
    selectionTime: IntraPlayerSpawn
    agentName: heretic-roundend-name
    definitions:
    - prefRoles: [ Heretic ]
      max: 2
      playerRatio: 20 # Omu, was 15, we don't need multiple heretics on lowpop, especialy not for a "calm" gamerule.
      lateJoinAdditional: true
      jobBlacklist: [ Chaplain ] # GOOBSTATION
      blacklist:
        components:
        - CommandStaff
      mindRoles:
      - MindRoleHeretic
  - type: Tag
    tags:
      - CalmAntag
