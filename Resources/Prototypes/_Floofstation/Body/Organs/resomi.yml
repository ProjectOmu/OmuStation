- type: entity # Goobstation - resomi stomach
  id: OrganResomiStomach
  parent: OrganAnimalStomach
  categories: [ HideSpawnMenu ]
  components:
  - type: Stomach
  - type: SolutionContainerManager
    solutions:
      stomach:
        maxVol: 50
      food:
        maxVol: 5
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 5

- type: entity # Starlight
  id: OrganResomiHeart
  parent: OrganHumanHeart
  suffix: Resomi
  description: "The heart of a resomi."
  components:
  - type: Metabolizer
    metabolizerTypes: [Resomi]
    groups:
    - id: Medicine
    - id: Poison
    - id: Narcotic
