      # Omu end
  - type: HumanoidAppearance
    species: Ovinia
  - type: Body
    prototype: Ovinia
  - type: Speech
    speechSounds: Alto
    speechVerb: Ovinia
    allowedEmotes: ["Baa"]
  - type: Vocal
    sounds:
      Male: MaleOvinia
      Female: FemaleOvinia
      Unsexed: MaleOvinia
  - type: LanguageKnowledge
    speaks:
    - TauCetiBasic
    - Caprine
    understands:
    - TauCetiBasic
    - Caprine
  - type: StepTriggerImmune
    whitelist:
      types:
        - Shard
        - Mousetrap
        - SlipEntity
  - type: Tag
    tags:
    - CanPilot
    - FootstepSound
    - DoorBumpOpener
    - OviniaEmotes
  - type: TypingIndicator
    proto: ovinia
  - type: Inventory
    speciesId: ovinia
    templateId: human
    displacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: _DEN/Mobs/Species/Ovinia/displacement.rsi
            state: jumpsuit
      shoes:
        sizeMaps:
          32:
            sprite: _DEN/Mobs/Species/Ovinia/displacement.rsi
            state: shoes
      outerClothing:
        sizeMaps:
          32:
            sprite: _DEN/Mobs/Species/Ovinia/displacement.rsi
            state: outerclothing_hardsuit
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: _DEN/Mobs/Species/Ovinia/displacement.rsi
            state: jumpsuit-female
      shoes:
        sizeMaps:
          32:
            sprite: _DEN/Mobs/Species/Ovinia/displacement.rsi
            state: shoes
      outerClothing:
        sizeMaps:
          32:
            sprite: _DEN/Mobs/Species/Ovinia/displacement.rsi
            state: outerclothing_hardsuit
  - type: Flammable
    firestackFade: -0.15 #wool isnt flammable
  - type: Hunger
    baseDecayRate: 0.0125 #25% slower than normal (chewin they cud)
  - type: Thirst
    baseDecayRate: 0.075

