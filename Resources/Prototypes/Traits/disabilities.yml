# If you add a new trait, make sure to add the corresponding component to the whitelist in \Resources\Prototypes\Entities\Mobs\Player\clone.yml so it gets copied to clones correctly!

- type: trait
  id: Blindness
  name: trait-blindness-name
  description: trait-blindness-desc
  traitGear: WhiteCane
  # category: Disabilities
  category: VisualTraits # Omustation - Remake EE Traits system - EE traits categories
  whitelist:
    components:
      - Blindable
  components:
    - type: PermanentBlindness
  globalCost: -6 # Omustation - Remake EE Traits system - global trait points cost

- type: trait
  id: PoorVision
  name: trait-poor-vision-name
  description: trait-poor-vision-desc
  traitGear: ClothingEyesPrescriptionGlasses # Goobstation
  # category: Disabilities
  category: VisualTraits # Omustation - Remake EE Traits system - EE traits categories
  whitelist:
    components:
      - Blindable
  components:
    - type: PermanentBlindness
      blindness: 4
  globalCost: -1 # Omustation - Remake EE Traits system - global trait points cost

- type: trait
  id: Narcolepsy
  name: trait-narcolepsy-name
  description: trait-narcolepsy-desc
  # category: Disabilities
  category: MentalTraits # Omustation - Remake EE Traits system - EE traits categories
  components:
    - type: Narcolepsy
      maxTimeBetweenIncidents: 600
      minTimeBetweenIncidents: 300
      maxDurationOfIncident: 30
      minDurationOfIncident: 10
  globalCost: -6 # Omustation - Remake EE Traits system - global trait points cost

- type: trait
  id: Unrevivable
  name: trait-unrevivable-name
  description: trait-unrevivable-desc
  # category: Disabilities
  category: PhysicalTraits # Omustation - Remake EE Traits system - EE traits categories
  components:
    - type: Unrevivable
      cloneable: true
  globalCost: -2 # Omustation - Remake EE Traits system - global trait points cost

- type: trait
  id: Monochromacy
  name: trait-monochromacy-name
  description: trait-monochromacy-desc
  # category: Disabilities
  category: VisualTraits # Omustation - Remake EE Traits system - EE traits categories
  components:
  - type: BlackAndWhiteOverlay
  globalCost: 0 # Omustation - Remake EE Traits system - global trait points cost

- type: trait
  id: Muted
  name: trait-muted-name
  description: trait-muted-desc
  # category: Disabilities
  category: MentalTraits # Omustation - Remake EE Traits system - EE traits categories
  blacklist:
    components:
      - BorgChassis
  components:
    - type: Muted
  globalCost: -6 # Omustation - Remake EE Traits system - global trait points cost

- type: trait
  id: Paracusia
  name: trait-paracusia-name
  description: trait-paracusia-desc
  # category: Disabilities
  category: AuditoryTraits # Omustation - Remake EE Traits system - EE traits categories
  components:
    - type: Paracusia
      minTimeBetweenIncidents: 0.1
      maxTimeBetweenIncidents: 300
      maxSoundDistance: 7
      sounds:
        collection: Paracusia
  globalCost: -1 # Omustation - Remake EE Traits system - global trait points cost

- type: trait
  id: PainNumbness
  name: trait-painnumbness-name
  description: trait-painnumbness-desc
  # category: Disabilities
  category: MentalTraits # Omustation - Remake EE Traits system - EE traits categories
  specials:
  - !type:ApplyStatusEffectSpecial
    statusEffects:
    - PainNumbnessTraitStatusEffect
  globalCost: -2 # Omustation - Remake EE Traits system - global trait points cost

- type: trait
  id: Hemophilia
  name: trait-hemophilia-name
  description: trait-hemophilia-desc
  # category: Disabilities
  specials:
  - !type:ApplyStatusEffectSpecial
    statusEffects:
    - StatusEffectHemophiliaTrait

- type: trait
  id: ImpairedMobility
  name: trait-impaired-mobility-name
  description: trait-impaired-mobility-desc
