- type: gameMap
  id: Box
  mapName: 'Box Station'
  mapPath: /Maps/_Omu/box.yml # Omu - Prisoner role mapping
  minPlayers: 30 # Goobstation return minPlayers requirement for maps
  maxPlayers: 85 # Goobstation - Limit mappool to highpop versions of maps only
  stations:
    Boxstation:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: '{0} Box Station {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: 'TG'
        - type: StationEmergencyShuttle
          emergencyShuttlePath: /Maps/Shuttles/emergency_box.yml
        - type: StationJobs
          availableJobs:
            #command
            Captain: [ 1, 1 ]
            NanotrasenRepresentative: [ 1, 1 ]
            NanotrasenCareerTrainer: [ 2, 2] # Omu
            BlueshieldOfficer: [ 1, 1 ]
            #service
            HeadOfPersonnel: [ 1, 1 ]
            AdministrativeAssistant: [ 1, 1 ] # Delta V
            Bartender: [ 2, 2 ]
            Botanist: [ 3, 3 ]
            Chef: [ 2, 2 ]
            Janitor: [ 2, 2 ]
            Chaplain: [ 1, 1 ]
            Librarian: [ 1, 1 ]
            Reporter: [ 1, 1 ]
            RadioHost: [ 1, 1 ] # Omu
            ServiceWorker: [ 2, 2 ]
            #engineering
            ChiefEngineer: [ 1, 1 ]
            AtmosphericTechnician: [ 3, 3 ]
            StationEngineer: [ 5, 5 ]
            TechnicalAssistant: [ 4, 4 ]
            #medical
            ChiefMedicalOfficer: [ 1, 1 ]
            Chemist: [ 2, 2 ]
            MedicalDoctor: [ 4, 4 ]
            Paramedic: [ 2, 2 ] # Omu 1 -> 2
            MedicalIntern: [ 4, 4 ]
            Psychologist: [ 1, 1 ]
            Virologist: [ 1, 1 ] # Omu
            #science
            ResearchDirector: [ 1, 1 ]
            Scientist: [ 5, 5 ]
            ResearchAssistant: [ 4, 4 ]
            #security
            HeadOfSecurity: [ 1, 1 ]
            Warden: [ 1, 1 ]
            SecurityOfficer: [ 5, 5 ]
            Detective: [ 1, 1 ]
            SecurityCadet: [ 4, 4 ]
            Lawyer: [ 2, 2 ]
            Brigmedic: [ 1, 1 ]
            TransitPrisoner: [2, 2] # Omu - Prisoner role
            SecuritySergeant: [ 1, 1 ] #Omu
            #supply
            Quartermaster: [ 1, 1 ]
            SalvageSpecialist: [ 3, 3 ]
            #ShaftMiner: [ 3, 3 ] # Omu, needs mapping
            CargoTechnician: [ 3, 3 ]
            #Courier: [ 3, 3 ] # Omu - Courier role
            #civilian
            Passenger: [ -1, -1 ]
            Clown: [ 1, 1 ]
            Mime: [ 1, 1 ]
            Musician: [ 1, 1 ]
            #silicon
            StationAi: [ 1, 1 ]
            Borg: [ 2, 3 ]
