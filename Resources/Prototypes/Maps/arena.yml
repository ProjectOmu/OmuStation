            AtmosphericTechnician: [ 1, 2 ]
            ChiefEngineer: [ 1, 1 ]
            StationEngineer: [ 2, 3 ]
            TechnicalAssistant: [ 2, 3 ]
          #medical
            Chemist: [ 2, 2 ]
            ChiefMedicalOfficer: [ 1, 1 ]
            MedicalDoctor: [ 3, 5 ]
            MedicalIntern: [ 2, 3 ]
            Paramedic: [ 2, 2 ]
            Psychologist: [ 1, 1 ]
            Virologist: [ 1, 1 ]
          #security
