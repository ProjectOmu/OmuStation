- type: gameMap
  id: Plasma
  mapName: 'Plasma'
  mapPath: /Maps/_Omu/plasma.yml
  minPlayers: 20
  maxPlayers: 80
  stations:
    Plasma:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: '{0} Plasma {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: '14'
        - type: StationEmergencyShuttle
          emergencyShuttlePath: /Maps/_Omu/Shuttles/emergency_plasma.yml # Omu, bugged missing texture floor tiles.
        - type: StationCargoShuttle
          path: /Maps/_Omu/Shuttles/cargo_plasma.yml # Omu, Made it slightly smaller so lavaland shuttle can dock properly.
        - type: StationJobs
          availableJobs:
            #command (10)
            NanotrasenRepresentative: [ 1, 1 ] # Omu, fork role
