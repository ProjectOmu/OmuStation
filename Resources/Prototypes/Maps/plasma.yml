            Captain: [ 1, 1 ]
            HeadOfPersonnel: [ 1, 1 ]
            AdministrativeAssistant: [ 1, 1 ] # Omu, fork role
            ChiefEngineer: [ 1, 1 ]
            ChiefMedicalOfficer: [ 1, 1 ]
            ResearchDirector: [ 1, 1 ]
            HeadOfSecurity: [ 1, 1 ]
            Quartermaster: [ 1, 1 ]
            #service (15-17)
            Bartender: [ 2, 2 ]
            Botanist: [ 2, 2 ] # Omu
            Chef: [ 2, 2 ]
            Janitor: [ 3, 3 ]
            Chaplain: [ 1, 1 ]
            Librarian: [ 1, 1 ]
            ServiceWorker: [ 2, 2 ]
            Reporter: [ 2, 2 ]
            Lawyer: [ 1, 2 ]
            RadioHost: [ 1, 1 ] # Omu, fork role
            #engineering (7)
            AtmosphericTechnician: [ 3, 3 ] # Omu
            StationEngineer: [ 4, 4 ]
            TechnicalAssistant: [ 4, 4 ]
            #medical (11)
