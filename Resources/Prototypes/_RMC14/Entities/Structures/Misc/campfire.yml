- type: entity
  id: RMCCampfire
  parent: Bonfire
  name: campfire
  description: A useful tool to turn fellow spessmen into lifelong friends. Pull up a chair!
  components:
  - type: Sprite
    noRot: true
    sprite: _RMC14/Structures/campfire.rsi
    layers:
      - state: campfire
      - state: burning
  - type: ParallaxStargaze # Goob
  - type: Construction # Goob
    graph: RMCCampfire
    node: campfire
    # Omu begin: Allow the campfire to be used for cooking
  - type: ApcPowerReceiver
    powerLoad: 0
    needsPower: false
  - type: ItemPlacer
    maxEntities: 2
    whitelist:
      components:
      - Temperature
  - type: EntityHeater
    setting: 1
  - type: PlaceableSurface
  - type: Fixtures
    fixtures:
      itemcollide:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.14,-0.05,0.15,0.25"
        layer:
        - HighImpassable
        hard: false
    # Omu end
