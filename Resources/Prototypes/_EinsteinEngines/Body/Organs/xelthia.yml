- type: entity
  id: OrganXelthiaStomach
  name: xelthia stomach
  parent: OrganHumanStomach
  categories: [ HideSpawnMenu ]
  components: # Omu, Removed special digestion so that xelthia can properly eat chocolate and other things
  - type: SolutionContainerManager
    solutions:
      stomach:
        maxVol: 70 # Omu, xelthia fatty
      food:
        maxVol: 5
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 5
  - type: Metabolizer
    maxPoisonsProcessable: 3
    metabolizerTypes: [ Xelthia ]
    removeEmpty: true
    groups:
      - id: Food
      - id: Drink
