- type: emote
  id: Hiss
  name: Шипіти
  category: Vocal
  icon: _Goobstation/Interface/Emotes/hiss.png
  whitelist:
    tags:
    - FelinidEmotes
    - HarpyEmotes
    - ReptilianEmotes
  blacklist:
    components:
    - BorgChassis
  chatMessages: [шипить.]
