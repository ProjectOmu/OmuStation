- type: entity
  id: WeaponFlamethrower
  parent: BaseItem
  name: Flamethrower
  description: A high-powered spray nozzle used in conjunction with a backpack-mounted water tank.
  components:
  - type: Tag
    tags:
    - FlamethrowerNozzle
  - type: Sprite
    sprite: _Omu/Weapons/Flamethrower.rsi
    state: icon
  - type: Item
    sprite: _Omu/Weapons/Flamethrower.rsi
    size: Normal
  - type: Gun
    cameraRecoilScalar: 0 #no recoil
    projectileSpeed: 6
    fireRate: 20
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/water_spray.ogg
  - type: Appearance
  - type: ClothingSlotAmmoProvider
    targetSlot:
    - BACK
    - suitStorage
    providerWhitelist:
      tags:
      - FlamethrowerBackTank
  - type: PhysicalComposition
    materialComposition:
      Steel: 375
      Glass: 125

- type: entity
  parent: [Clothing, ClothingSlotBase]
  id: ClothingBackpackFlametank
  name: Flamethrower storage tank
  description: Accepts specialized fuel tanks to enable the flamethrowers function
  components:
  - type: Sprite
    sprite: _Goobstation/Clothing/Back/Backpacks/lmg_backpack.rsi
    layers:
    - state: icon
      visible: false
    - state: base
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: true
    zeroNoAmmo: true
  - type: Clothing
    slots: BACK
    sprite: _Goobstation/Clothing/Back/Backpacks/lmg_backpack.rsi
    clothingVisuals:
      back:
      - state: equipped-BACKPACK
      - state: green-equipped-BACKPACK
        shader: unshaded
      - state: mag-equipped-BACKPACK
  - type: ItemSlots
    slots:
      item:
        name: Nozzle
        startingItem: WeaponFlamethrower
        whitelist:
          tags:
          - FlamethrowerNozzle
  - type: Appearance
  - type: StaticPrice
    price: 500
  - type: ContainerContainer
    containers:
      item: !type:ContainerSlot
  - type: Item
    size: Ginormous
  - type: Tag
    tags:
    - FlamethrowerBackTank
    - WhitelistChameleon
  - type: ClothingSpeedModifier
    walkModifier: 0.8
    sprintModifier: 0.8
  - type: HeldSpeedModifier
  - type: SolutionAmmoProvider
    solutionId: chamber
    proto: BulletFlamethrower
    fuelReagent: WeldingFuel
    fireCost: 5 #300 shots
  - type: SolutionContainerManager
    solutions:
      chamber:
        reagents:
        - ReagentId: WeldingFuel
          Quantity: 1500
        maxVol: 1500
  - type: SolutionItemStatus
    solution: chamber
  - type: RefillableSolution
    solution: chamber
    fuelReagent: WeldingFuel
  - type: ExaminableSolution
    solution: chamber
  - type: InjectableSolution
    solution: chamber
  - type: SolutionTransfer
    transferAmount: 600
    solution: chamber

- type: entity
  id: BulletFlamethrower
  name: Fire
  categories: [ HideSpawnMenu ]
  components:
  - type: Clickable
  - type: Physics
    bodyType: Dynamic
    linearDamping: 0
    angularDamping: 0
  - type: TimedDespawn
    lifetime: 1
  - type: Projectile
    damage:
      types:
        Heat: 0.3
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/magic.rsi
    layers:
    - state: fireball
      shader: unshaded
  - type: Ammo
    muzzleFlash: null
  - type: SolutionContainerManager
    solutions:
      vapor:
        maxVol: 3
        reagents:
        - ReagentId: WeldingFuel
          Quantity: 2
        - ReagentId: Phlogiston
          Quantity: 1
  - type: Fixtures
    fixtures:
      projectile:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.10,-0.30,0.10,0.15"
        hard: false
        mask:
        - Impassable
        - BulletImpassable
  - type: Vapor
    active: true
    transferAmountPercentage: 100
  - type: Appearance
  - type: VaporVisuals
  - type: SmartLinkBlacklist
  - type: ChangeTemperatureOnCollide # 1% of the temp gun so its lesser
    heat: 350
