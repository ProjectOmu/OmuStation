## Books onward!

- type: entity
  parent: BookBase
  id: HereticTomeBase
  name: HereticTomeBase
  description: Something is off about this book - you shouldn't see this
  components:
  - type: HereticTome
    knowledgeGain: 1    # One knowledge
  - type: Sprite
    sprite: Objects/Misc/books.rsi
    layers:
    - state: paper
    - state: icon_mansusoverview
      map: [ "icon" ]
    - state: cover_base
      color: "#89CFF0"
      map: [ "cover" ]
    - state: decor_wingette
      color: "#453f3a"
      map: [ "decor" ]
    - state: overlay_null
      map: [ "overlay" ]

