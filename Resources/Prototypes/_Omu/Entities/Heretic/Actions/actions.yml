- type: entity
  parent: BaseAction
  id: ActionEldritchBlast
  name: Eldritch Blast
  description: Fires an eldritch blast at the target location.    # Literally just a fireball. Till we can get a proper one going lel
  components:
  - type: Magic
    requiresSpeech: true
    school: Explosion
  - type: Sprite
    sprite: _Impstation/Objects/Weapons/Guns/Projectiles/energybolts.rsi
    state: mediumstun
  - type: Action
    useDelay: 6
    itemIconStyle: BigAction
    raiseOnUser: true
    sound: !type:SoundPathSpecifier
      path: /Audio/Magic/fireball.ogg
    icon:
      sprite: _Impstation/Objects/Weapons/Guns/Projectiles/energybolts.rsi
      state: mediumstun
  - type: TargetAction
    range: 60
    checkCanAccess: false
  - type: EntityTargetAction
    canTargetSelf: false
  - type: WorldTargetAction
    event: !type:ProjectileSpellEvent
      prototype: ProjectileFireball
      speed: 20
  - type: SpeakOnAction
    sentence: action-speech-eldritch-blast

- type: entity
  name : Eldritch Blast!
  id: EldritchBlast
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: PointLight
    color: "#E25822"
    radius: 2.0
    energy: 5.0
  - type: Reflective
    reflective:
    - Magic
  - type: FlyBySound
    sound:
      collection: EnergyMiss
      params:
        volume: 5
  - type: Sprite
    sprite: _Impstation/Objects/Weapons/Guns/Projectiles/energybolts.rsi
    layers:
    - state: mediumstun
      shader: unshaded
  - type: Physics
  - type: Ammo
    muzzleFlash: MuzzleFlashEffectOmnilaser
  - type: Projectile
    damage:
      types:
        Heat: 10
    soundHit:
      collection: WeakHit
    forceSound: true
  - type: TriggerOnCollide
    fixtureID: projectile
    maxTriggers: 1
  - type: Explosive
    explosionType: Radioactive
    maxIntensity: 3.5
    intensitySlope: 3
    totalIntensity: 28
    maxTileBreak: 0
  - type: FascinationGranted
