- type: entity
  id: PlayerBorgSyndicateMedicalGhostRole
  parent: PlayerBorgSyndicateMedicalBattery
  suffix: Ghost role
  components:
    - type: GhostRole
      name: ghost-role-information-syndicate-cyborg-medical-name
      description: ghost-role-information-syndicate-cyborg-description
      rules: ghost-role-information-higher-standard-silicon-rules
      raffle:
        settings: default
    - type: GhostTakeoverAvailable

- type: entity
  id: PlayerBorgSyndicateServiceBattery
  parent: BorgChassisSyndicateService
  suffix: Battery, Module, Operative
  components:
  - type: NukeOperative
  - type: ContainerFill
    containers:
      borg_brain:
        - PositronicBrain
      borg_module:
        - BorgModuleService
        - BorgModuleMusique
        - BorgModuleGardening
        - BorgModuleHarvesting
        - BorgModuleOperative
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellHyper

- type: entity
  id: PlayerBorgSyndicateServiceGhostRole
  parent: PlayerBorgSyndicateServiceBattery
  suffix: Ghost role
  components:
    - type: GhostRole
      name: ghost-role-information-syndicate-cyborg-service-name
      description: ghost-role-information-syndicate-cyborg-service-description
      rules: ghost-role-information-higher-standard-silicon-rules
      raffle:
        settings: default
    - type: GhostTakeoverAvailable

- type: entity
  id: JermovCircuitBoard
  parent: BaseElectronics
  name: law board (Jermov)
  description: An electronics board containing the Jermov lawset.
  components:
  - type: Sprite
    sprite: Objects/Misc/module.rsi
    state: std_mod
  - type: SiliconLawProvider
    laws: JermovLawset
