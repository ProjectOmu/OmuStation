- type: entity
  id: BorgChassisSyndicateService
  parent: BaseBorgChassisSyndicate
  name: syndicate service cyborg
  description: An adorable chassis with sinister blood-red plating. Will keep you fed, watered and entertained between operations.
  components:
  - type: Sprite
    sprite: _Omu/Mobs/Silicon/Syndicate/synd_service.rsi
    layers:
    - state: synd_service
    - state: synd_service_e
      map: ["enum.BorgVisualLayers.Light"]
      shader: unshaded
      visible: false
    - state: synd_service_l
      shader: unshaded
      map: ["light"]
      visible: false
  - type: BorgChassis
    maxModules: 7
    moduleWhitelist:
      tags:
      - BorgModuleGeneric
      - BorgModuleService
      - BorgModuleSyndicate
    hasMindState: synd_service_e
    noMindState: synd_service
  - type: Inventory
    templateId: borgNoOffset
    displacements:
      head:
        sizeMaps:
          32:
            sprite: _Omu/Mobs/Species/Cyborgs/kerfus_displacements.rsi
            state: head
  - type: PointLight
    color: "#5ee842"
  - type: InteractionPopup
    interactSuccessString: petting-success-syndicate-cyborg
    interactFailureString: petting-failure-syndicate-cyborg
    interactSuccessSound:
      path: /Audio/Ambience/Objects/periodic_beep.ogg
