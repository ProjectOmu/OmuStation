# SPDX-License-Identifier: AGPL-3.0-or-later

- type: entity
  name: PLACEHOLDER_NAME
  parent: [BaseItem, BaseCentcommContraband]
  id: CentCommJustice
  description: PLACEHOLDER_DESCRIPTION
  components:
  - type: Sprite
    sprite: _Omu/Objects/Weapons/Melee/CentCommJustice.rsi
    state: Disabled-icon
  #- type: Item
  #  sprite: _Omu/Objects/Weapons/Melee/CentCommJustice.rsi
  #  inhandVisuals:
  #    left:
  #      - state: Disabled-inhand-left
  #    right:
  #      - state: Disabled-inhand-right
    heldPrefix: off
    size: Ginormous
  - type: Battery
    maxCharge: 1500
    startingCharge: 1500
  - type: BatterySelfRecharger
    autoRechargeRate: 100
    autoRechargePauseTime: 30
  - type: DisarmMalus
    malus: 0
  - type: Tag
    tags:
    - Justice
  - type: RestrictById
    restrictMelee: true
    isEmaggable: false
  - type: AccessReader
    access: [['CentralCommand']]
  - type: Sharp
  - type: Execution
    doAfterDuration: 4.0
  - type: MeleeWeapon # Don't think this section is needed, remove after finding out if it is or not.
    wideAnimationRotation: -135
    attackRate: 1.5
    damage:
      types:
        Slash: 12
      woundSeverityMultipliers:
        Slash: 2
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
    angle: 60
    animation: WeaponArcThrust
  - type: ItemSwitch
    needsPower: true
    defaultState: Disabled
    state: "Disabled"
    showLabel: true
    states:

      disabled: !type:ItemSwitchState
        verb: Disabled
        energyPerUse: 0
        components:
        - type: Sprite
          sprite: _Omu/Objects/Weapons/Melee/CentCommJustice.rsi
          state: Disabled-icon
        - type: Item
          sprite: _Omu/Objects/Weapons/Melee/CentCommJustice.rsi
          inhandVisuals:
            left:
              - state: Disabled-inhand-left
            right:
              - state: Disabled-inhand-right
        - type: MeleeWeapon
          wideAnimationRotation: -135
          attackRate: 1.5
          damage:
            types:
              Slash: 30
          soundHit:
            path: /Audio/Weapons/bladeslice.ogg
          angle: 60
          animation: WeaponArcThrust

      suppression: !type:ItemSwitchState
        verb: Suppression
        energyPerUse: 48
        components:
        - type: Sprite
          sprite: _Omu/Objects/Weapons/Melee/CentCommJustice.rsi
          state: Suppression-icon
        - type: Item
          sprite: _Omu/Objects/Weapons/Melee/CentCommJustice.rsi
          inhandVisuals:
            left:
              - state: Suppression-inhand-left
            right:
              - state: Suppression-inhand-right
        - type: MeleeWeapon
          wideAnimationRotation: -135
          attackRate: 1.5
          damage:
            types:
              Shock: 0
          angle: 60
          animation: WeaponArcThrust
          soundHit:
            path: /Audio/_Goobstation/Weapons/Effects/energy-short-sword-swing.ogg
        - type: StaminaDamageOnHit
          damage: 25
          overtime: 25
          lightAttackDamageMultiplier: 2
          lightAttackOvertimeDamageMultiplier: 1
        soundStateActivate:
          collection: sparks
          params:
            variation: 0.250

      surge: !type:ItemSwitchState
        verb: Surge
        energyPerUse: 65
        components:
        - type: Sprite
          sprite: _Omu/Objects/Weapons/Melee/CentCommJustice.rsi
          state: Surge-icon
        - type: Item
          sprite: _Omu/Objects/Weapons/Melee/CentCommJustice.rsi
          inhandVisuals:
            left:
              - state: Surge-inhand-left
            right:
              - state: Surge-inhand-right
        - type: MeleeWeapon
          wideAnimationRotation: -135
          attackRate: 1.5
          damage:
            types:
              Ion: 24
              Shock: 3
          angle: 60
          animation: WeaponArcThrust
          soundHit:
            path: /Audio/_Goobstation/Weapons/Effects/energy-short-sword-swing.ogg
        soundStateActivate:
          collection: sparks
          params:
            variation: 0.250

      phoron: !type:ItemSwitchState
        verb: Phoron
        energyPerUse: 80
        components:
        - type: Sprite
          sprite: _Omu/Objects/Weapons/Melee/CentCommJustice.rsi
          state: Phoron-icon
        - type: Item
          sprite: _Omu/Objects/Weapons/Melee/CentCommJustice.rsi
          inhandVisuals:
            left:
              - state: Phoron-inhand-left
            right:
              - state: Phoron-inhand-right
        - type: AmbientSound
          range: 5
          volume: 0
          sound:
            path: /Audio/_Goobstation/Weapons/Effects/nanotrasenenergyhum.ogg
        - type: MeleeWeapon
          wideAnimationRotation: -135
          attackRate: 1
          damage:
            types:
              Slash: 30
              Heat: 35
              Radiation: 10
              Structural: 80
          angle: 60
          animation: WeaponArcThrust
          soundHit:
            path: /Audio/Weapons/eblade1.ogg
        - type: PointLight
          enabled: true
          radius: 3
          energy: 2
          color: "#ffffff"
        - type: Reflect
          reflectProb: 0.75
          reflects:
            - Energy
        soundStateActivate:
          path: /Audio/_Goobstation/Weapons/Effects/nanotrasenenergyon.ogg
          params:
            variation: 0.250

      Supermatter: !type:ItemSwitchState
        verb: Supermatter
        energyPerUse: 999 # Also don't remove its energy usage I will cry
        components:
        - type: Sprite
          sprite: _Omu/Objects/Weapons/Melee/CentCommJustice.rsi
          state: Supermatter-icon
        - type: Item
          sprite: _Omu/Objects/Weapons/Melee/CentCommJustice.rsi
          inhandVisuals:
            left:
              - state: Supermatter-inhand-left
            right:
              - state: Supermatter-inhand-right
        - type: AmbientSound
          range: 5
          volume: 0
          sound:
            path: /Audio/_Goobstation/Supermatter/calm.ogg
        - type: SmiteOnMeleeHit # Due to the nature in how I coded SmiteOnMeleeHit, please don't add it to ANY other items, it will be unbalanced as all hell and could very easily be used to destory an entire station in a matter of minutes.  All of the restraints that prevent this from being an immencely overpowered station destruction tool are done on the yml side.
        - type: MeleeWeapon
          wideAnimationRotation: -135
          canWideSwing: false # Also do not fucking add wideswing to this shit holy fuck
          attackRate: 0.5 # Also don't up the attack rate
          animation: WeaponArcThrust
          damage:
            types:
              Heat: 10000
              Slash: 10000
            armorPenetration: 1
          soundHit:
              path: /Audio/_Goobstation/Wizard/supermatter.ogg
        - type: PointLight
          enabled: true
          radius: 5
          energy: 3
          color: "#ffe000"
        - type: SupermatterImmune
        soundStateActivate:
          collection: sparks
          params:
            variation: 0.250