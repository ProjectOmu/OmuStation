# SPDX-License-Identifier: AGPL-3.0-or-later

- type: entity
  name: PLACEHOLDER_NAME
  parent: [BaseItem, BaseCentcommContraband]
  id: CentCommJustice
  description: PLACEHOLDER_DESCRIPTION
  components:
  - type: Item
    sprite: _Omu/Objects/Weapons/Melee/centcommjustice.rsi
    size: Ginormous # Use your sheath. There isn't one dumbass.
    heldPrefix: off
  - type: Sprite
    sprite: _Omu/Objects/Weapons/Melee/centcommjustice.rsi
    state: icon
  - type: Battery
    maxCharge: 1500
    startingCharge: 1500
  - type: BatterySelfRecharger
    autoRechargeRate: 100
    autoRechargePauseTime: 30
  - type: DisarmMalus
  - type: Tag
    tags:
    - Justice
    - HighRiskItem
  - type: GuideHelp
    guides:
    - Security
    - Antagonists
  - type: RestrictById
    restrictMelee: true
    isEmaggable: false
  - type: AccessReader
    access: [['CentralCommand']]
  - type: Sharp
  - type: Execution
    doAfterDuration: 4.0
  - type: MeleeWeapon
    wideAnimationRotation: -135
    attackRate: 1.5
    damage:
      types:
        Slash: 12
      woundSeverityMultipliers:
        Slash: 2
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
    angle: 60
    animation: WeaponArcThrust
  - type: ItemSwitch
    automaticSprite: false
    needsPower: true
    defaultState: off
    state: "off"
    showLabel: true
    states:
      off: !type:ItemSwitchState
        verb: off
        energyPerUse: 0
        sprite:
          sprite: _Omu/Objects/Weapons/Melee/centcommjustice.rsi
          state: icon
        components:
        - type: MeleeWeapon
          wideAnimationRotation: -135
          attackRate: 1.5
          damage:
            types:
              Slash: 30
          soundHit:
            path: /Audio/Weapons/bladeslice.ogg
          angle: 60
          animation: WeaponArcThrust

      stun: !type:ItemSwitchState
        verb: stun
        energyPerUse: 48
        components:
        - type: sprite
          sprite: _Omu/Objects/Weapons/Melee/centcommjustice.rsi
          state: stun-icon
        - type: MeleeWeapon
          wideAnimationRotation: -135
          attackRate: 1.5
          damage:
            types:
              Shock: 0
          angle: 60
          animation: WeaponArcThrust
          soundHit:
            path: /Audio/_Goobstation/Weapons/Effects/energy-short-sword-swing.ogg
        - type: StaminaDamageOnHit # Batong
          damage: 25
          overtime: 25
          lightAttackDamageMultiplier: 2
          lightAttackOvertimeDamageMultiplier: 1
        soundStateActivate:
          collection: sparks
          params:
            variation: 0.250

      ion: !type:ItemSwitchState
        verb: ion
        energyPerUse: 65
        sprite:
          sprite: _Omu/Objects/Weapons/Melee/centcommjustice.rsi
          state: ion-icon
        components:
        - type: sprite
          sprite: _Omu/Objects/Weapons/Melee/centcommjustice.rsi
          state: ion-icon
        - type: MeleeWeapon
          wideAnimationRotation: -135
          attackRate: 1.5
          damage:
            types:
              Ion: 24
              Shock: 3
          angle: 60
          animation: WeaponArcThrust
          soundHit:
            path: /Audio/_Goobstation/Weapons/Effects/energy-short-sword-swing.ogg
        soundStateActivate:
          collection: sparks
          params:
            variation: 0.250

      phoron: !type:ItemSwitchState
        verb: phoron
        energyPerUse: 80
        components:
        - type: Sprite
          sprite: Objects/Weapons/Melee/e_sword.rsi
          layers:
          - state: e_sword
          - state: e_sword_blade
            color: "#FFFFFF"
            visible: false
            shader: unshaded
            map: [ "blade" ]
        - type: AmbientSound
          range: 5
          volume: 0
          sound:
            path: /Audio/_Goobstation/Weapons/Effects/nanotrasenenergyhum.ogg
        - type: MeleeWeapon
          wideAnimationRotation: -135
          attackRate: 1
          damage:
            types:
              Slash: 30
              Heat: 35
              Radiation: 10
              Structural: 80
          angle: 60
          animation: WeaponArcThrust
          soundHit:
            path: /Audio/Weapons/eblade1.ogg
        - type: PointLight
          enabled: true
          radius: 3
          energy: 2
          color: "#ffffff"
        - type: Reflect
          reflectProb: 0.75
          reflects:
            - Energy
        soundStateActivate:
          path: /Audio/_Goobstation/Weapons/Effects/nanotrasenenergyon.ogg
          params:
            variation: 0.250

      Supermatter: !type:ItemSwitchState
        verb: Supermatter
        energyPerUse: 999 # Also don't remove its energy usage I will cry
        components:
        - type: sprite
          sprite: _Omu/Objects/Weapons/Melee/centcommjustice.rsi
          state: Supermatter-Icon
        - type: AmbientSound
          range: 5
          volume: 0
          sound:
            path: /Audio/_Goobstation/Supermatter/calm.ogg
        - type: SmiteOnMeleeHit
        - type: MeleeWeapon
          wideAnimationRotation: -135
          canWideSwing: false # Do not fucking add wideswing to this shit holy fuck
          attackRate: 0.5 # Also don't up the attack rate
          animation: WeaponArcThrust
          damage:
            types:
              Heat: 10000
              Slash: 10000
            armorPenetration: 1
          soundHit:
              path: /Audio/_Goobstation/Wizard/supermatter.ogg
        - type: PointLight
          enabled: true
          radius: 5
          energy: 3
          color: "#ffe000"
        - type: SupermatterImmune
        soundStateActivate:
          collection: sparks
          params:
            variation: 0.250