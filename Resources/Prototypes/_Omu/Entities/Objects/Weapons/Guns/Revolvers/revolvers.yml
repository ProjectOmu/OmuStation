- type: entity
  name: T8 "Consistency" revolver
  parent: [BaseWeaponRevolver, BaseSecurityContraband]
  id: SecurityDutyRevolver
  description: A high-end, high-capacity revolver for the discerning officer. It's even coated in security red! This revolver trades the throughput of a mk58 for not only style, but also stopping power. Loads .30 rifle.
  components:
