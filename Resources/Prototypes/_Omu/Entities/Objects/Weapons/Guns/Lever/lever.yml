- type: entity
  name: Chester
  parent: [ BaseWeaponRifle, BaseGunWieldable, BaseCentcommContraband ]
  id: WeaponLeverChesterRifle
  description: An improved lever-action rifle designed to fire specialized .45 caliber ammunition for rapid threat removal.
  components:
  - type: Sprite
    sprite: _Omu/Objects/Weapons/Guns/Lever/chester.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _Omu/Objects/Weapons/Guns/Lever/chester.rsi
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineMagnumLeverRifle
        insertSound: /Audio/Weapons/Guns/MagIn/rifle_load.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/sfrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
          - MagazineMagnumLeverRifle
      gun_chamber:
        name: Chamber
        priority: 1
        whitelist:
          tags:
          - CartridgeMagnum
  - type: Gun
    fireRate: 0.8
    damageModifier: 1.65 # BSO exclusive rifle shooting .45 magnum rounds
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/batrifle.ogg
  - type: ChamberMagazineAmmoProvider
    autoCycle: false
    autoEject: true
    soundAutoEject:
      path: /Audio/_Goobstation/Weapons/Guns/MagOut/garand_eject.ogg
    soundRack:
      path: /Audio/Weapons/Guns/Cock/batrifle_cock.ogg
      params:
        volume: -3
    soundBoltClosed:
      path: /Audio/Weapons/Guns/Bolt/lever_bolt_closed.ogg
      params:
        volume: -3
    soundBoltOpened:
      path: /Audio/Weapons/Guns/Bolt/lever_bolt_opened.ogg
      params:
        volume: -3
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: UseDelay
    delay: 0.1
  - type: UseDelayBlockShoot

- type: entity
  name: Henrietta
  parent: [ BaseItem, BaseGunWieldable, BaseGrandTheftContraband ]
  id: WeaponLeverHenrietta
  description: A breechloading 8 gauge shotgun of unknown origins that has been customarily passed down from a Warden to their successor over the years. You feel certain that this weapon will never fail you.
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Weapons/Guns/Lever/chester_icon_48x.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
  - type: Item
    sprite: _Goobstation/Objects/Weapons/Guns/Lever/chester.rsi
    size: Large
    shape:
    - 0,0,4,1
  - type: Clothing
    sprite: _Goobstation/Objects/Weapons/Guns/Lever/chester.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: AmmoCounter
  - type: GunRequiresWield
  - type: Gun
    fireRate: 2
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/_Omu/Weapons/henriettafire.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/empty.ogg
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - ShellShotgunHeavy
    capacity: 1
    proto: ShellShotgunHighCaliber
    soundInsert:
      path: /Audio/_Omu/Weapons/henriettaclose.ogg
    soundRack:
      path: /Audio/_Omu/Weapons/henriettaopen.ogg
    autoCycle: false
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
        ents: []
  - type: AltFireMelee
  - type: MeleeWeapon
    attackRate: 0.8
    range: 2
    canWideSwing: false
    damage:
      types:
        Piercing: 12
    angle: 0
    animationRotation: -90
    wideAnimationRotation: -90
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: EmitSoundOnPickup
    sound:
      collection: ShotgunsPickUp
  - type: EmitSoundOnDrop
    sound:
      collection: ShotgunsDrop
  - type: EmitSoundOnLand
    sound:
      collection: ShotgunsDrop
  - type: StealTarget
    stealGroup: WeaponEnergyShotgun
  - type: StaticPrice
    price: 500
