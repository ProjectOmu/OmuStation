- type: entity
  id: WeaponLightMachineGunVasquez
  name: Vasquez
  parent: [BaseItem, BaseGunWieldable, BaseSecurityContraband]
  description: An expendable light machine gun intended for suppressive fire against unarmored targets. Comes pre-loaded with 100 rounds. It cannot be reloaded, so you'll just have to throw it away when it's empty! Chambered in .22 caseless.
  components:
  - type: Sprite
    sprite: _Omu/Objects/Weapons/Guns/LMGs/vasquez.rsi
    layers:
    - state: base
    - state: mag-3

  - type: Item
    sprite: _Omu/Objects/Weapons/Guns/LMGs/vasquez.rsi
    size: Huge
    shape:
    - 0,0,4,3

  - type: Clothing
    sprite: _Omu/Objects/Weapons/Guns/LMGs/vasquez.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage

  - type: GunRequiresWield

  - type: GunWieldBonus
    minAngle: -56
    maxAngle: -60

  - type: SpeedModifiedOnWield
    walkModifier: 0.9
    sprintModifier: 0.9

  - type: Gun
    # unwielded spread 30–60 degrees
    # wielded spread 2-30 degrees
    minAngle: 60
    maxAngle: 120
    angleIncrease: 3
    angleDecay: 16
    fireRate: 8.333333
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/minigun.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/lmg_empty.ogg

  - type: BallisticAmmoProvider
    proto: CartridgeCaselessLMG
    capacity: 100
    whitelist: null
    cycleable: false
    autoCycle: true
    mayTransfer: false

  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container

  - type: AmmoCounter

  - type: Appearance

  - type: StaticPrice
    price: 100

  - type: EmitSoundOnPickup
    sound:
      collection: RiflesPickUp

  - type: EmitSoundOnDrop
    sound:
      collection: RiflesDrop

  - type: EmitSoundOnLand
    sound:
      collection: RiflesDrop