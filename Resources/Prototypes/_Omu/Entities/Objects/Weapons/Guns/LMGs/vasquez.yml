- type: entity
  id: WeaponLightMachineGunVasquez
  name: Vasquez
  parent: [BaseItem, BaseGunWieldable, BaseSecurityContraband]
  description: An expendable light machine gun intended for crowd control and suppressive fire against unarmored targets. Kicks like a mule, but shreds like a chainsaw. Pre-loaded with 200 rounds; throw it away when it's empty! Chambered in .22 caseless.
  components:
  - type: Sprite
    sprite: _Omu/Objects/Weapons/Guns/LMGs/vasquez.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-3
      map: ["enum.GunVisualLayers.Mag"]
      shader: unshaded

  - type: MagazineVisuals
    magState: mag
    steps: 4
    zeroVisible: true

  - type: Item
    sprite: _Omu/Objects/Weapons/Guns/LMGs/vasquez.rsi
    size: Huge
    shape:
    - 0,0,4,3

  - type: Clothing
    sprite: _Omu/Objects/Weapons/Guns/LMGs/vasquez.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage

  - type: GunRequiresWield

  - type: GunWieldBonus
    minAngle: -52
    maxAngle: -98

  - type: SpeedModifiedOnWield
    walkModifier: 0.9
    sprintModifier: 0.9

  - type: Gun
    # unwielded spread 30-60 degrees (cant fire it unwielded anyway)
    # wielded spread 4-11 degrees
    minAngle: 60
    maxAngle: 120
    angleIncrease: 1.5
    angleDecay: 16
    fireRate: 12 # 720 RPM
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/minigun.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/lmg_empty.ogg

  - type: BallisticAmmoProvider
    proto: CartridgeCaselessLMG
    capacity: 200
    whitelist: null
    cycleable: false
    autoCycle: true
    mayTransfer: false

  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container

  - type: AmmoCounter

  - type: Appearance

  - type: StaticPrice
    price: 100

  - type: EmitSoundOnPickup
    sound:
      collection: RiflesPickUp

  - type: EmitSoundOnDrop
    sound:
      collection: RiflesDrop

  - type: EmitSoundOnLand
    sound:
      collection: RiflesDrop
