- type: entity
  id: ProjectileWehBoltHobbyist
  name: Abracaweh!
  description: Weh!
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/magic.rsi
    layers:
    - state: magicm_green
      shader: unshaded
  - type: Projectile
    damage:
      types:
        Heat: 0
  - type: PolymorphOnTrigger
    targetUser: true
    polymorph: LizardPlushieMagicMorph
  - type: WhitelistTriggerCondition
    userWhitelist:
      components:
      - Body
  - type: Reflective
    reflective: Magic
  - type: Ammo
    muzzleFlash: null
  - type: Trail
    lerpTime: 0.05
    frequency: 0.02
    lifetime: 1
    alphaLerpAmount: 0.4
    shader: unshaded
    sprite:
      sprite: /Textures/Objects/Weapons/Guns/Projectiles/magic.rsi
      state: magicm_green
  - type: Fixtures
    fixtures:
      projectile:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.1,-0.1,0.1,0.1"
        hard: false
        mask:
        - Impassable
        - BulletImpassable
        - Opaque
  - type: TriggerOnCollide
    fixtureID: projectile

- type: entity
  id: ProjectileBananaPeelHobbyist
  parent: BaseItem
  name: Conjure Peel
  description: Watch your step!
  components:
  - type: InteractionOutline
  - type: MovedByPressure
  - type: Clickable
  - type: Pullable
  - type: Physics
    bodyType: Dynamic
    linearDamping: 1
    angularDamping: 0
  - type: TimedDespawn
    lifetime: 5
  - type: Sprite
    drawdepth: Items
    noRot: true
    sprite: _Goobstation/Wizard/Projectiles/banana.rsi
    layers:
    - state: icon
  - type: SlipOnCollide
  - type: Slippery
    slipData:
      slipOnStep: false
      stunTime: 0.5
      launchForwardsMultiplier: 4
  - type: ProjectileHitShooterAfterDelay
    delay: 0.5
  - type: TileFrictionModifier
    modifier: 0.9
  - type: Projectile
    deleteOnCollide: true
    soundHit: null
    damage:
      types:
        Heat: 0
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 20
        mask:
        - ItemMask
        restitution: 0.5
        friction: 0.8
      projectile:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.2,-0.2,0.2,0.2"
        hard: false
        layer:
        - SlipLayer
  - type: Ammo
    muzzleFlash: null

- type: entity
  id: ProjectileMagicMissileHobbyist
  name: Lessest Magic Missile
  description: It truly is the lessest.
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/magic.rsi
    layers:
    - state: arcane_barrage
      shader: unshaded
  - type: Projectile
    damage:
      types:
        Piercing: 20
  - type: Reflective
    reflective: Magic
  - type: Ammo
    muzzleFlash: null
  - type: Trail
    color: "#FF0BC255"
    scale: 0.08
    frequency: 0.02
    lifetime: 0.3
    lerpTime: 0.0001
    alphaLerpAmount: 0.2
    scaleLerpAmount: 0.08
    shader: unshaded

- type: entity
  id: ProjectileSnackHobbyist
  name: Magic Snackies
  description: Yummy! These will certainly heal you up! Hurry and eat them before they fizzle away!
  parent: FoodSnackBase
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 10
  - type: Sprite
    state: chips
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 15
        reagents:
        - ReagentId: Nutriment
          Quantity: 12
        - ReagentId: Omnizine
          Quantity: 3 # 18 healing
  - type: FlavorProfile
    flavors:
      - oily
      - salty
      - potatoes
  - type: Tag
    tags:
      - FoodSnack
      - Pill # Make it edible by all species

- type: entity
  name: arcane shock barrage
  id: BarrageArcaneShockHobbyist
  categories: [ HideSpawnMenu ]
  parent: ProjectileShockHobbyist
  components:
  - type: ProjectileSpread
    proto: ProjectileShockHobbyist
    count: 3 # 45 stam
    spread: 15

- type: entity
  id: ProjectileShockHobbyist
  name: Arcane Shock
  description: A powerful stunning blast of arcane energy.
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/magic.rsi
    layers:
    - state: bluespace
      shader: unshaded
  - type: Projectile
    damage:
      types:
        Heat: 0 # non-lethal
  - type: StaminaDamageOnCollide
    damage: 15
  - type: Reflective
    reflective: Magic
  - type: Ammo
    muzzleFlash: null
