- type: entity
  id: secarang
  parent: [boomerang, BaseSecurityContraband]
  components:
  - type: Sprite
    sprite: _Omu/Objects/Weapons/Throwable/boomerang.rsi
    layers:
    - state: secarang_off
      map: [ "enum.ToggleableVisuals.Layer" ]
  - type: Stunbaton
    energyPerUse: 25
  - type: ItemToggle
    predictable: false
    soundActivate:
      collection: sparks
      params:
        variation: 0.250
    soundDeactivate:
      collection: sparks
      params:
        variation: 0.250
    soundFailToActivate:
      path: /Audio/Machines/button.ogg
      params:
        variation: 0.250
  - type: ItemTogglePrefix
    prefixOn: on
    prefixOff: off
  - type: MeleeWeapon # damage when you smack people with it
    damage:
      types:
        Blunt: 5
  - type: ItemToggleMeleeWeapon # Damage in its "on" state
    activatedDamage:
      types:
        Blunt: 0
  - type: DamageOtherOnHit # the damage the throw does, cannot be changed by a toggle as its sever side
    damage:
      types:
        Blunt: 4
  - type: StaminaDamageOnCollide # stam damage when ya throw it at people
    damage: 40
  - type: StaminaDamageOnHit # when you slap people with it
    damage: 15
    overtime: 40
  - type: Item
    size: Small
  - type: Clothing
    quickEquip: false
    slots:
    - Belt
  - type: DisarmMalus
    malus: 0.225
  - type: Appearance
  - type: GenericVisualizer
    visuals:
     enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: {state: secarang_on}
          False: {state: secarang_off}
  - type: DelayedKnockdownOnHit
    useDelay: stunbaton
  - type: UseDelayBlockMelee
    delays:
    - stunbaton
  - type: LandAtCursor
  - type: Battery
    maxCharge: 1000
    startingCharge: 1000
  - type: UseDelay
    delays:
      stunbaton:
        length: 2.5
  - type: Boomerang
  - type: StaticPrice
    price: 95
  - type: Riggable
  - type: SolutionContainerManager
    solutions:
      battery:
        maxVol: 5
  - type: InjectableSolution
    solution: battery
  - type: DrawableSolution
    solution: battery
  - type: Explosive
    explosionType: Default
    intensitySlope: 1.5
    maxIntensity: 200
  - type: PhysicalComposition
    materialComposition:
      Steel: 75
      Plastic: 75
  - type: GuideHelp
    guides:
    - Security
  - type: MartialArtBlocked
    form: CorporateJudo
