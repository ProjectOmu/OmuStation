- type: entity
  parent: BaseItem
  id: CombatSkilltrainer
  name: Combat Skilltrainer
  description: A device inserted into eye of the person that rapidly restructures the mind of the individual to learn information related to combat messures.
  components:
    - type: Sprite
      sprite: _Omu/Objects/SkillTrainers/NTSkillTrainer.rsi
      state: NT
    - type: Item
      sprite: _Omu/Objects/SkillTrainers/NTSkillTrainer.rsi
    - type: SkillGranting
      skillDicMaxSkillLevel:
        Combat: 2
        Cargo: 0
        Command: 0
        Engineering: 0
        Medical: 0

- type: entity
  parent: [ CombatSkilltrainer, BaseSyndicateContraband]
  id: CombatSkilltrainerSyndicate
  name: Unknown pice of Equipment
  description: This device looks forin and dangerous to handle wires and explosed circitry everwhere and a multi pronged grabber that could perfectly fit your eye ball. 
  suffix: combat
  components:
    - type: Sprite
      sprite: _Omu/Objects/SkillTrainers/SyndicateSkillTrainer.rsi
      state: syndicate
    - type: Item
      sprite: _Omu/Objects/SkillTrainers/SyndicateSkillTrainer.rsi
    - type: SkillGranting
      skillDicMaxSkillLevel:
        Combat: 3 #syndicate agents start with combat 2 so this is a upgrade to that
        Cargo: 0
        Command: 0
        Engineering: 0
        Medical: 0
    - type: ExtendDescription
      descriptionList:
        - description: "SkillTrainerSyndicateDesc-extended-syndicate-combat"
          fontSize: 12
          color: "#880000"
          requireDetailRange: false
          requirements:
          - !type:CharacterAntagonistRequirement
            antagonists:
              - Traitor
              - TraitorSleeper
              - Nukeops
              - NukeopsMedic
              - NukeopsCommander
        - description: "mindshield-extenddescription-emag"
          fontSize: 12
          color: "#11aaff"
          requireDetailRange: true
          requirements:
          - !type:CharacterMindshieldRequirement