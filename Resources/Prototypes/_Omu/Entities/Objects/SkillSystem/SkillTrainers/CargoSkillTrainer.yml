- type: entity
  parent: BaseItem
  id: CargoSkilltrainer
  name: CargoSkilltrainer
  description: CargoSkilltrainerDesc
  components:
    - type: Sprite
      sprite: _Omu/Objects/SkillTrainers.rsi
      state: NT
    - type: Item
      sprite: _Omu/Objects/SkillTrainers.rsi
    - type: SkillGranting
      skillDicMaxSkillLevel:
        Combat: 0
        Cargo: 2
        Command: 0
        Engineering: 0
        Medical: 0

- type: entity
  parent: [ CargoSkilltrainer, BaseSyndicateContraband]
  id: CargoSkilltrainerSyndicate
  name: SkilltrainerSyndicate
  description: SkilltrainerSyndicateDesc
  suffix: Cargo
  components:
    - type: Sprite
      sprite: _Omu/Objects/SkillTrainers.rsi
      state: syndicate
    - type: Item
      sprite: _Omu/Objects/SkillTrainers.rsi
    - type: ExtendDescription
      descriptionList:
        - description: "SkillTrainerSyndicateDesc-extended-syndicate-cargo"
          fontSize: 12
          color: "#880000"
          requireDetailRange: false
          requirements:
          - !type:CharacterAntagonistRequirement
            antagonists:
              - Traitor
              - TraitorSleeper
              - Nukeops
              - NukeopsMedic
              - NukeopsCommander
        - description: "mindshield-extenddescription-emag"
          fontSize: 12
          color: "#11aaff"
          requireDetailRange: true
          requirements:
          - !type:CharacterMindshieldRequirement