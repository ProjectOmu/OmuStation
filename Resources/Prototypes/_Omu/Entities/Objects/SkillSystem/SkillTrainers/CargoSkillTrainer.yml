- type: entity
  parent: BaseItem
  id: CargoSkilltrainer
  name: Cargo Skilltrainer
  description: A device inserted into eye of the person that rapidly restructures the mind of the individual to learn information related to cargo operations.
  components:
    - type: Sprite
      sprite: _Omu/Objects/SkillTrainers/NTSkillTrainer.rsi
      state: NT
    - type: Item
      sprite: _Omu/Objects/SkillTrainers/NTSkillTrainer.rsi
    - type: SkillGranting
      skillDicMaxSkillLevel:
        Combat: 0
        Cargo: 2
        Command: 0
        Engineering: 0
        Medical: 0

