- type: entity
  parent: BaseLockerTeleporter
  id: BosunLockerTeleporter
  name: bosun locker teleporter
  description: Compact device allowing the Bosun to request bluespace delivery of their locker. Remember that any salvager can open it.
  components:
  - type: Sprite
    sprite: _Lavaland/Objects/Devices/unique_teleporters.rsi
    state: shaft-miner
  - type: SpawnItemsOnUse
    items:
    - id: UniqueLockerBosunFilled
    - id: BluespaceLifeline

- type: entity
  parent: BosunLockerTeleporter
  id: UniqueBosunLockerTeleporter
  suffix: Unique
  categories: [ HideSpawnMenu ]
  components:
  - type: UniqueEntityChecker
    markerName: BosunLocker
  - type: UniqueEntityMarker
    markerName: BosunLocker
    stationOnly: false

- type: entity
  parent: BaseLockerTeleporter
  id: ForemanLockerTeleporter
  name: foreman locker teleporter
  description: Compact device allowing the Foreman to request bluespace delivery of their locker. Remember that any atmospheric technician can open it.
  components:
  - type: Sprite
    sprite: _Lavaland/Objects/Devices/unique_teleporters.rsi
    state: salvage
  - type: SpawnItemsOnUse
    items:
    - id: UniqueLockerForemanFilled
    - id: BluespaceLifeline

- type: entity
  parent: ForemanLockerTeleporter
  id: UniqueForemanLockerTeleporter
  suffix: Unique
  categories: [ HideSpawnMenu ]
  components:
  - type: UniqueEntityChecker
    markerName: ForemanLocker
  - type: UniqueEntityMarker
    markerName: ForemanLocker
    stationOnly: false
