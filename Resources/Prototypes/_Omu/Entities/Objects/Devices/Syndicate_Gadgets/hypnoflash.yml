- type: entity
  name: flash
  parent: Flash
  id: HypnoFlash
  description: An ultrabright flashbulb with a trigger, which causes the victim to be dazed and lose their eyesight for a moment. Useless when burnt out.
  components:
    - type: Hypnoflash
    - type: LimitedCharges
      maxCharges: 5
    - type: MeleeSpeech
      MaxBattlecryLength: 100
      titleBar: "Set Hypnosis Objective" # This is slightly too long. Fuck around with the xaml or make it shorter.
      descriptorBar: "Hypnosis Objective:"
    - type: ActivatableUI
      key: enum.MeleeSpeechUiKey.Key
      verbOnly: true
    - type: Actions
    - type: UserInterface
      interfaces:
        enum.MeleeSpeechUiKey.Key:
          type: MeleeSpeechBoundUserInterface
