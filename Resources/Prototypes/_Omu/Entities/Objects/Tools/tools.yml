- type: entity
  name: CentComm intern handheld fax
  parent: HandheldFax
  id: HandheldFaxCentCommIntern
  suffix: CentComm Intern
  components:
  - type: FaxMachine
    name: "CentComm Intern"
  - type: Item
    size: Normal
    sprite: _Omu/Objects/Tools/intern_fax.rsi
  - type: Prayable
    sentMessage: prayer-popup-notify-centcom-sent
    notificationPrefix: prayer-chat-notify-centcom
    verb: prayer-verbs-call
    verbImage: null
  - type: Sprite
    sprite: _Omu/Objects/Tools/intern_fax.rsi
    drawdepth: SmallObjects
    layers:
    - state: icon
      map: [ "enum.FaxMachineVisuals.VisualState" ]
    - state: scanner
      shader: unshaded

- type: entity
  name: Nanotrasen Representative handheld fax
  parent: HandheldFax
  id: HandheldFaxNanotrasenRepresentative
  suffix: Nanotrasen Representative
  components:
  - type: FaxMachine
    name: "Nanotrasen Representative"
  - type: Item
    size: Normal
    sprite: _Goobstation/Objects/Tools/official_fax.rsi
  - type: Prayable
    sentMessage: prayer-popup-notify-centcom-sent
    notificationPrefix: prayer-chat-notify-centcom
    verb: prayer-verbs-call
    verbImage: null
    notificationSound:
      path: /Audio/_Goobstation/Misc/phone_ring.ogg
  - type: Sprite
    sprite: _Goobstation/Objects/Tools/official_fax.rsi
    drawdepth: SmallObjects
    layers:
    - state: icon
      map: [ "enum.FaxMachineVisuals.VisualState" ]
    - state: scanner
      shader: unshaded

# Security Crowbar
- type: entity
  parent: [BaseCrowbar, BaseSecurityContraband]
  id: SecurityCrowbar
  description: A robust multipurpose tool to pry open doors and fight greytide invaders.
  components:
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 10
  - type: Sprite
    state: sec-icon
  - type: Item
    storedSprite:
      sprite: Objects/Tools/crowbar.rsi
      state: sec-storage
    inhandVisuals:
      left:
      - state: sec-inhand-left
      right:
      - state: sec-inhand-right
  - type: Clothing
    clothingVisuals:
      belt:
      - state: sec-equipped-BELT
