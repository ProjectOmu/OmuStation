# hard forked from the crowbar because of how differently its intended to work
- type: entity
  abstract: true
  parent: BaseItem
  id: BasePrybar
  name: prybar
  description: A single-purpose tool, designed to pry open doors during power outages.
  components:
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_Goobstation/Items/handling/crowbar_pickup.ogg
      params:
        volume: -2
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/Items/crowbar_drop.ogg
      params:
        volume: -2
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Items/crowbar_drop.ogg
  - type: Tag
    tags:
    - SecurityPrybar
  - type: MeleeWeapon
    wideAnimationRotation: -135
    damage:
      types:
        Blunt: 5 # not better than fists unless you deal different damage type ig
    soundHit:
      collection: MetalThud
  - type: PhysicalComposition
    materialComposition:
      Steel: 25
  - type: StaticPrice
    price: 22
  - type: Prying
    canPryPoweredFirelocks: false
  - type: UseDelay
    delay: 1
  - type: Sprite # while ideally i'd have a non branded sprite here i'm no spriter and it shouldnt matter short term anyways
    sprite: _Omu/Objects/Tools/sec_prybar.rsi
    state: icon
  - type: Item
    sprite: _Omu/Objects/Tools/sec_prybar.rsi
    size: Small
    shape:
    - 0,0,0,0

- type: entity
  parent: BasePrybar
  id: SecurityPrybar
  name: security prybar
  description: A single-purpose tool manufactured and advocated by station security's Guild to provide the ability to pry open doors and firelocks during emergencies.
  components:
  - type: Sprite
    sprite: _Omu/Objects/Tools/sec_prybar.rsi
    state: icon
