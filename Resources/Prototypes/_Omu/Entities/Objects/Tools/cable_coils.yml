- type: entity
  parent: CableApcStack
  id: CableApcGranular0Stack
  name: LV G0 cable coil
  description: Low-Voltage stack of wires for connecting APCs to machines and other purposes. This older variant doesn't see much use anymore.
  suffix: Full
  components:
  - type: Sprite
    sprite: &sprite0 _Omu/Objects/Tools/cable-coils-granular.rsi
    state: coillvg0-30
    layers:
    - state: coillvg0-30
      map: ["base"]
  - type: Item
    sprite: *sprite0
    size: Small
    heldPrefix: coillvg0
    storedRotation: -90
  - type: Stack
    baseLayer: base
    layerStates:
    - coillvg0-10
    - coillvg0-20
    - coillvg0-30
  - type: CablePlacer
    cablePrototypeID: CableApcExtensionGranular0
    blockingWireType: Apc
  - type: PhysicalComposition
    materialComposition:
      Steel: 7
      Glass: 7
  - type: SolutionContainerManager
    solutions:
      lvcable:
        reagents:
        - ReagentId: Copper
          Quantity: 2
        - ReagentId: Silicon
          Quantity: 3

- type: entity
