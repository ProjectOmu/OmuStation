- type: entity
  parent: [ ClothingNeckStoleChaplain, BaseChameleon ]
  id: SmugglerLootStole
  name: chaplain stole
  description: An elegantly designed stole, with a vibrant gold plus on either end.
  components:
  - type: RadiusBuff
    whitelist:
      components:
      - HumanoidAppearance
    status: StatusEffectShredder
  - type: ActivateBuffOnWear
  - type: ChameleonClothing
    slot: [NECK]
    default: ClothingNeckStoleChaplain

- type: entity
  name: Calvin    #Wilson the volleyball, Calvin Suitable pickaxe name.
  parent: PickaxeDiamond
  suffix: Pickaxe
  id: SmugglerPickaxe
  description: Notched to perfection, for jamming it into rocks. Worn with age, now you have a friend to talk to!
  components:
  - type: MeleeWeapon
    attackRate: 1.5 # Manic Fast, you are manic after all
    animationRotation: -45 # WWDP
    wideAnimationRotation: -135
    soundHit:
      path: "/Audio/Weapons/smash.ogg"
      params:
        volume: -3
    damage:
      groups:
        Brute: 5
  - type: GhostRole
    name: calvin-name
    description: calvin-desc
    rules: ghost-role-information-familiar-rules
    mindRoles:
    - MindRoleGhostRoleFamiliar
  - type: GhostTakeoverAvailable
  - type: TypingIndicator
    proto: robot
  - type: Speech
    speechVerb: Robotic
    speechSounds: Pai
  - type: MobState # shitcode courtesy of justice
    allowedStates:
      - Alive

- type: entity
  parent: ReinforcementRadio
  id: ReinforcementRadioSmugglerCrateIPC
  name: Damaged Silicon Parts
  description: Maybe it can be repaired?
  suffix: IPC
  components:
  - type: Sprite
    sprite: /Textures/_Omu/Objects/SmugglerLoot.rsi
    layers:
    - state: ipc_rusted
  - type: GhostRole
    name: smuggler-silicon-ipc-name
    description: smuggler-silicon-ipc-desc
    rules: ghost-role-information-familiar-rules
    mindRoles:
    - MindRoleGhostRoleFamiliar
    raffle:
      settings: default
  - type: GhostRoleMobSpawner
    prototype: MobIPCRandom

- type: entity
  parent: ReinforcementRadio
  id: ReinforcementRadioSmugglerCrateBorg
  name: Damaged Silicon Parts
  description: Maybe it can be repaired?
  suffix: Borg
  components:
  - type: Sprite
    sprite: /Textures/_Omu/Objects/SmugglerLoot/scrap.rsi
    layers:
    - state: ipc_rusted
  - type: GhostRole
    name: smuggler-silicon-borg-name
    description: smuggler-silicon-borg-desc
    rules: ghost-role-information-familiar-rules
    mindRoles:
    - MindRoleGhostRoleFamiliar
    raffle:
      settings: default
  - type: GhostRoleMobSpawner
    prototype: BorgChassisDerelictSyndicateHelpimov


- type: entity
  id: BorgChassisDerelictSyndicateHelpimov
  parent: PlayerBorgDerelictSyndicateAssaultBattery
  name: derelict syndicate assasult cyborg
  description: A lean, mean killing machine with access to a variety of deadly modules. This one is in a state of great disrepair despite your best efforts.
  components:
  - type: SiliconLawProvider
    laws: HelpimovLawset #Non-subverted version so they can still be changed

- type: entity
  parent: OrganLaserEyes
  id: OrganEyesOfGod
  name: Eyes of God
  components:
  - type: Organ
    onAdd:
    - type: BatteryAmmoProvider
      proto: RedLightLaser
      fireCost: 50
    - type: BatterySelfRecharger
      autoRechargeRate: 25
    - type: Gun
      fireRate: 1
      useKey: false
      selectedMode: SemiAuto
      availableModes:
        - SemiAuto
      soundGunshot: /Audio/Weapons/Guns/Gunshots/laser_cannon.ogg
    - type: Battery
      maxCharge: 200
      startingCharge: 0
    - type: FlashImmunity
    - type: EyeProtection
    - type: ShowHealthBars
      damageContainers:
      - Biological
      - Inorganic
      - Silicon
      - SiliconRadiation
    - type: ShowHealthIcons
      damageContainers:
      - Biological
      - Inorganic
      - Silicon
      - SiliconRadiation

- type: entity
  parent: HereticTomeBase
  id: MiningTomePlasma
  name: How 2 Plasma Cutter!
  description: Its partially written in Finnish... seems awfully similar to a joke
  components:
  - type: HereticTome
    knowledgeGain: 0
    productAction: ActionPlasmaBeam # n o i t a
  - type: Paper
    content: book-text-plasma-cutter    # It kills you

- type: entity
  id: LazarusImplanter
  suffix: Mindshield
  parent: BaseImplantOnlyImplanter
  components:
  - type: Implanter
    implant: MindShieldImplant

- type: entity
  parent: BaseSubdermalImplant
  id: LazarusImplant
  name: lazarus implant
  description: This implant will ensure loyalty to Nanotrasen, in animals...
  categories: [ HideSpawnMenu ]
  components:
   - type: SubdermalImplant
   - type: LazarusImplant

- type: entity
  name: cogtooth axe
  parent: FireAxe
  id: CogtoothAxe
  description: An engraving reads, blessings of the omnissiah... who is that?
  components:
  - type: Sprite
    sprite: _Omu/Objects/SmugglerLoot/CogtoothAxe.rsi
    state: icon
  - type: MeleeWeapon
    heavyStaminaCost: 15
    wideAnimationRotation: 135
    swingLeft: true
    attackRate: 0.65 #slower than parent
    damage:
      types:
        Blunt: 7 # hits like a truck... its a giant chunk of metal
        Slash: 5 # lower slash
        Structural: 10
      woundSeverityMultipliers:
        Blunt: 2
        Slash: 2.5
    soundHit:
      collection: MetalThud
  - type: Wieldable
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 7
        Slash: 5
        Structural: 40
  - type: Item
    size: Ginormous
  - type: Clothing
    sprite: _Omu/Objects/SmugglerLoot/CogtoothAxe.rsi
    quickEquip: false
    slots:
    - back
    - suitStorage
  - type: Tool
    qualities:
      - Prying
      - Anchoring
      - Axing
      - Screwing
