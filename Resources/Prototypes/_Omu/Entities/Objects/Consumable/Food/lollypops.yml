- type: entity
  parent: FoodSnackLollypopWrappedBase
  id: FoodSnackLollypopWrappedAwebo
  name: wrapped awebo lollypop
  description: An awebo filled lollypop. It's still in a wrapper.
  components:
  - type: Tag
    tags:
    - FoodSnack
  - type: Sprite
    sprite: _Goobstation/Objects/Consumable/Food/lollypop.rsi
    state: lollypop-wrapped
  - type: SpawnItemsOnUse
    items:
    - id: FoodSnackLollypopTrash
    - id: FoodSnackLollypopAwebo
    sound:
      path: /Audio/Effects/unwrap.ogg

- type: entity
  parent: FoodSnackLollypopBase
  id: FoodSnackLollypopAwebo
  name: awebo lollypop
  description: An awebo filled lollypop. Just looking at it makes you wanna preform minor crimes.
  components:
  - type: Tag
    tags:
    - FoodSnack
    - ClothMade
  - type: Sprite # Don't think about it. Don't think about it. Don't think about it.
    sprite: _Goobstation/Objects/Consumable/Food/lollypop.rsi
    layers:
    - state: lollypop
      map: [ "enum.AmmoVisualLayers.Base" ]
    - state: color
      map: [ "enum.AmmoVisualLayers.Tip" ]
      color: "#c259ff"
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 20 # Room for extra chems
        reagents:
        - ReagentId: Sugar
          Quantity: 5
        - ReagentId: JuiceThatMakesYouAwebo
          Quantity: 10
  - type: Item
    sprite: _Goobstation/Objects/Consumable/Food/lollypop.rsi
    size: Tiny

