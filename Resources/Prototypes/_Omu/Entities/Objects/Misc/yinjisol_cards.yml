    - RedPlus2aSol
    - RedPlus2bSol
    - RedSwapaSol
    - RedSwapbSol
  # Blue
    - Blue0Sol
    - Blue1aSol
    - Blue1bSol
    - Blue2aSol
    - Blue2bSol
    - Blue3aSol
    - Blue3bSol
    - Blue4aSol
    - Blue4bSol
    - Blue5aSol
    - Blue5bSol
    - Blue6aSol
    - Blue6bSol
    - Blue7aSol
    - Blue7bSol
    - Blue8aSol
    - Blue8bSol
    - Blue9aSol
    - Blue9bSol
    - BlueLockaSol
    - BlueLockbSol
    - BluePlus2aSol
    - BluePlus2bSol
    - BlueSwapaSol
    - BlueSwapbSol
  # Green
    - Green0Sol
    - Green1aSol
    - Green1bSol
