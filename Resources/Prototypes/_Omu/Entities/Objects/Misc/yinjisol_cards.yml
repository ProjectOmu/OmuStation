- type: entity
  parent: [ BoxCardboard, BaseBagOpenClose ]
  id: CardBoxBase
  name: deck box
  categories: [ HideSpawnMenu ]
  components:
  - type: Item
    size: Small
    shape:
    - 0,0,1,1
  - type: ItemCounter # FIXME
    count:
      components:
      - CardDeck
    composite: true
    layerStates:
      - fullLayer
      - fullLayer
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,1,1
    whitelist:
      components:
      - CardDeck
  - type: OpenTriggeredStorageFill
    contents:
    - id: CardDeckBase
      amount: 1
  - type: Appearance

# Frontier: base stack for card stack component
- type: entity
  parent: [BaseItem]
  id: CardStackBase
  name: stack of cards
  abstract: true
  components:
  - type: Item
    size: Small
  - type: CardStack
  - type: ContainerContainer # Frontier
    containers: # Frontier
      cardstack-container: !type:Container # Frontier
# End Frontier

- type: entity
  parent: CardStackBase
  id: CardHandBase
  categories: [ HideSpawnMenu ]
  name: hand of cards
  components:
  - type: CardHand
  - type: Sprite
    sprite: _Omu/Objects/Misc/spaceuno.rsi
    state: back_standard
    drawdepth: SmallObjects
  - type: UserInterface
    interfaces:
      enum.CardUiKey.Key:
        type: CardHandMenuBoundUserInterface
  # - type: ActivatableUI # Frontier
  #   key: enum.CardUiKey.Key # Frontier

- type: entity
  parent: CardStackBase
  id: CardDeckBase
  categories: [ HideSpawnMenu ]
  name: deck of cards
  components:
  - type: Sprite
    sprite: _Omu/Objects/Misc/spaceuno.rsi
    state: standard_deck_full
    drawdepth: SmallObjects
  - type: Item
    size: Normal
  - type: CardDeck


- type: entity
  parent: CardBoxBase
  id: CardBoxYinjiSol
  name: Solarian deck box
  components:
  - type: Item
    size: Small
  - type: Sprite
    sprite: _Omu/Objects/Misc/spaceuno.rsi
    layers:
    - state: standard_box
      map: [ "closeLayer" ]
    - state: standard_box_open
      map: [ "openLayer" ]
      visible: false
    - state: standard_box_full
      map: [ "fullLayer" ]
      visible: false
  - type: OpenTriggeredStorageFill
    contents:
    - id: CardDeckYinjiSol
      amount: 1

