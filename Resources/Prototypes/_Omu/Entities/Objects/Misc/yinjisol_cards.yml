- type: entity
  parent: BaseItem
  id: CardBaseYinjiSol
  name: card
  categories: [ HideSpawnMenu ]
  components:
  - type: EmitSoundOnLand
    sound:
      collection: cardShove
  - type: Sprite
    sprite: EstacaoPirata/Objects/Misc/cards.rsi
    state: yinjiback_sol
  - type: Rotatable
  - type: Item
    size: Small
  - type: UseDelay
    delay: 0.5
  - type: Card
    backSpriteLayers:
    - sprite: EstacaoPirata/Objects/Misc/cards.rsi
      state: yinjiback_sol
    flipped: true

