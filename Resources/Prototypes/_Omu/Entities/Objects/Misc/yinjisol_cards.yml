# Replacing the entire file, since I've done enough edits to justify it. Added descriptions, updated sprite locations, etc.

- type: entity
  parent: CardBoxBase
  id: CardBoxYinjiSol
  name: Solarian deck box
  components:
  - type: Item
    size: Small
  - type: Sprite
    sprite: EstacaoPirata/Objects/Misc/cards.rsi
    layers:
    - state: yinjibox_sol
      map: [ "closeLayer" ]
    - state: yinjibox_sol_open
      map: [ "openLayer" ]
      visible: false
    - state: yinjibox_sol_full
      map: [ "fullLayer" ]
      visible: false
  - type: OpenTriggeredStorageFill
    contents:
    - id: CardDeckYinjiSol
      amount: 1

- type: entity
  parent: CardDeckBase
  id: CardDeckYinjiSol
  name: deck of Yinji cards
  components:
