- type: entity
  parent: BaseItem
  id: CardBase
  name: card
  categories: [ HideSpawnMenu ]
  components:
  - type: EmitSoundOnLand
    sound:
      collection: cardShove
  - type: Sprite
    sprite: _Omu/Objects/Misc/spaceuno.rsi
    state: back_standard
  - type: Rotatable
  - type: Item
    size: Small
  - type: UseDelay
    delay: 0.5
  - type: Card
    backSpriteLayers:
    - sprite: _Omu/Objects/Misc/spaceuno.rsi
      state: back_standard
    flipped: true

