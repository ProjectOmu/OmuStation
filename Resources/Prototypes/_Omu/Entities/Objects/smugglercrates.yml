- type: entity
  parent: CrateBaseSecure
  id: CrateBaseSmuggler
  description: A hidden cache... who knows whats in it?
  suffix: Smuggler
  components:
    - type: DigitalLock
      randomCode: true
    - type: Lock
      unlockOnClick: false
      useAccess: false
      autoUnlock: false
      autoLock: false
      showLockVerbs: false
    - type: UserInterface
      interfaces:
        enum.StorageUiKey.Key:
          type: StorageBoundUserInterface
        enum.DigitalLockUiKey.Key:
          type: DigitalLockBoundUserInterface
    - type: ActivatableUI
      key: enum.DigitalLockUiKey.Key
    - type: GenericVisualizer
      visuals:
        enum.DigitalLockVisuals.Spark:
          spark:
            False: { visible: false }
            True: { visible: true }
    - type: EntityTableContainerFill
      containers:
        entity_storage: !type:AllSelector
          children:
          - !type:NestedSelector
            tableId: SmugglerCrateUniqueLoot
          - !type:NestedSelector
            tableId: FillSmugglerCrate
            rolls: 8

- type: entity
  parent: CrateBaseSmuggler
  id: CrateBaseSmugglerSyndicate
  suffix: Smuggler
  components:
    - type: EntityTableContainerFill
      containers:
        entity_storage: !type:AllSelector
          children:
          - !type:NestedSelector
            tableId: SmugglerCrateUniqueLoot
          - !type:NestedSelector
            tableId: MaintenanceLockerLoot
            rolls: 3
          - !type:NestedSelector
            tableId: SmugglerCrateSyndieLoot
            rolls: 1

- type: entityTable
  id: FillSmugglerCrate
  table: !type:GroupSelector
    children:
    - !type:NestedSelector
      tableId: RandomSatchelTable1
    - !type:NestedSelector
      tableId: RandomSatchelTable2
    - !type:NestedSelector
      tableId: RandomSatchelTable3
    - !type:NestedSelector
      tableId: RandomSatchelTable4
    - !type:NestedSelector
      tableId: RandomSatchelTable6
    - !type:NestedSelector
      tableId: RandomCrateMisc

- type: entityTable #2x small
  id: RandomCrateMisc
  table: !type:GroupSelector
    children:
    - id: SpaceCash100
      weight: 15
    - id: SheetSteel
      weight: 15
    - id: SheetGlass
      weight: 15
    - id: SheetPlasma
      weight: 15
