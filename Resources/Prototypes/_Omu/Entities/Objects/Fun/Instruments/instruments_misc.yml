- type: entity
  parent: BaseHandheldInstrument
  id: WehpetInstrument
  name: weh-pet
  description: A lizard had too much time on their hands when they made this.
  components:
  - type: Instrument
    program: 5
    bank: 1
  - type: Sprite
    sprite: _Omu/Objects/Fun/Instruments/wehpet.rsi
    state: icon
  - type: Item
    size: Normal
    sprite: _Omu/Objects/Fun/Instruments/wehpet.rsi
    storedRotation: -90
  - type: Tag
    tags:
    - BrassInstrument

- type: entity
  parent: BaseHandheldInstrument
  id: MarmonicaInstrument
  name: marmonica
  description: We don't know what that black-eye was thinking when they made it, but by the dark does it mar.
  components:
  - type: Instrument
    program: 6
    bank: 1
  - type: Sprite
    sprite: _Omu/Objects/Fun/Instruments/marmonica.rsi
    state: icon
  - type: Item
    size: Small
    sprite: _Omu/Objects/Fun/Instruments/marmonica.rsi
    storedRotation: -90
  - type: Clothing
    quickEquip: false
    slots:
    - neck

- type: entity
  parent: BaseHandheldInstrument
  id: DawInstrumentBorg
  name: digital audio workstation
  suffix: Borg
  description: Cutting edge music technology, straight from the 90s. Now crammed into a cyborg.
  components:
  - type: Instrument
    allowPercussion: true
    allowProgramChange: true
  - type: Sprite
    sprite: Objects/Fun/Instruments/structureinstruments.rsi
    layers:
    - state: daw-base
    - state: daw-display
      shader: unshaded

- type: entity
  parent: [PhoneInstrument, BaseCommandContraband]
  id: RedCellphone
  name: red cellphone
  description: A mobile phone with Central Command on speed dial. They still won't call back.
  components:
  - type: Sprite
    layers:
    - texture: _Omu/Objects/Fun/Instruments/red_cellphone.png
  - type: Item
    size: Tiny
    storedRotation: 0
  - type: Instrument
    bank: 0
    program: 80
    allowProgramChange: false
    allowPercussion: false
  - type: EmitSoundOnPickup
    sound:
      collection: GenericPickup
      params:
        volume: -7
  - type: EmitSoundOnDrop
    sound:
      collection: GenericDrop
      params:
        volume: -7
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Effects/drop.ogg
      params:
        volume: 2