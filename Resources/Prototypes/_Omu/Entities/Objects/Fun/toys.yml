- type: entity
  parent: EnergySwordDouble
  id: ToySwordDouble
  name: Double-bladed toy sword
  description: When one wasn't fun enough
  components:
  - type: StaminaDamageOnHit
    damage: 12
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 0.3
  - type: ItemToggleMeleeWeapon
    activatedDamage:
      types:
        Heat: 0.3
  - type: Reflect
    reflectProb: .05 #higher than default since its double, still rare
    spread: 75

- type: entity
