- type: entity
  parent: BaseItem
  id: BaseSkillTrainer
  abstract: true
  components:
  - type: Sprite
    sprite: _Omu/Objects/SkillTrainers/NTSkillTrainer.rsi
    state: NT
  - type: Item
    sprite: _Omu/Objects/SkillTrainers/NTSkillTrainer.rsi

- type: entity
  parent: BaseSyndicateContraband
  id: BaseSkillTrainerSyndicate
  abstract: true
  name: unknown piece of equipment
  description: This device looks foreign and dangerous to handle, with wires and exposed circuitry everywhere and a multi-pronged grabber that could perfectly fit your eyeball.
  components:
  - type: Sprite
    sprite: _Omu/Objects/SkillTrainers/SyndicateSkillTrainer.rsi
    state: syndicate
  - type: Item
    sprite: _Omu/Objects/SkillTrainers/SyndicateSkillTrainer.rsi

- type: entity
  parent: BaseSkillTrainer
  id: CargoSkilltrainer
  name: cargo skill trainer
  description: A device inserted into the eye that rapidly restructures the user's mind to teach them cargo operations.
  components:
  - type: SkillGranting
    skills:
      Cargo: 2

- type: entity
  parent: [ BaseSkillTrainerSyndicate, CargoSkilltrainer ]
  id: CargoSkilltrainerSyndicate
  suffix: Cargo
  components:
  - type: ExtendDescription
    descriptionList:
    - description: skill-trainer-syndicate-extended-cargo
      fontSize: 12
      color: "#880000"
      requireDetailRange: false
      requirements:
      - !type:CharacterAntagonistRequirement
        antagonists:
        - Traitor
        - TraitorSleeper
        - Nukeops
        - NukeopsMedic
        - NukeopsCommander
    - description: mindshield-extenddescription-emag
      fontSize: 12
      color: "#11aaff"
      requireDetailRange: true
      requirements:
      - !type:CharacterMindshieldRequirement

