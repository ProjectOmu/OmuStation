- type: entity
  id: BaseBorgModuleSyndicateMedical
  parent: BaseBorgModule
  abstract: true
  components:
  - type: Tag
    tags:
    - BorgModuleSyndicateMedical
  - type: Item
    inhandVisuals:
      left:
      - state: base-icon-inhand-left
        color: "#FF0000"
      - state: base-module-inhand-left
        color: "#891417"
      - state: base-part-inhand-left
      - state: base-stripes-inhand-left
        color: "#7B0F12"
      right:
      - state: base-icon-inhand-right
        color: "#FF0000"
      - state: base-module-inhand-right
        color: "#891417"
      - state: base-part-inhand-right
      - state: base-stripes-inhand-right
        color: "#7B0F12"


- type: entity
  id: BorgModuleSyndicateMedicalTools
  parent: [ BaseBorgModuleSyndicateMedical, BaseProviderBorgModule, BaseSyndicateContraband ]
  name: medical beam gun cyborg module
  description: A module that comes with a syndicate medical beam gun and a pinpointer.
  components:
    - type: Sprite
      layers:
      - state: syndicate
      - state: icon-syndicate
    - type: ItemBorgModule
      moduleId: SyndicateMedicalBeamGun
      items:
        - MedicalBeamGunSyndicate
        - DefibrillatorSyndicateUnpowered
        - PinpointerSyndicateNuclear
    - type: BorgModuleIcon
      icon: { sprite: Interface/Actions/actions_borg.rsi, state: syndicate-medical-beam-module }

- type: entity
  id: BorgModulePostal
  parent: [ BaseBorgModuleCargo, BaseProviderBorgModule ]
  name: postal cyborg module
  description: Cargo module containing equipment for mail delivery
  components:
  - type: Sprite
    layers:
    - state: cargo
    - state: icon-postal
      sprite: _Omu/Objects/Specific/Robotics/borgmodule.rsi
  - type: ItemBorgModule
    moduleId: Postal
    items:
    - WeaponMailLake
    - MailBag
    - MailBag
  - type: DroppableBorgModule # Because salv borgs have NoWieldNeeded they can carry mail boxes with one "hand"
    moduleId: Postal
    items:
    - id: MailCapsulePrimed
      whitelist:
        tags:
        - MailCapsule
        components:
        - Mail
    - id: MailCapsulePrimed
      whitelist:
        tags:
        - MailCapsule
        components:
        - Mail
    - id: MailCapsulePrimed
      whitelist:
        tags:
        - MailCapsule
        components:
        - Mail
  - type: BorgModuleIcon
    icon: { sprite: _Omu/Interface/Actions/actions-borg.rsi, state: postal-module }

- type: entity
  id: BorgModuleAdvancedThruster
  parent: [ BaseBorgModule, BaseProviderBorgModule ]
  name: advanced thruster cyborg module
  description: NT assigned a team to design a jetpack for cyborg units, but they ran out of funding and just made a bigger fire extinguisher. It comes with a integrated GPS and mass scanner though!
  components:
  - type: Sprite
    layers:
    - state: generic
    - state: icon-fire-extinguisher
  - type: ItemBorgModule
    moduleId: FireExtinguisher
    items:
    - BorgFireExtinguisher
    - BorgHandheldGPSBasic
    - HandheldStationMapUnpowered
    - HandHeldMassScannerBorg
  - type: DroppableBorgModule
    moduleId: AdvancedThruster
    items:
    - id: JetpackMiniFilled
      whitelist:
        components:
        - Jetpack
  - type: BorgModuleIcon
    icon: { sprite: Interface/Actions/actions_borg.rsi, state: extinguisher-module }
