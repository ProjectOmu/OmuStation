- type: entity
  name: pill canister
  parent: PillCanister
  id: PillCanisterSurplusMedicalPill
  suffix: Surplus Medical Pill, 1-4
  components:
  - type: Label
    currentLabel: surplus
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: SurplusMedicalPill
        amount: !type:RangeNumberSelector
          range: 15, 15

- type: entity
  suffix: Artiplates
  parent: PrefilledSyringe
  id: SyringeArtiplates
  components:
  - type: Label
    currentLabel: reagent-name-artiplates
  - type: SolutionContainerManager
    solutions:
      injector:
        maxVol: 15
        reagents:
          - ReagentId: Artiplates
            Quantity: 15

- type: entity
  suffix: Parthenol
  parent: PrefilledSyringe
  id: SyringeParthenol
  components:
  - type: Label
    currentLabel: reagent-name-parthenol
  - type: SolutionContainerManager
    solutions:
      injector:
        maxVol: 10
        reagents:
          - ReagentId: Parthenol
            Quantity: 10
