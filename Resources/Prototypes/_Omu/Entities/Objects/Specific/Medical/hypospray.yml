# Medipens

- type: entity
  parent: ChemicalMedipen
  id: HewMedipen
  name: hew auto-injector
  description: A non-refillable medipen containing multiple doses of hew.
  components:
  - type: Item
    inhandVisuals:
      left:
      - state: base-needle-inhand-left
      - state: base-colorA-inhand-left
        color: "#573d9e"
      - state: base-colorB-inhand-left
      right:
      - state: base-needle-inhand-right
      - state: base-colorA-inhand-right
        color: "#573d9e"
      - state: base-colorB-inhand-right
  - type: Sprite
    sprite: Objects/Specific/Medical/medipen.rsi
    layers:
    - state: penacid
      map: [ "enum.SolutionContainerLayers.Fill" ]
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    changeColor: false
    emptySpriteName: penacid_empty
  - type: SolutionContainerManager
    solutions:
      pen:
        maxVol: 60
        reagents:
        - ReagentId: JuiceThatMakesYouHew
          Quantity: 60

# Autoinjector Cartridges

- type: entity
  name: autoinjector cartridge (empty)
  parent: [ BaseSecurityMedicalContraband , BaseAutoinjectorCartridge ]
  description: A empty autoinjector cartridge with endless potential. Does not allow for deviation from Nanotrasen recipes.
  id: CartridgeEmpty
  components:
  - type: Sprite
    layers:
    - state: base
  - type: SolutionCartridge
    targetSolution: hypospray
    solution:
      maxVol: 0.25
      reagents:
      - ReagentId: Microplastics
        Quantity: 0.25

- type: entity
  name: autoinjector cartridge (amoxla)
  parent: [ BaseSecurityMedicalContraband , BaseAutoinjectorCartridge ]
  description: Contains 3u of amoxla, and 7u of sugar used in a cartridge autoinjector.
  id: CartridgeAmoxla
  components:
  - type: Sprite
    layers:
    - state: base
    - state: filling
      color: "#64ecb3"
  - type: SolutionCartridge
    targetSolution: hypospray
    solution:
      maxVol: 10
      reagents:
      - ReagentId: Amoxla
        Quantity: 3
      - ReagentId: Sugar
        Quantity: 7

