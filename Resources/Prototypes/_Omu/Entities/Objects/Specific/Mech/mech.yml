- type: entity
  parent: BaseMech
  id: MechBloodredVim
  name: Bloodred Vim
  description: A miniature exosuit from Cybersun, developed to let the irreplaceable small operatives live a little longer.
  components:
  - type: Sprite
    drawdepth: Mobs
    noRot: true
    sprite: _Omu/Objects/Specific/Mechs/bloodredvim.rsi
    layers:
    - map: [ "enum.MechVisualLayers.Base" ]
      state: bloodredvim
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.15
        density: 80
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: FootstepModifier
    footstepSoundCollection:
      path: /Audio/Mecha/mechmove03.ogg
      params:
        volume: -10
  - type: Mech
    baseState: bloodredvim
    openState: brvim-open
    brokenState: brvim-broken
    maxEquipmentAmount: 4
    # keep mouse safe
    mechToPilotDamageMultiplier: 0.1
    airtight: true
    pilotWhitelist:
      tags:
      - VimPilot
    startingEquipment:
      - WeaponMechChainSword
      - WeaponMechCombatShotgun
      - WeaponMechCombatMissileRack8
      - WeaponMechCombatTeslaCannon
  - type: MeleeWeapon
    hidden: true
    attackRate: 0.8
    damage:
      types:
        Blunt: 15 #thwack
        Structural: 2
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.25
    baseSprintSpeed: 2.25 #Goobedit
  - type: Access
    tags:
    - Maintenance
  # TOOD: buzz / chime actions
  # TODO: builtin flashlight

- type: entity
  parent: MechBloodredVim
  id: MechBloodredVimBattery
  suffix: Battery
  components:
  - type: ContainerFill
    containers:
      mech-battery-slot:
      - PowerCellAntiqueProto
