- type: entity
  parent: ClothingNeckBase
  id: ClothingArmbandBase
  abstract: true
  name: armband
  description: An armband.
  components:
  - type: Item
    size: Small
    heldPrefix: right
  - type: Tag
    tags: [Armband]

- type: entity
  parent: ClothingArmbandBase
  id: ClothingArmbandMed
  name: medical armband
  description: An armband to show your connection to the medical department.
  components:
  - type: Sprite
    sprite: _Omu/Clothing/Neck/Armbands/medarmband.rsi
    state: "icon-RIGHT"
  - type: Clothing
    sprite: _Omu/Clothing/Neck/Armbands/medarmband.rsi
    equippedPrefix: right
  - type: ItemSwitch
    state: right
    showLabel: true
    states:
      right: !type:ItemSwitchState
        verb: right
        sprite:
          sprite: _Omu/Clothing/Neck/Armbands/medarmband.rsi
          state: icon-RIGHT
      left: !type:ItemSwitchState
        verb: left
        sprite:
          sprite: _Omu/Clothing/Neck/Armbands/medarmband.rsi
          state: icon-LEFT
      both: !type:ItemSwitchState
        verb: both
        sprite:
          sprite: _Omu/Clothing/Neck/Armbands/medarmband.rsi
          state: icon-BOTH

