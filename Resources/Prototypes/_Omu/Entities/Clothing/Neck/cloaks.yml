- type: entity
  parent: ClothingNeckCloakCentcom
  id: ClothingCloakCentCommAdmiral
  name: central command admiral cloak
  description: A large green cloak that demands attention, and careful steps to not trip while wearing it.
  components:
  - type: Sprite
    sprite: _Omu/Clothing/Neck/Cloaks/admiralcape.rsi
  - type: Clothing
    sprite: _Omu/Clothing/Neck/Cloaks/admiralcape.rsi

- type: entity
  parent: [ClothingNeckBase, BaseCommandContraband]
  id: ClothingNeckCloakRdFancy
  name: decorated research director's cloak
  description: A purple cloak with silver lining, appropiate for a research director.
  components:
  - type: Sprite
    sprite: _Omu/Clothing/Neck/Cloaks/rdcloak.rsi
  - type: StealTarget
    stealGroup: HeadCloak

- type: entity
  parent: [ClothingNeckBase, BaseWardenContraband, ClothingSlotBase]
  id: ClothingNeckWardenParryCloak
  name: warden's dueling cloak
  description: A red cloak with an integrated scabbard, useful for dramatically swishing at prisoners.
  components:
  - type: Sprite
    sprite: _Omu/Clothing/Neck/Cloaks/parryingcloak.rsi
  - type: ItemSlots
    slots:
      item:
        name: Rapier
        insertVerbText: sheath-insert-verb
        ejectVerbText: sheath-eject-verb
        insertSound: /Audio/Items/sheath.ogg
        ejectSound: /Audio/Items/unsheath.ogg
        whitelist:
          tags:
          - WardenRapier

- type: entity
  parent: [ClothingNeckBase, BaseCommandContraband]
  id: ClothingNeckCloakCMOFancy
  name: decorated chief medical officer's cloak
  description: A sterile blue cloak with a green cross, now decorated with a comfortable, white furred collar, as well as an attatched golden pin at the front, appropriate for a chief medical officer.
  components:
  - type: Sprite
    sprite: _Omu/Clothing/Neck/Cloaks/cmocloakdecorated.rsi
  - type: Clothing
    sprite: _Omu/Clothing/Neck/Cloaks/cmocloakdecorated.rsi
  - type: StealTarget
    stealGroup: HeadCloak

- type: entity
  parent: [ClothingNeckBase, BaseSecurityContraband]
  id: ClothingNeckCloakSergeant
  name: sergeant's shoulder cloak
  description: A cloak fit for a sergeant, it looks fancy. Comes equipped with a bodycam on the pin.
  components:
  - type: Sprite
    sprite: _Omu/Clothing/Neck/Cloaks/sergeantcloak.rsi
  - type: Clothing
    sprite: _Omu/Clothing/Neck/Cloaks/sergeantcloak.rsi
  - type: DeviceNetwork
    deviceNetId: Wired
    receiveFrequencyId: SurveillanceCameraSecurity
    transmitFrequencyId: SurveillanceCamera
  - type: SurveillanceCamera
    networkSet: true
    nameSet: true
    mobile: true
    id: Bodycam
  - type: Eye
  - type: WirelessNetworkConnection
    range: 200
  - type: SurveillanceCameraMicrophone
    blacklist:
      components:
      - SurveillanceCamera
      - SurveillanceCameraMonitor
      - RadioSpeaker
  - type: ActiveListener
    range: 10
  - type: ClothingGrantComponent
    component:
      - type: StationAiVision
        range: 4


