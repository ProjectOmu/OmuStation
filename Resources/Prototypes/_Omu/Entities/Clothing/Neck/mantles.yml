  description: A mostly black mantle with blue lining along the neck, in case the other option wasn't convincing enough.
  components:
  - type: Sprite
    sprite: _Omu/Clothing/Neck/Mantle/bsomantleblack.rsi
  - type: Clothing
    sprite: _Omu/Clothing/Neck/Mantle/bsomantleblack.rsi

- type: entity
  parent: ClothingNeckMantleBlueshield
  id: ClothingNeckMantleCCOMantle
  name: CentComm ommantle
  description: The commander's signature wrap, designed as a part of a uniform explicitly designed to torment her. Now with in built microchips!
  components:
  - type: Sprite
    sprite: _Omu/Clothing/Neck/Mantle/CCOmmantle.rsi
  - type: Clothing
    sprite: _Omu/Clothing/Neck/Mantle/CCOmmantle.rsi
  - type: Emag
    emagType: All
    emagSound: /Audio/_Goobstation/Items/card_swipe.ogg
    successText: executive-card-success
