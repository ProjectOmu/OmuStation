- type: entity
  parent: ClothingHandsGlovesEnviroglovesBase
  id: ClothingHandsGlovesEnviroglovesQM
  name: quartermaster's envirogloves
  description: Covers up those scandalous boney hands.
  components:
  - type: Sprite
    #sprite: Clothing/Hands/Gloves/Color/color.rsi
    sprite: _Omu/Clothing/Hands/Gloves/Envirogloves/color.rsi
    layers:
    - state: icon
      color: "#796755"
  - type: Item
    #sprite: Clothing/Hands/Gloves/Color/color.rsi
    sprite: _Omu/Clothing/Hands/Gloves/Envirogloves/color.rsi
    inhandVisuals:
      left:
      - state: inhand-left
        color: "#796755"
      right:
      - state: inhand-right
        color: "#796755"
  - type: Clothing
    #sprite: Clothing/Hands/Gloves/Color/color.rsi
    sprite: _Omu/Clothing/Hands/Gloves/Envirogloves/color.rsi
    clothingVisuals:
      gloves:
      - state: equipped-HAND
        color: "#796755"
  - type: Fiber
    fiberColor: fibers-light-brown

