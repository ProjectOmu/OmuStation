# When making new custom alternate envirohelms, inherit from these entities and
# replace the color fields on the layers

# Cloche Envirohelm
- type: entity
  abstract: true
  parent: ClothingHeadEnvirohelmBase
  id: ClothingHeadEnvirohelmCustomBaseCloche
  name: base custom cloche envirosuit helmet
  components:
  - type: ToggleableVisuals
    spriteLayer: light
    inhandVisuals:
      left:
      - state: on-inhand-left
        shader: unshaded
      right:
      - state: on-inhand-right
        shader: unshaded
    clothingVisuals:
      head:
      - state: on-equipped-HELMET
        shader: unshaded
  - type: Sprite
    sprite: _Omu/Clothing/Head/Envirohelms/Cloche/custom.rsi
    layers:
    - state: icon
      color: "#FFFFFF"
    - state: accent-icon
      color: "#FF0000"
    # - state: midaccent-icon
    #   color: "#0000FF"
    - state: visor-icon
    - state: valves-icon
    - state: icon-flash
      visible: false
      shader: unshaded
      map: [ "light" ]
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
        color: "#FFFFFF"
      - state: accent-inhand-left
        color: "#FF0000"
      # - state: midaccent-inhand-left
      #   color: "#0000FF"
      - state: visor-inhand-left
      right:
      - state: inhand-right
        color: "#FFFFFF"
      - state: accent-inhand-right
        color: "#FF0000"
      # - state: midaccent-inhand-right
      #   color: "#0000FF"
      - state: visor-inhand-right
  - type: Clothing
    sprite: _Omu/Clothing/Head/Envirohelms/Cloche/custom.rsi
    clothingVisuals:
      head:
      - state: equipped-HELMET
        color: "#FFFFFF"
      - state: accent-equipped-HELMET
        color: "#FF0000"
      # - state: midaccent-equipped-HELMET
      #   color: "#0000FF"
      - state: visor-equipped-HELMET
      - state: valves-equipped-HELMET

