- type: entity
  abstract: true
  parent: ClothingOuterBase
  id: ClothingGloveJacketBase
  components:
  - type: ClothingTakesUpExtraSlots
    slots:
    - gloves
  - type: FingerprintMask
  - type: GloveJacket # Components for these jackets that allows them to act as gloves. Mostly for surgery.
# if species-specific sprites are fixed to not have displacement maps apply to them, this will break.
# replacing the equipped-OUTERCLOTHING-xelthia.png file in the RSI with the one in the InsulatedJacket/insulated_jacket_unmodified folder would fix this.

- type: entity
  parent: ClothingGloveJacketBase
  id: ClothingOuterJacketSeniorPhys
  name: senior physician surgical jacket
  description: A prestigious surgical membrane jacket for the handless senior physicians.
  components:
  - type: Sprite
    sprite: _Omu/Clothing/OuterClothing/GloveJackets/seniorsurgicaljacket.rsi
  - type: Clothing
    sprite: _Omu/Clothing/OuterClothing/GloveJackets/seniorsurgicaljacket.rsi
  - type: Fiber
    fiberMaterial: fibers-nitrile

- type: entity
  parent: ClothingGloveJacketBase
  id: ClothingOuterJacketMedicus
  name: medicus surgical jacket
  description: An extra thick surgical membrane jacket for the handless medical marvel.
  components:
  - type: Sprite
    sprite: _Omu/Clothing/OuterClothing/GloveJackets/medicussurgicaljacket.rsi
  - type: Clothing
    sprite: _Omu/Clothing/OuterClothing/GloveJackets/medicussurgicaljacket.rsi
  - type: Fiber
    fiberMaterial: fibers-latex

- type: entity
  parent: [ClothingGloveJacketBase, BaseEngineeringContraband]
  id: ClothingOuterJacketSeniorEngineer
  name: senior engineer insulated jacket
  description: A prestigious insulated membrane jacket for handless engineers.
  components:
  - type: Sprite
    sprite: _Omu/Clothing/OuterClothing/GloveJackets/seniorengineerjacket.rsi
  - type: Clothing
    sprite: _Omu/Clothing/OuterClothing/GloveJackets/seniorengineerjacket.rsi
  - type: Insulated
  - type: Fiber
    fiberMaterial: fibers-insulative
    fiberColor: fibers-blue

- type: entity
  parent: [ClothingGloveJacketBase, BaseCommandContraband, AllowSuitStorageClothing, ClothingOuterStorageBase]
  id: ClothingOutJacketHoS
  name: head of security's armored jacket
  description: An armored and insulated jacket for the station's handless protector.
  components:
  - type: Sprite
    sprite: _Omu/Clothing/OuterClothing/GloveJackets/hosjacket.rsi
  - type: Clothing
    sprite: _Omu/Clothing/OuterClothing/GloveJackets/hosjacket.rsi
  - type: Insulated
  - type: Armor
    coverage: # Goobstation
    - Chest
    - Groin
    - Tail
    - Arm
    - Leg
    - Hand
    traumaDeductions: # Goobstation -
      Dismemberment: 0.2
      OrganDamage: 0.2
      BoneDamage: 0.2
      VeinsDamage: 0
      NerveDamage: 0
    modifiers:
      coefficients:
        Blunt: 0.6
        Slash: 0.6
        Piercing: 0.55
        Heat: 0.55
        Caustic: 0.6
  - type: ExplosionResistance
    damageCoefficient: 0.9
  - type: ModifyDelayedKnockdown # Goobstation
    delayDelta: 2
    knockdownTimeDelta: -2
  - type: StaminaResistance # Goobstation
    damageCoefficient: 0.7
  - type: ZombificationResistance
    zombificationResistanceCoefficient: 0.55

- type: entity
  parent: [ClothingGloveJacketBase, BaseEngineeringContraband]
  id: ClothingOuterJacketForeman
  name: foreman insulated jacket
  description: An extra prestigious insulated membrane jacket for handless supervisors.
  components:
  - type: Sprite
    sprite: _Omu/Clothing/OuterClothing/GloveJackets/foremanjacket.rsi
  - type: Clothing
    sprite: _Omu/Clothing/OuterClothing/GloveJackets/foremanjacket.rsi
  - type: Insulated
  - type: Fiber
    fiberMaterial: fibers-insulative
    fiberColor: fibers-orange
