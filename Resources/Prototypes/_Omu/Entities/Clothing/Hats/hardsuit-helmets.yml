- type: entity
  parent: ClothingHeadHardsuitWithLightBase
  id: ClothingHeadHelmetCybersunParamedic
  name: CSI-122M "Xiézhù" hardsuit helm
  description: Helmet of the Xiézhù medical hardsuit.
  components:
  - type: Sprite
    sprite: _Omu/Clothing/Head/Hardsuits/cybersunparamedhelmet.rsi
  - type: Clothing
    sprite: _Omu/Clothing/Head/Hardsuits/cybersunparamedhelmet.rsi
  - type: PointLight
    color: "#f2feff"
    radius: 7
    energy: 3
  - type: ZombificationResistance # Omustation - If the suit acts like a biosuit, the helmet should too.
    zombificationResistanceCoefficient: 0.9
  - type: Armor
    # Matching with regular paramedic helmet
    coverage:
    - Head
    traumaDeductions:
      Dismemberment: 0
      OrganDamage: 0.14
      BoneDamage: 0.14
      VeinsDamage: 0
      NerveDamage: 0
    modifiers:
      coefficients:
        Heat: 0.9
        Radiation: 0.75
        Caustic: 0.65

- type: entity
