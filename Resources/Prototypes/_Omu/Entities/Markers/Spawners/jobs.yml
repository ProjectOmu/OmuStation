# Security

- type: entity
  id: SpawnPointPrisoner
  parent: SpawnPointJobBase
  name: transitprisoner
  components:
  - type: SpawnPoint
    job_id: TransitPrisoner
  - type: Sprite
    layers:
      - state: green
      - state: prisoner

