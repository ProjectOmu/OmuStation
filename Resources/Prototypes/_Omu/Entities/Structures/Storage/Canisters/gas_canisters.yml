## Gekkerzine Canister
- type: entity
  parent: GasCanister
  id: GekkerzineCanister
  name: gekkerzine canister
  description: A canister that can contain any type of gas. This one is supposed to contain gekkerzine. It can be attached to connector ports using a wrench.
  components:
  - type: Sprite
    layers:
    - sprite: _Omu/Structures/Storage/canister.rsi
      state: gekkerzine
  - type: GasCanister
    gasMixture:
      volume: 1000
      moles:
        Gekkerzine: 1871.71051
      temperature: 293.15
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 600
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          GekkerzineCanisterBroken:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:DumpCanisterBehavior
  - type: Lock
    locked: true

- type: entity
  name: broken gekkerzine canister
  parent: GasCanisterBrokenBase
  id: GekkerzineCanisterBroken
  # I don't think this should be hidden from the spawn menu
  # in case this gets malded. We can replace the functioning one
  # with this one to make a broken canister that can't be used.
  # categories: [ HideSpawnMenu ] 
  components:
  - type: Sprite
    sprite: _Omu/Structures/Storage/canister.rsi
    state: gekkerzine-1