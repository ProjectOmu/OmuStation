- type: entity
  parent: [BaseStructure, BaseSyndicateContraband]
  id: SyndicateAutocannon
  name: syndicate autocannon
  description: A massive machinegun assembly mounted to a base. Accepts .30 rifle L6 magazines and fires them at a blistering fast pace. Fires in 6 round bursts. Useful for mounting in narrow hallways or shuttles
  components:
  - type: InteractionOutline
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.GunVisualLayers.Base" ]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
    sprite: _Omu/Structures/Cannons/syndicate_autocannon.rsi
  - type: Gun
    projectileSpeed: 40 # ~ buff of 10
    fireRate: 0.3
    minAngle: 1
    maxAngle: 15
    angleIncrease: 3.5
    angleDecay: 35
    burstFireRate: 12 # For reference, L6 is 8
    selectedMode: Burst
    availableModes:
    - Burst
    shotsPerBurst: 6 # 96 damage per burst against unarmored
    soundGunshot:
      path: /Audio/_Omu/Weapons/penmanfire.ogg
    soundEmpty:
      path: null
  - type: MagazineAmmoProvider
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        priority: 2
        whitelist:
          tags:
          - MagazineLightRifleBox
        startingItem: MagazineLightRifleBox
        insertSound:
          path: /Audio/Weapons/Guns/MagIn/kinetic_reload.ogg
          params:
            pitch: 1.5
        ejectSound:
          path: /Audio/Weapons/Guns/MagOut/smg_magout.ogg
          params:
            pitch: 0.75
  - type: Anchorable
  - type: AmmoCounter
  - type: GunSignalControl
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
  - type: Rotatable
  - type: DeviceLinkSink
    ports:
    - Trigger
    - Toggle
    - On
    - Off
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 250
      behaviors:
        - !type:DoActsBehavior
          acts: ["Destruction"]

- type: entity
  parent: [BaseItem, BaseSyndicateContraband]
  id: DisassembledSyndicateAutocannon
  name: disassembled syndicate autocannon
  description: A large box containing a disassembled syndicate autocannon. Anchored on assembly.
  components:
  - type: Item
    size: Huge
  - type: Sprite
    sprite: _Omu/Structures/Cannons/syndicate_autocannon.rsi
    state: box
  - type: SpawnItemsOnUse
    items:
    - id: SyndicateAutocannon
    sound:
      path: /Audio/Weapons/Guns/Bolt/lmg_bolt_closed.ogg
      params:
        pitch: 0.5
