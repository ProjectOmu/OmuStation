- type: entity
  id: ModularHud
  parent: ClothingEyesBase
  name: Modular HUD
  description: A modular HUD that can be upgraded with various lenses.
  components:
  - type: Sprite
    sprite: _Omu/Clothing/Eyes/modularhud.rsi
  - type: Clothing
    sprite: _Omu/Clothing/Eyes/modularhud.rsi
  - type: Item
    size: Small
  - type: StaticPrice
    price: 1000
  - type: ContainerContainer
    containers:
      upgrade_slot_1: !type:ContainerSlot
  - type: ItemSlots
    slots:
      upgrade_slot_1:
        name: weapon-upgrade-slot-name-first
        swap: false
        priority: 4
        insertDelay: 1.2
        ejectDelay: 0.9
        whitelist:
          tags:
          - ModularHudUpgrade
