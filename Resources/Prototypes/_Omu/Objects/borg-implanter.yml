# Implanters

- type: entity
  name: borgimplanter
  id: BaseBorgImplanter
  parent: BaseItem
  abstract: true
  components:
  - type: ItemSlots
  - type: ContainerContainer
    containers:
      implanter_slot: !type:ContainerSlot { }
  - type: Implanter
    whitelist:
      tags:
      - BorgImplant
    currentMode: Draw
    implanterSlot:
      name: Implant
      locked: True
      priority: 0
      whitelist:
        tags:
        - SubdermalImplant
    allowDeimplantAll: false
  - type: Sprite
    sprite: Objects/Specific/Medical/implanter.rsi # temporary, might alter this later since it's a chip and not a medical implant
    state: implanter0
    layers:
    - state: implanter0
      map: [ "implantOnly" ]
      visible: true
    - state: implanter1
      map: [ "implantFull" ]
      visible: false
  - type: Item
    sprite: Objects/Specific/Medical/implanter.rsi
    heldPrefix: implanter
    size: Small
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ImplanterVisuals.Full:
        implantFull:
          True: {visible: true}
          False: {visible: false}
      enum.ImplanterImplantOnlyVisuals.ImplantOnly:
        implantOnly:
          True: {state: broken}
          False: {state: implanter0}
  - type: UserInterface
    interfaces:
      enum.DeimplantUiKey.Key:
        type: DeimplantBoundUserInterface
  - type: PhysicalComposition #Goobstation - Recycle update
    materialComposition:
      Steel: 125
      Glass: 125

- type: entity
  id: BorgImplanter
  parent: BaseBorgImplanter
  name: chip extractor
  description: "A dual-purpose syringe designed for the removal of modification chips. Once a chip is extracted, it is stored within and can be re-administered."
  components:
  - type: Tag
    tags:
    - Trash

- type: entity
  id: BaseImplantOnlyBorgImplanter
  parent: BorgImplanter
  description: A disposable syringe exclusively designed for the injection of modification chips.
  abstract: true
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/implanter.rsi
    state: implanter0
    layers:
    - state: implanter1
      map: [ "implantFull" ]
      visible: true
    - state: implanter0
      map: [ "implantOnly" ]
  - type: Implanter
    currentMode: Inject
    implantOnly: true
