- type: entityTable
  id: LockerFillBosun
  table: !type:AllSelector
    children:
    - id: OxygenTankFilled
    - id: NitrogenTankFilled
    - id: ClothingShoesBootsMag
    - id: ClothingOuterHardsuitBosun
    - id: ClothingMaskGasExplorer

- type: entity
  id: LockerBosunFilled
  suffix: Filled
  parent: LockerBosun
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:NestedSelector
        tableId: LockerFillBosun

- type: entityTable
  id: LockerFillForeman
