- type: entity # todo: when the silo rework comes in, this and all references (in Lockers/heads.yml) should be removed
  parent: ClothingBackpackDuffelEngineering # intended to hold off every department from clamoring
  id: ClothingBackpackDuffelBasicMaterials # for cargo to give them basic materials roundstart
  name: sheet duffel # have you ever wondered why we don't have FTL files for name and description?
