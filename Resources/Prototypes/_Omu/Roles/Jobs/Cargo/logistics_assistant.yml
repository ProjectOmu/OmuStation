- type: job
  id: LogisticsAssistant
  name: job-name-logistics-assistant
  description: job-description-logistics-assistant
  playTimeTracker: JobLogisticsAssistant
  requirements:
  - !type:OverallPlaytimeRequirement
    time: 0.5h # Omustation
  startingGear: LogisticsAssistantGear
  icon: "JobIconLogisticsAssistant"
  supervisors: job-supervisors-cargo
  guides: # goobstation
  - Cargo
  goobcoins: 20 #Goob content
  access:
  - Cargo
  - Maintenance
  extendedAccess:
  - Salvage
  - External # goobstation
  special:
  - !type:GiveItemOnHolidaySpecial
    holiday: BoxingDay
    prototype: BoxCardboard
  - !type:AddComponentSpecial
    components:
    - type: RoundStartSkillGranting #omu skill system 
      department: [ Cargo, Crew ]
      commandSkillDepartment: [ Cargo ]
      skillDic:
        Cargo: 2
        Combat: 0
        Command: 0
        Engineering: 0
        Medical: 0
    - type: SpeciesBasedSkillAddition #omu skill system
      skillDic:
        Harpy:
          Cargo: 1
          Combat: -1
          Command: -1
          Engineering: -1
          Medical: -1

- type: startingGear
  id: LogisticsAssistantGear
  equipment:
    shoes: ClothingShoesColorBlack
    id: LogisticsAssistantPDA
    ears: ClothingHeadsetCargo
    pocket1: AppraisalTool
    #storage:
    #back:
    #- Stuff

- type: chameleonOutfit
  id: LogisticsAssistantChameleonOutfit
  job: LogisticsAssistant
  equipment:
    head: ClothingHeadHatCargosoft
    eyes: ClothingEyesGlassesCheapSunglasses
    mask: ClothingMaskBreath
    neck: ClothingNeckScarfStripedBrown
    outerClothing: ClothingOuterWinterCargo
    gloves: ClothingHandsGlovesFingerless
