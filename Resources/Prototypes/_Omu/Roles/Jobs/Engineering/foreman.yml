- type: job
  id: EngineeringForeman
  name: job-name-engineering-foreman
  description: job-description-engineering-foreman
  playTimeTracker: JobEngineeringForeman
  requirements:
  - !type:OverallPlaytimeRequirement
    time: 360000 #100 hours
  - !type:DepartmentTimeRequirement
    department: Engineering
    time: 360000 #100 hours
  - !type:RoleTimeRequirement
    role: JobChiefEngineer
    time: 36000 #10 hrs
  - !type:RoleTimeRequirement
    role: JobAtmosphericTechnician
    time: 252000 #70 hrs
  - !type:RoleTimeRequirement
    role: JobStationEngineer
    time: 108000 #30 hrs
  weight: 1
  startingGear: EngineeringForemanGear
  icon: "JobIconEngineeringForeman"
  supervisors: job-supervisors-ce
  canBeAntag: false
  guides:
  - Engineering
  - EngineeringSOP
  - ForemanSOP
  goobcoins: 30
  access:
  - Engineering
  - Atmospherics
  - Maintenance
  - External
  special:
  - !type:AddComponentSpecial
    components:
    - type: RoundStartSkillGranting #omu skill system 
      department: [ Engineering, Crew ]
      commandSkillDepartment: [ Engineering ]
      skillDic:
        Cargo: 0
        Combat: 0
        Command: 1
        Engineering: 2
        Medical: 0
    - type: SpeciesBasedSkillAddition #omu skill system
      skillDic:
        Harpy:
          Cargo: -1
          Combat: -1
          Command: 1
          Engineering: 1
          Medical: -1

- type: startingGear
  id: EngineeringForemanGear
  equipment:
    id: EngineeringForemanPDA
    eyes: ClothingEyesGlassesMeson
    belt: ClothingBeltUtilityEngineering
    ears: ClothingHeadsetEngineering
  storage:
    back:
    - UniqueForemanLockerTeleporter

- type: chameleonOutfit
  id: EngineeringForemanChameleonOutfit
  job: EngineeringForeman
  hasMindShield: true
  equipment:
    head: ClothingHeadHatBeretForeman
    eyes: ClothingEyesGlassesMeson
    mask: ClothingMaskGasAtmos
    outerClothing: ClothingOuterVestHazard
    neck: ClothingNeckMantleForeman
    gloves: ClothingHandsGlovesAtmosInsulated
