- type: job
  id: TransitPrisoner
  name: job-name-transit-prisoner
  description: job-description-transit-prisoner
  playTimeTracker: JobTransitPrisoner
  overrideConsoleVisibility: true
  requirements:
  - !type:DepartmentTimeRequirement
    department: Security
    time: 36000 # = 10 hours
  startingGear: TransitPrisonerGear
  icon: "JobIconPrisoner"
  supervisors: job-supervisors-security
  canBeAntag: false
  goobcoins: 10 # 1/3 Cadet
  access:
  - GenpopEnter
  special:
  - !type:AddImplantSpecial
    implants: [ TrackingImplant ]
  - !type:AddComponentSpecial
    components:
      - type: RoundStartSkillGranting #omu skill system 
        department: [ NONE ]
        skillDic:
          Cargo: 0
          Combat: 1
          Command: 0
          Engineering: 0
          Medical: 0
      - type: SpeciesBasedSkillAddition #omu skill system
        skillDic:
          Harpy:
            Cargo: -1
            Combat: -1
            Command: -1
            Engineering: -1
            Medical: -1

- type: startingGear
  id: TransitPrisonerGear
  equipment:
    ears: ClothingHeadsetPrison # Delta-V
    id: TransitPrisonerPDA

- type: chameleonOutfit
  id: TransitPrisonerChameleonOutfit
  job: TransitPrisoner
  equipment:
    jumpsuit: ClothingUniformJumpsuitPrisoner
    id: TransitPrisonerPDA
