- type: job
  id: CentCommIntern
  name: job-name-centcomm-intern
  description: job-description-inspector
  playTimeTracker: JobCentCommIntern
  setPreference: false
  startingGear: CentcomInternGear
  icon: "JobIconNanotrasen"
  supervisors: job-supervisors-centcom
  canBeAntag: false
  requirements:
  - !type:AgeRequirement
    requiredAge: 18
  accessGroups:
  - AllAccess
  access:
  - CentralCommand
  - NanotrasenRepresentative
  - BlueshieldOfficer
  special:
  - !type:AddImplantSpecial
    implants: [ MindShieldImplantCentComm, FreedomImplant, BluespaceLifelineImplant, RadioImplantCentcomm, NutrimentPumpImplant, StypticStimulatorImplant ]
  - !type:AddComponentSpecial
    components:
      - type: RoundStartSkillGranting #omu skill system 
        department: [ CentralCommand ]
        skillDic:
          Cargo: 2
          Combat: 0
          Command: 2
          Engineering: 0
          Medical: 2
      - type: SpeciesBasedSkillAddition #omu skill system
        skillDic:
          Harpy:
            Cargo: 1
            Combat: -1
            Command: -1
            Engineering: -1
            Medical: 1

- type: startingGear
  id: CentcomInternGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitCentcomOfficial
    shoes: ClothingShoesBootsJack
    head: ClothingHeadHatCentcomcap
    eyes: ClothingEyesGlassesCentComm
    gloves: ClothingHandsGlovesHeavyGoldenTrim
    back: ClothingBackpackSatchelLeather
    belt: BoxFolderCentComClipboard
    neck: ExecutiveInternIDCard
    id: CentCommInternPDA
    ears: ClothingHeadsetAltCentCom
    pocket1: RubberStampCentcomIntern
  storage:
    back:
    - HandheldFaxCentCommIntern

