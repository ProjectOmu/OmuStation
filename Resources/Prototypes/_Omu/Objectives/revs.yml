- type: entity
  parent: BaseObjective
  id: RevolutionObjective
  name: Revolution!
  description: Seek instruction from your Head Rev!
  components:
  - type: Objective
    icon:
      sprite: Mobs/Species/Human/organs.rsi
      state: brain
    issuer: objective-issuer-revolution
    difficulty: 1
  - type: SurviveCondition    #Same as IAA

- type: entity
  parent: BaseAction
  id: ActionConfigureObjective
  name: Set Objective
  description: Set a custom objective for your underlings, helps organise things!
  components:
  - type: Action
    itemIconStyle: BigItem
    priority: -20
    useDelay: 1
  - type: InstantAction
    event: !type:ObjectiveConfigureActionEvent
