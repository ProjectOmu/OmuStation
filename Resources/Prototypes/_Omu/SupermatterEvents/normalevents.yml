- type: weightedRandom
  id: NormalEvents
  weights:
    GasSpillOxy: 1
    GasSpillNitrogen: 1
    GasSpillCarbon: 1
    GasSpillFrezon: 2
    SMBSAnomSpawn: 2

- type: entity
  parent: MobOreCrab
  id: MobSupermatterCrab
  description: An ore crab made from Supermatter.
  suffix: Supermatter
  components:
  - type: SupermatterImmune
  - type: RadiationSource
    intensity: 1.0
  - type: Sprite
    state: bananium_crab
  - type: FactionException
  - type: NPCRetaliation
    attackMemoryLength: 10
  - type: NpcFactionMember
    factions:
      - SimpleNeutral
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 30
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          SupermatterSliver:
            min: 1
            max: 3
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Slippery
    slipData:
      launchForwardsMultiplier: 2
  - type: StepTrigger
    intersectRatio: 0.2
  - type: Fixtures
    fixtures:
      slips:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        hard: false
        layer:
          - SlipLayer
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 20
        mask:
        - MobMask
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 3
