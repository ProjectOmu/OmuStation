- type: entity
  parent: BaseGameRule
  id: VoidwalkerSpawn
  components:
  - type: StationEvent
    weight: 2
    earliestStart: 30
    maxOccurrences: 1
    minimumPlayers: 35
    duration: null
    chaos:
      Hostile: 20
      Friend: 20
      Combat: 40
      Death: 60
      Medical: 40
    eventType: HostilesSpawn
  - type: GameRule
    chaosScore: 600
  - type: SpaceSpawnRule
    spawnDistance: 0
  - type: AntagSpawner
    prototype: BaseMobVoidWalker
  - type: VoidwalkerRule
  - type: AntagObjectives
    objectives:
    - VoidwalkerKidnapObjective
    - VoidwalkerSurviveObjective
  - type: AntagSelection
    agentName: voidwalker-round-end-agent-name
    definitions:
    - spawnerPrototype: SpawnPointGhostVoidwalker
      min: 1
      max: 1
      pickPlayer: false
      mindRoles:
      - MindRoleVoidwalker

- type: entity
  parent: BaseStationEvent
  id: LightsOutMajor
  name: Lights Out (Major)
  components:
  - type: LightsOutMajorRule
  - type: StationEvent
    earliestStart: 15
    weight: 5
    duration: null
    eventType: Maintenance
  - type: GameRule
    delay:
      min: 0
      max: 0
    chaosScore: 200

- type: entity
  parent: BaseStationEvent
  id: LightsOutMinor
  name: Lights Out (Minor)
  components:
  - type: LightsOutMinorRule
  - type: StationEvent
    earliestStart: 15
    weight: 5
    duration: null
    eventType: Maintenance
  - type: GameRule
    delay:
      min: 0
      max: 0
    chaosScore: 80

- type: entity      #Its the xeno infestation but for one!
  parent: BaseGameRule
  id: LoneXenomorph
  components:
  - type: StationEvent
    weight: 3
    duration: null
    minimumPlayers: 20
    earliestStart: 30
    maxOccurrences: 2
    chaos:
      Hostile: 200
      Medical: 200
      Death: 200
    eventType: HostilesSpawn
  - type: GameRule
    chaosScore: 400
  - type: VentSpawnRule
  - type: AntagSpawner
    prototype: MobXenomorphLarva
  - type: XenomorphsRule
    xenomorphInfestationSound:
      collection: xeno_start
      params:
        volume: -4
  - type: AntagObjectives
    objectives:
    - XenomorphSurviveObjective
  - type: AntagSelection
    agentName: xenomorph-round-end-agent-name
    definitions:
    - spawnerPrototype: SpawnPointGhostXenomorph
      min: 1
      max: 1
      pickPlayer: false
      briefing:
        text: xenomorph-role-greeting
        color: "#8c3986"
      mindRoles:
      - MindRoleXenomorph
