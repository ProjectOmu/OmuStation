- type: entity
  id: BeeMigration
  parent: BaseStationEventShortDelay
  components:
  - type: StationEvent
    startAnnouncement: station-event-vent-creatures-start-announcement
    startAudio:
      path: /Audio/Announcements/attention.ogg
    earliestStart: 15
    weight: 4
    duration: 30
    minimumPlayers: 15
    eventType: Chaotic
  - type: GameRule
    chaosScore: 30
  - type: VentCrittersRule
    max: 7
    min: 4
    table: !type:GroupSelector
      children:
      - id: MobBee

