# base entity that holds all the chaos metric components.
# all director variants inherit from this so they all measure the same things.
# it is not abstract so admins can spawn it alone to read metrics without scheduling events.
- type: entity
  id: GameDirector
  parent: BaseGameRule
  categories: [ HideSpawnMenu ]
  components:
  - type: GameDirector
  - type: AnomalyMetric   # tracks anomalies and kudzu
  - type: CombatMetric    # tracks crew vs hostiles, deaths, medical state
  - type: DoorMetric      # tracks emaged airlocks, fires, pressure and power loss
  - type: FoodMetric      # tracks crew hunger, thirst and silicon charge
  - type: PuddleMetric    # tracks puddles and blood on the floor

# warmonger preset - starts with two antag groups, requires 25+ players
# stories lean toward combat so it fits high-population rounds
- type: entity
  id: CombatDynamic
  parent: GameDirector
  categories: [ HideSpawnMenu ]
  components:
  - type: GameRule
    minPlayers: 25
  - type: GameDirector
    dualAntags: true
    stories:
      - RelaxedAttack
      - ScienceAttack
      - MajorCombat

# drifter preset - no roundstart antags, calm stories only
# good for low-pop rounds where the crew would not survive a major attack
- type: entity
  id: CalmDynamic
  parent: GameDirector
  categories: [ HideSpawnMenu ]
  components:
  - type: GameDirector
    noRoundstartAntags: true
    stories:
      - Relaxed
      - Science

# --- stories ---
# a story is a sequence of beats the director walks through in order.
# the director picks one randomly based on player count at the start of each story cycle.

# calm round with one mild threat then engineering trouble
- type: story
  id: Relaxed
  description: A small attack
  beats:
    - Peace
    - AttackMild
    - PowerIssues

# anomaly and science focused round with engineering issues at the end (30+ players)
- type: story
  id: Science
  description: Science and engineering issues
  minPlayers: 30
  beats:
    - Peace
    - MadScience
    - Peace
    - PowerIssues
    - RepairStation

# combat preset version of Relaxed - mild attack then engineering trouble
- type: story
  id: RelaxedAttack
  description: Mostly calm with a couple of minor problems.
  beats:
    - Peace
    - AttackMild
    - PowerIssues

# science chaos followed by a mild attack, then repairs (30+ players)
- type: story
  id: ScienceAttack
  description: Science, minor attack and then engineering issues
  minPlayers: 30
  beats:
    - Peace
    - MadScience
    - AttackMild
    - Peace
    - PowerIssues
    - RepairStation

# full arc: calm -> mild attack -> engineering -> major assault -> recovery -> repairs (40+ players)
- type: story
  id: MajorCombat
  description: A minor and then major attack
  minPlayers: 40
  beats:
    - Peace
    - AttackMild
    - PowerIssues
    - Attackers
    - RestoreOrder
    - RepairStation
    - Peace

# --- story beats ---
# a beat defines what chaos level the director is aiming for.
# goal values are targets the director tries to reach by picking matching events.
# the closer current chaos is to the goal, the less the director will interfere.
# negative Combat means the crew is strong (good). positive means the station is losing (bad).

# calm beat - crew in control, small spread of low-level chaos across all categories
- type: storyBeat
  id: Peace
  description: Minor Chaos across a wide range
  goal:
    Combat: -200  # crew should be clearly winning (friendlies outnumber/outpower hostiles)
    Anomaly: 100  # a few anomalies around, nothing critical
    Atmos: 200    # minor atmos issues, enough to keep engineers busy
    Power: 100    # some power flickers, not a blackout
    Mess: 100     # janitor has work to do
    Hunger: 100   # crew is a bit hungry, cook should be cooking
    Thirst: 100   # crew is a bit thirsty
    Medical: 100  # some minor injuries, medbay is not overwhelmed

# engineering focused beat - station takes a beating from atmos and power failures
- type: storyBeat
  id: PowerIssues
  description: Create high engineering chaos
  goal:
    Atmos: 400    # serious atmos problems (fires, pressure loss)
    Power: 400    # widespread power outages
    Medical: 100  # some injuries from the chaos, but not a massacre

# anomaly outbreak beat - science goes wrong, ends early if things spiral out of control
- type: storyBeat
  id: MadScience
  description: Create high Science chaos
  goal:
    Anomaly: 400  # many anomalies active or growing
    Power: 100
    Atmos: 100
    Medical: 100
  endIfAnyWorse:   # bail out if the situation becomes genuinely dangerous
    Anomaly: 500   # anomalies completely out of hand
    Power: 300     # power collapse
    Medical: 300   # too many injuries
    Death: 400     # too many bodies
    Combat: -100   # crew is losing the fight

# major assault beat - large hostile force on station
- type: storyBeat
  id: Attackers
  description: Drive high combat
  goal:
    Hostile: 100   # roughly 10 hostiles worth of threat on station
  endIfAnyWorse:   # end if the station is already collapsing from other problems
    Atmos: 800
    Power: 800
    Medical: 600
    Death: 400
    Combat: -50    # crew is barely holding on

# mild assault beat - a small hostile presence, enough to create tension
- type: storyBeat
  id: AttackMild
  description: Drive medium combat
  goal:
    Hostile: 40    # roughly 4 hostiles worth of threat
  endIfAnyWorse:
    Atmos: 400
    Power: 400
    Medical: 300
    Death: 300
    Combat: -100   # crew should still clearly be winning

# de-escalation beat - director sends calming events until things settle down
- type: storyBeat
  id: RestoreOrder
  description: Send help to quell disorder on the station
  goal:
    Hostile: 10   # drive hostiles way down
    Atmos: 0      # fix the atmosphere
    Medical: 0    # heal the injured
  endIfAllBetter: # move on once everything is under control
    Atmos: 200
    Hostile: 20
    Medical: 200

# repair beat - focus on fixing infrastructure after a rough round
- type: storyBeat
  id: RepairStation
  description: Repair that station
  goal:
    Atmos: 0      # no atmos problems
    Power: 0      # no power problems
    Medical: 0    # no injuries
  endIfAllBetter: # move on once repairs are done
    Atmos: 200
    Power: 200
