- type: entity
  id: SecretDoublePlusMid
  parent: BaseGameRule
  categories: [ HideSpawnMenu ]
  components:
  - type: SecretDoublePlus
    minStartingChaos: 12
    maxStartingChaos: 16
    chaosChangeVariationMin: 0.85 # 0.65 -> 0.85, temporary change for testing
    chaosChangeVariationMax: 1.2 # 1.3 -> 1.2, temporary change for testing
    roundStartChaosMatchingPower: 1
    midRoundChaosMatchingPower: 6
    eventIntervalMin: 180
    eventIntervalMax: 450
    chaosFactors:
    - !type:LivingPlayersFactor
      livingChaosChange: -0.0175
    - !type:DeadPlayersFactor
      deadChaosChange: 0.045
    - !type:PendingRuleFactor
      interval: 10
    - !type:AntagAmbientFactor
      interval: 30
      chaosRates: Standard
  - type: SelectedGameRules
    scheduledGameRules: !type:NestedSelector
      tableId: SecretPlusTable

- type: ambientAntagChaosRates
  id: Standard
  objectives:
    blob:
      components: [ BlobCaptureCondition ]
      chaos: 0.1
      expectedTime: 1800
      decayPeriod: 1800
    contract:
      components: [ MeetContractWeightCondition, SignContractCondition ]
      chaos: 0.01
    cult:
      components: [ CosmicConversionCondition, CosmicTierCondition, CosmicEntropyCondition, CosmicEffigyCondition, CosmicVictoryCondition ]
      chaos: 0.03
    heretic:
      components: [ HereticKnowledgeCondition ]
      chaos: 0.075
    kill:
      components:
        - AbsorbCondition
        - AbsorbChangelingCondition
        - HereticSacrificeCondition
        - ImpersonateCondition
        - KillPersonCondition
        - StealDNACondition
        - SlaughterDevourCondition
        - SlaughterKillEveryoneCondition
        - SlaughterKillTheWizardCondition
        - TeachALessonCondition
      chaos: 0.05
      expectedTime: 2700
      decayPeriod: 900
    nuke:
      components: [ DetonateNukeCondition ]
      chaos: 0.5
      expectedTime: 2400
      decayPeriod: 2400
    steal:
      components: [ StealCondition ]
      chaos: 0.025
      expectedTime: 2700
      decayPeriod: 900
  presence:
    abductor:
      antags: [ LoneAbductorAntag, AbductorScientistAntag, AbductorAgentAntag ]
      chaos: 0.1
    chimera:
      antags: [ Chimera, LetoferolSleeper ]
      chaos: 0.085
    colossus:
      antags: [ CosmicAntagColossus ]
      chaos: 0.25
    conspirator:
      antags: [ Conspirator ]
      chaos: 0.012
    dragon:
      antags: [ Dragon ]
      chaos: 0.5
    shadowling:
      antags: [ Shadowling ]
      chaos: 0.2
    ninja:
      antags: [ SpaceNinja ]
      chaos: 0.2
    ntagent:
      antags: [ NTAgent ]
      chaos: 0.1
    wizard:
      antags: [ Wizard ]
      chaos: 0.5
    xenoborg:
      antags: [ Xenoborg ]
      chaos: 0.075 # Roundstart xorgs get two mind roles for some reason (later converted xorgs don't) so we need to reduce their ambient chaos
    xenomorph:
      antags: [ Xenomorph, XenomorphsInfestationRoundstart ]
      chaos: 0.15
    zombie:
      antags: [ Zombie, InitialInfected ]
      chaos: 0.085
