    minPlayers: 30
    chaosScore: 1500
  - type: AntagSelection
    definitions:
    - prefRoles: [ Traitor ]
      max: 10
      playerRatio: 7
      blacklist:
        components:
        - AntagImmune
      lateJoinAdditional: true
      mindRoles:
      - MindRoleTraitor

