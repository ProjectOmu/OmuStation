- type: reagent
  id: CoolantIPC
  name: reagent-name-ipccoolant
  desc: reagent-desc-ipccoolant
  physicalDesc: reagent-physical-desc-reflective
  flavor: bitter
  flavorMinimum: 0.05
  recognizable: true
  color: "#44BB9E"
  metabolisms:
    Food:
      effects:
      - !type:PopupMessage
        conditions:
          - !type:MetabolizerTypeCondition
            type:
            - Vox
            inverted: true
        type: Local
        visualType: MediumCaution
        messages: [ "generic-reagent-effect-sick" ]
        probability: 0.5
      - !type:Vomit
        probability: 0.1
        conditions:
          - !type:MetabolizerTypeCondition
            type:
            - Vox
            inverted: true
      - !type:HealthChange
        conditions:
        - !type:MetabolizerTypeCondition
          type:
          - Vox
          inverted: true
        damage:
          types:
            Poison: 1
      - !type:SatiateThirst
        factor: 1
        conditions:
        - !type:MetabolizerTypeCondition
          type:
          - Vox

- type: reagent
  id: Supermatter
  name: reagent-name-supermatter
  desc: reagent-desc-supermatter
  flavor: metallic
  physicalDesc: reagent-physical-desc-crystalline
  color: "#FFFF00"
  metabolisms:
    Food:
      effects:
      - !type:HealthChange
        damage:
          types:
            Radiation: 90
