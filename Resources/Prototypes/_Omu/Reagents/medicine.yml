- type: reagent
  id: Zoleadone # zoleadronic acid + -adone
  name: reagent-name-zoleadone
  group: Medicine
  desc: reagent-desc-zoleadone
  physicalDesc: reagent-physical-desc-milky
  flavor: medicine
  color: "#fff0d9"
  worksOnTheDead: true
  metabolisms:
    Medicine:
      effects:
        - !type:AdjustBoneDamage
          conditions:
          - !type:TemperatureCondition
            max: 213.0
          amount: -11 # 1 healing per bone on a humanoid, heals bones to full in 1 minute

- type: reagent 
  id: Setrozone # my name isnt as smart as the one above i just think it rolls off the tongue
  name: reagent-name-setrozone
  group: Medicine
  desc: reagent-desc-setrozone
  physicalDesc: reagent-physical-desc-unusual
  flavor: medicine
  color: "#8800D1"
  worksOnTheDead: true
  metabolisms:
    Medicine:
     effects: 
        - !type:ReduceRotting
          conditions:
          - !type:MobStateCondition
            mobstate: Dead
          seconds: -15 #rots you so you better use it quick or mix with de-rotters
        - !type:HealthChange
          conditions:
          - !type:MobStateCondition
            mobstate: Dead
          damage:
            types:
              Poison: -2
        - !type:HealthChange
          conditions:
          - !type:MobStateCondition
            mobstate: Dead
          damage:
            groups:
              Brute: -15 # it divides it so its not like 30000 heal for free which i guess makes sense
              Burn: -15
              Genetic: 4 # lazy people chem with drawback