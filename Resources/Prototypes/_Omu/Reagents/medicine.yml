- type: reagent
  id: Zoleadone # zoleadronic acid + -adone
  name: reagent-name-zoleadone
  group: Medicine
  desc: reagent-desc-zoleadone
  physicalDesc: reagent-physical-desc-milky
  flavor: medicine
  color: "#fff0d9"
  worksOnTheDead: true
  metabolisms:
    Medicine:
      effects:
        - !type:AdjustBoneDamage
          conditions:
          - !type:TemperatureCondition
            max: 213.0
          amount: -11 # 1 healing per bone on a humanoid, heals bones to full in 1 minute

- type: reagent # cloning procenyl entry since we're following a similar mechanism
  id: Cyclogenol
  name: reagent-name-cyclogenol
  group: Medicine
  desc: reagent-desc-cyclogenol
  physicalDesc: reagent-physical-desc-thick-and-grainy # delicate crystals in alcoholic syrup
  flavor: astringent # tastes like alcohol
  color: "#4f271b" # muddy reddish brown
  metabolisms:
    Medicine: #some negative effects for drinking the precursor just for the alcohol
      effects:
        - !type:AdjustReagent
          reagent: Ethanol
          amount: 0.15
        - !type:Drunk
        - !type:Vomit
          conditions:
          - !type:MetabolizerTypeCondition # Goobstation - Yowie
            type: [ Yowie ]
            inverted: true
          probability: 0.6
        - !type:PopupMessage
          type: Local
          visualType: Medium
          messages: [ "generic-reagent-effect-nauseous" ]
          probability: 0.2
        - !type:HealthChange
          conditions:
          - !type:MetabolizerTypeCondition
            type: [ Yowie ]
            inverted: true
          probability: 0.6
          damage:
            types:
              Slash: 0.5 # pointy crystals
              Radiation: 0.3 # it's literally part mutagen

- type: reagent
  id: Recyclogenix # Working name, maybe choose different suffix?
  name: reagent-name-recyclogenix
  group: Medicine
  desc: reagent-desc-recyclogenix
  physicalDesc: reagent-physical-desc-shimmering
  flavor: medicine
  color: "#990c09" # velvet red
  worksOnTheDead: true # Omu
  metabolisms:
    Medicine:
      metabolismRate: 0.05 # very slow metabolism, only metabolizes at all so the damage procs while it processes in
      effects:
      - !type:AdjustReagent
        conditions:
        - !type:ReagentCondition
            reagent: Recyclogenix
            min: 34 # SHOULD allow it to hit the 40u polymorph trigger point before we make enough cytogenecin to start purging
        - !type:TemperatureCondition # cloned from cryoxadone, makes this a cryo med
            max: 175.0
        reagent: Cytogenecin
        amount: 1.2 # 0.5 -> 0.6 proportion, multiplied by two to get per unit basis; supposed to make around 48 cytogenecin
      - !type:AdjustReagent
        amount: -50
        reagent: BirdFlu
      - !type:AdjustReagent
        amount: -50
        reagent: Mothamphetamine
      - !type:AdjustReagent
        amount: -50
        reagent: Cacaphonium
      - !type:AdjustReagent
        amount: -50
        reagent: Chitterzine
      - !type:AdjustReagent
        amount: -50
        reagent: Marotine
      - !type:AdjustReagent
        amount: -50
        reagent: Methril
      - !type:AdjustReagent
        amount: -50
        reagent: BirdFluConcentrate
      - !type:AdjustReagent
        amount: -50
        reagent: MothamphetamineConcentrate
      - !type:AdjustReagent
        amount: -50
        reagent: MarotineConcentrate
      - !type:AdjustReagent
        amount: -50
        reagent: MethrilConcentrate
      - !type:AdjustReagent
        amount: -50
        reagent: CorgiJuice
      - !type:AdjustReagent
        amount: -50
        reagent: Tranquility
      - !type:AdjustReagent
        amount: -50
        reagent: BingleJuice
      - !type:AdjustReagent
        amount: -50
        reagent: Carpolin
      - !type:AdjustReagent
        amount: -50
        reagent: CatDrugs
      - !type:Unpolymorph
        conditions:
        - !type:ReagentCondition # have to have a certain amount of it in the blood
          reagent: Recyclogenix
          min: 38
        - !type:AnyTagCondition
          tags: # blacklist letoferol and romerol
          - Chimera
          - Zombie
          inverted: true
        - !type:TemperatureCondition # dependent on cryonics to work
          max: 175.0
      - !type:HealthChange
          conditions:
          - !type:TemperatureCondition
            max: 175.0
          scaleByTemperature: # Shitmed Change
            min: 100.0
            max: 175.0
            scale: 1.6
          damage: # deals mild damage to the cells as it's reverting the change
            types:
                Cellular: 0.4 # should come to around 16 cellular damage per 40u

- type: reagent
  id: Cytogenecin
  name: reagent-name-cytogenecin
  group: Medicine
  desc: reagent-desc-cytogenecin
  physicalDesc: reagent-physical-desc-therapeutic
  flavor: medicine
  color: "#943f21" # dusty orange
  worksOnTheDead: true # Omu
  metabolisms:
    Medicine:
      metabolismRate: 0.1 # slow metabolism
      effects:
      - !type:Drunk # copied from bicaridine, for the giggles
      - !type:AdjustReagent # remove extra precursor once there's enough cytogenecin
        conditions:
        - !type:ReagentCondition
          reagent: Cytogenecin
          min: 20
        - !type:TemperatureCondition
          max: 175.0
        amount: -50
        reagent: Recyclogenix
      - !type:HealthChange
        conditions:
        - !type:TemperatureCondition
          max: 175.0
        scaleByTemperature: # Shitmed Change
          min: 100.0
          max: 175.0
          scale: 1.6
        damage: # heals mild damage as it clears out waste from the reversion process
          types:
            Poison: -0.35 # should be around 7 tox healing per 20u
            Radiation: -0.2 # should be around 4 rad healing per 20u
    Narcotic:
      effects:
        - !type:PopupMessage # this is a dysmorphia cure after all
          type: Local
          visualType: Medium
          messages:
          - "cytogenecin-effect-dysmorphia"
          - "cytogenecin-effect-anxieties"
          - "cytogenecin-effect-at-peace"
          probability: 0.2
          conditions:
          - !type:ReagentCondition
            reagent: Cytogenecin
            min: 5
