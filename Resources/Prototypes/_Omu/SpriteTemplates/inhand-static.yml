- type: entity
  parent: DebugSpriteTemplate
  id: DebugSpriteTemplateInhand32Static
  name: DebugSpriteTemplateInhand32Static
  suffix: 32x32
  description: A 32x32 pixel sprite template for left hand inhand sprites. Use this in a sprite editor to align inhand sprites properly.
  components:
  - type: Sprite
    sprite: _Omu/SpriteTemplate/Inhand/32x.rsi
    state: inhand-guide-icon-32x
  - type: Item
    sprite: _Omu/SpriteTemplate/Inhand/32x.rsi
    inhandVisuals:
      left:  [{ state: inhand-guide-left-32x  }]
      right: [{ state: inhand-guide-right-32x }]

- type: entity
  parent: DebugSpriteTemplate
  id: DebugSpriteTemplateInhand64Static
  name: DebugSpriteTemplateInhand64Static
  suffix: 64x64
  description: A 64x64 pixel sprite template for left hand inhand sprites. Use this in a sprite editor to align inhand sprites properly.
  components:
  - type: Sprite
    sprite: _Omu/SpriteTemplate/Inhand/64x/Icon.rsi
    state: inhand-guide-icon-64x
  - type: Item
    sprite: _Omu/SpriteTemplate/Inhand/64x/Inhand.rsi
    inhandVisuals:
      left:  [{ state: inhand-guide-left-64x  }]
      right: [{ state: inhand-guide-right-64x }]
