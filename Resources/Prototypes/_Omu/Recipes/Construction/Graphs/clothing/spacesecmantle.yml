                state: icon-work
              doAfter: 1
            - tag: HudMedicalSecurity
              name: construction-graph-tag-medsec-hud
              icon:
                sprite: Clothing/Eyes/Hud/medsec.rsi
                state: icon
              doAfter: 1
    - node: helmet
      entity: ClothingCyberneticBeastSpaceMantleCorpsman
