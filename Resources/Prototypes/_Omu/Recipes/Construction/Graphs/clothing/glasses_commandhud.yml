- type: constructionGraph
  id: OmuGlassesCommandHUD
  graph:
    - node: start
      edges:
        - to: glassesCommand
          steps:
            - tag: Sunglasses
              name: construction-graph-tag-sun-glasses
              icon:
                sprite: Clothing/Eyes/Glasses/sunglasses.rsi
                state: icon
              doAfter: 5
            - tag: HudCommand
              name: construction-graph-tag-administration-hud
              icon:
                sprite: Clothing/Eyes/Hud/command.rsi
                state: icon
              doAfter: 5
            - material: Cable
              amount: 5
              doAfter: 5

    - node: glassesCommand
      entity: ClothingEyesGlassesCommand
      edges:
        - to: start
          steps:
            - tool: Screwing
              doAfter: 5
          completed:
            - !type:SpawnPrototype
              prototype: ClothingEyesGlassesSunglasses
            - !type:SpawnPrototype
              prototype: ClothingEyesHudCommand
            - !type:DeleteEntity
