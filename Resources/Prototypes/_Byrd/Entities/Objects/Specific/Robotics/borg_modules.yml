    icon: { sprite: _Byrd/Interface/Actions/actions_borg.rsi, state: gravity-module }

#Tidecraft: generic modules made by hand with a unprofessional bent to them

- type: entity
  id: BorgModuleYEET
  parent: [BaseBorgModule, BaseProviderBorgModule]
  name: Y.E.E.T Cyborg module
  description: How to reload is apparently an exercise left to the cyborg
  components:
  - type: Construction
    graph: BorgModuleYeetCraft
    node: borgmoduleyeet
  - type: Sprite
    layers:
    - state: generic
    - state: icon-yeet
      sprite: _Byrd/Objects/Specific/Robotics/borgmodule.rsi
  - type: ItemBorgModule
    hands:
    - item: WeaponImprovisedPneumaticCannon
      whitelist:
        components:
        - PneumaticCannon
  - type: BorgModuleIcon
    icon: { sprite: _Byrd/Interface/Actions/actions_borg.rsi, state: yeet-module }

- type: entity
  id: BorgModuleAggressiveLube
  parent: [ BaseBorgModule, BaseProviderBorgModule ]
  name: aggressive cleaning cyborg module
  description: a janitorial module to deploy cleaning ordinance to the station, this one's been tampered with
  components:
  - type: Construction
    graph: BorgModuleLubeCraft
    node: borgmodulelube
  - type: Sprite
    layers:
    - state: janitor
    - state: icon-cleanade
      sprite: _Byrd/Objects/Specific/Robotics/borgmodule.rsi
  - type: ItemBorgModule
    moduleId: AggressiveLube
    items:
    - BorgLauncherLubenade
  - type: BorgModuleIcon
    icon: { sprite: _Byrd/Interface/Actions/actions_borg.rsi, state: cleanade-module }

#Science
- type: entity
  id: BorgModuleAdvancedAnomaly
