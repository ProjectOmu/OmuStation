#Abstracts used in place of baseborgmodule[dept] to give basic modules the ability to install into generics
- type: entity
  id: BaseBorgModuleCargoBasic
  parent: [BaseBorgModuleCargo]
  abstract: true
  components:
  - type: BorgModule
    borgFitTypes:
    - borg-type-salvage
    - borg-type-generic
  - type: Tag
    tags:
    - BorgModuleBasic
    - BorgModuleCargo

