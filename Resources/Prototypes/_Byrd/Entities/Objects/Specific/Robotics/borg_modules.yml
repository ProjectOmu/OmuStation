  components:
      - type: Sprite
        layers:
        - state: science
        - state: icon-chimp
          sprite: _Byrd/Objects/Specific/Robotics/borgmodule.rsi
      - type: ItemBorgModule
        moduleId: AdvancedAnomaly
        hands:
        items:
        - AnomalyScanner
        - AnomalyLocatorUnpowered
        - AnomalyLocatorWideUnpowered
        - WeaponGauntletGorilla
        - WeaponPistolCHIMPRecharging
      - type: DroppableBorgModule
