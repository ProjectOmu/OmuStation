        items:
        - id: FoodAnomalyBerry
          whitelist:
            components:
            - AnomalyCore
      - type: BorgModuleIcon
        icon: { sprite: _Byrd/Interface/Actions/actions_borg.rsi, state: advancedanomaly-module }

