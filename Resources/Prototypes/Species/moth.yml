- type: species
  id: Moth
  name: species-name-moth
  roundStart: true
  prototype: MobMoth
  sprites: MobMothSprites
  defaultSkinTone: "#ffda93"
  markingLimits: MobMothMarkingLimits
  dollPrototype: MobMothDummy
  skinColoration: Hues
  maleFirstNames: NamesMothFirstMale
  femaleFirstNames: NamesMothFirstFemale
  lastNames: NamesMothLast
  # begin Goobstation: port EE height/width sliders
  # Moths have massive sprites, so they can get away with being scaled smaller (totally not biased)
  minHeight: 0.75
  defaultHeight: 1
  maxHeight: 1.20
  minWidth: 0.80
  defaultWidth: 1
  maxWidth: 1.20
  # end Goobstation: port EE height/width sliders

- type: speciesBaseSprites
  id: MobMothSprites
  sprites:
    TailBehind: MobHumanoidAnyMarking # floof
    TailOversuit: MobHumanoidAnyMarking # floof
    TailBehindBackpack: MobHumanoidAnyMarking #imp
    Head: MobMothHead
    Face: MobHumanoidAnyMarking
    Snout: MobHumanoidAnyMarking
    UndergarmentTop: MobHumanoidAnyMarking
    UndergarmentBottom: MobHumanoidAnyMarking
    Chest: MobMothChest
    Groin: MobMothGroin # Goob
    HeadTop: MobHumanoidAnyMarking
    HeadSide: MobHumanoidAnyMarking
    Tail: MobHumanoidAnyMarking
    Eyes: MobMothEyes
    LArm: MobMothLArm
    RArm: MobMothRArm
    LHand: MobMothLHand
    RHand: MobMothRHand
    LLeg: MobMothLLeg
    RLeg: MobMothRLeg
    LFoot: MobMothLFoot
    RFoot: MobMothRFoot
    Wings: MobHumanoidAnyMarking #Omu - Moving moth wings to Wings body part

- type: humanoidBaseSprite
  id: MobMothEyes
  baseSprite:
    sprite: Mobs/Species/Moth/parts.rsi
    state: eyes

- type: markingPoints
  id: MobMothMarkingLimits
  onlyWhitelisted: true
  points:
    Hair:
      points: 0
      required: false
    FacialHair:
      points: 0
      required: false
    #Omu Start - Moving moth wings to Wings body part
    Wings:
      points: 3 # BYRD - MORE MOTHMIZATION, MORE WINGS SO YOU CAN STACK THEM LIKE ANTENNAE FOR FANCIER MOFFS
      required: true
      defaultMarkings: [ MothWingsDefault ]
    #Omu End - Moving moth wings to Wings body part
    Tail:
      points: 1
      required: false
#      defaultMarkings: [ MothWingsDefault ]  // Omu - Moving moth wings to Wings body part
    Snout:
      points: 1
      required: false
    HeadTop:
      points: 6
      required: true
      defaultMarkings: [ MothAntennasDefault ]
    HeadSide:
      points: 8
      required: false
    Head:
      points: 1
      required: false
    UndergarmentTop:
      points: 1
      required: false
    UndergarmentBottom:
      points: 8
      required: false
    Chest:
      points: 8
      required: false
    RightLeg:
      points: 8 # Omu Edit - "Uncapped Customizations"
      required: false
    RightFoot:
      points: 8 # Omu Edit - "Uncapped Customizations"
      required: false
    LeftLeg:
      points: 8 # Omu Edit - "Uncapped Customizations"
      required: false
    LeftFoot:
      points: 8 # Omu Edit - "Uncapped Customizations"
      required: false
    RightArm:
      points: 8 # Omu Edit - "Uncapped Customizations"
      required: false
    RightHand:
      points: 8 # Omu Edit - "Uncapped Customizations"
      required: false
    LeftArm:
      points: 8 # Omu Edit - "Uncapped Customizations"
      required: false
    LeftHand:
      points: 8 # Omu Edit - "Uncapped Customizations"
      required: false

