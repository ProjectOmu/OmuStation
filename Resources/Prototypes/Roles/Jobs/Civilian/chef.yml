- type: job
  id: Chef
  name: job-name-chef
  description: job-description-chef
  playTimeTracker: JobChef
  requirements:
    - !type:DepartmentTimeRequirement
      department: Civilian
      time: 0.5h
  startingGear: ChefGear
  icon: "JobIconChef"
  supervisors: job-supervisors-hop
  guides: # goobstation
  - Chef
  - FoodRecipes
  - CQC
  goobcoins: 15 #Goob content
  access:
  - Service
  - Maintenance
  - Kitchen
  extendedAccess:
  - Hydroponics
  - Bar
  special: # Goobstation - Martial Arts
#  - !type:AddComponentSpecial # Omu, remove CQC
#    components:
#      - type: GrantCqc
#        startingStage: Hard
#        isBlocked: true
  - !type:AddImplantSpecial # Chefs speak space italian
    implants: [ SpaceItalianTranslatorImplant ]
  - !type:AddComponentSpecial
    components:
    - type: RoundStartSkillGranting #omu skill system 
      department: [ Crew ]
      skillDic:
        Cargo: 0
        Combat: 0
        Command: 0
        Engineering: 0
        Medical: 0
    - type: SpeciesBasedSkillAddition #omu skill system
      skillDic:
        Harpy:
          Cargo: -1
          Combat: -1
          Command: -1
          Engineering: -1
          Medical: -1

- type: startingGear
  id: ChefGear
  equipment:
    shoes: ClothingShoesChef
    id: ChefPDA
    ears: ClothingHeadsetService
    belt: ClothingBeltChefFilled
  #storage:
    #back:
    #- Stuff

- type: chameleonOutfit
  id: ChefChameleonOutfit
  job: Chef
  equipment:
    head: ClothingHeadHatChef
    eyes: ClothingEyesGlassesCheapSunglasses
    mask: ClothingMaskItalianMoustache
    neck: ClothingNeckScarfStripedBrown
    outerClothing: ClothingOuterJacketChef
    gloves: ClothingHandsGlovesColorWhite
    shoes: ClothingShoesChef
