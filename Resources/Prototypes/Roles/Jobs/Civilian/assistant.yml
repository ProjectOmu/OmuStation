- type: job # goob edit
  id: Passenger
  name: job-name-passenger
  description: job-description-passenger
  playTimeTracker: JobPassenger
  startingGear: PassengerGear
  icon: "JobIconPassenger"
  supervisors: job-supervisors-everyone
  goobcoins: 20 #Goob content
  access:
  - Maintenance
  special: # Goobstation
  - !type:AddComponentSpecial
    components:
      - type: NpcFactionMember
        factions:
        - NanoTrasen
        - Assistant
      - type: RoundStartSkillGranting #omu skill system 
        department: [ Crew ]
        skillDic:
          Cargo: 0
          Combat: 0
          Command: 0
          Engineering: 0
          Medical: 0
