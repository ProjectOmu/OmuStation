- type: job
  id: Captain
  name: job-name-captain
  description: job-description-captain
  playTimeTracker: JobCaptain
  requirements:
    - !type:DepartmentTimeRequirement
      department: Engineering
      time: 4h
    - !type:DepartmentTimeRequirement
      department: Medical
      time: 4h
    - !type:DepartmentTimeRequirement
      department: Science
      time: 4h
    - !type:DepartmentTimeRequirement
      department: Security
      time: 6h # Goobstation
    - !type:DepartmentTimeRequirement
      department: Command
      time: 20h # Omu
    - !type:OverallPlaytimeRequirement # Omu
      time: 40h # Omu Edit - Not technically needed, but it helps since time transfered people still need to play shifts before captaining.
      #- !type:SpeciesRequirement # Goob - None Felinid
    #  inverted: true
    #  species:
    #  - Felinid
      #any MRP using our code might eventually want to use it
    # - !type:SaturationRequirement # MisandryBox - no neon hair on captain
    #   hairColorSaturation: 0.30
  guides: # goobstation
  - Command
  - Succession
  - StandardProceduresSOP
  - CaptainSOP
  - ClassifiedTrainingManual # Omu
  goobcoins: 50 #Goob content
  weight: 20
  startingGear: CaptainGear
  icon: "JobIconCaptain"
  joinNotifyCrew: true
  supervisors: job-supervisors-centcom
  canBeAntag: false
  accessGroups:
  - AllAccess
  special:
  - !type:AddImplantSpecial
    implants: [ MindShieldImplant ]
  - !type:AddComponentSpecial
    components:
    - type: CommandStaff
    - type: Condemned # Goobstation - Nanotrasen owns your soul pal.
      soulOwnedNotDevil: true
    - type: CommandSkill
    - type: RoundStartSkillGranting #omu skill system 
      department: [ Command, Crew ]
      skillDic:
        Cargo: 2
        Combat: 2
        Command: 3
        Engineering: 2
        Medical: 2
    - type: SpeciesBasedSkillAddition #omu skill system
      skillDic:
        Harpy:
          Cargo: -1
          Combat: -1
          Command: 1
          Engineering: -1
          Medical: -1

- type: startingGear
  id: CaptainGear
  equipment:
   # shoes: ClothingShoesBootsLaceup - Goobstation
    eyes: ClothingEyesGlassesCommand
    #gloves: ClothingHandsGlovesCaptain - Goobstation, moved to loadouts
    #id: CaptainPDA - Omu, moved to loadouts
    ears: ClothingHeadsetAltCommand
  storage:
    back:
    - Flash
    - TelescopicBaton # Goobstation
    # - StationCharter

- type: chameleonOutfit
  id: CaptainChameleonOutfit
  job: Captain
  hasMindShield: true
  equipment:
    head: ClothingHeadHatCapcap
    eyes: ClothingEyesGlassesCommand
    mask: ClothingMaskGasCaptain
    neck: ClothingNeckCloakCap
