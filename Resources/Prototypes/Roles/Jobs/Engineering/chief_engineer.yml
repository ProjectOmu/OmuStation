- type: job
  id: ChiefEngineer
  name: job-name-ce
  description: job-description-ce
  playTimeTracker: JobChiefEngineer
  requirements:
    - !type:RoleTimeRequirement
      role: JobAtmosphericTechnician
      time: 15h #15 hours - Omu Edit: This is the only role where you'd realistically learn how to do CE things like TEGs, atmos or SMs.
    - !type:RoleTimeRequirement
      role: JobStationEngineer
      time: 5h
    - !type:DepartmentTimeRequirement
      department: Engineering
      time: 20h
  #- !type:SpeciesRequirement # Goob - None Felinid
  #  inverted: true
    #  species:
    #  - Felinid
    - !type:OverallPlaytimeRequirement
      time: 10h # Omu Edit
  weight: 10
  startingGear: ChiefEngineerGear
  icon: "JobIconChiefEngineer"
  supervisors: job-supervisors-captain
  #canBeAntag: false
  antagAdvantage: 75 # Goobstation
  guides: # goobstation
  - Engineering
  - ChiefEngineerSOP
  - EngineeringSOP
  - Command
  - EmergenciesSOP
  - ClassifiedTrainingManual # Omu
  goobcoins: 40 #Goob content
  access:
  - Maintenance
  - Engineering
  - Command
  - External
  - ChiefEngineer
  - Atmospherics
  - Brig
  - Cryogenics
  special:
  - !type:AddImplantSpecial
    implants: [ MindShieldImplant ]
  - !type:AddComponentSpecial
    components:
    - type: CommandStaff
    - type: EngineeringStaff # Goobstation
    - type: RoundStartSkillGranting #omu skill system 
      department: [ Engineering, Crew, Command ]
      skillDic:
        Cargo: 0
        Combat: 0
        Command: 2
        Engineering: 3
        Medical: 0
    - type: SpeciesBasedSkillAddition #omu skill system
      skillDic:
        Harpy:
          Cargo: -1
          Combat: -1
          Command: 1
          Engineering: 1
          Medical: -1
    - type: CommandSkill
      effectedDepartments: [ Engineering ]
      speedModifier:
        "-1": 0.5
        "0": 1
        "1": 1.25
        "2": 1.5
        "3": 1.75
        "4": 2
        "5": 3
        "6": 3.5

- type: startingGear
  id: ChiefEngineerGear
  equipment:
    id: CEPDA
    eyes: ClothingEyesGlassesMeson
    ears: ClothingHeadsetAltEngineering # Goobstation
    belt: ClothingBeltUtilityEngineering
  storage:
    back:
    - Flash
    - TelescopicBaton # Goobstation

- type: chameleonOutfit
  id: ChiefEngineerChameleonOutfit
  job: ChiefEngineer
  hasMindShield: true
  equipment:
    head: ClothingHeadHatBeretEngineering
    mask: ClothingMaskBreath
    neck: ClothingNeckCloakWhiteCe # GOOB
    outerClothing: ClothingOuterWinterCE
    gloves: ClothingHandsGlovesColorYellow
    shoes: ClothingShoesBootsMagAdv
