- type: job
  id: ChiefEngineer
  name: job-name-ce
  description: job-description-ce
  playTimeTracker: JobChiefEngineer
  requirements:
    - !type:RoleTimeRequirement
      role: JobAtmosphericTechnician
      time: 15h #15 hours - Omu Edit: This is the only role where you'd realistically learn how to do CE things like TEGs, atmos or SMs.
    - !type:RoleTimeRequirement
      role: JobStationEngineer
      time: 5h
    - !type:DepartmentTimeRequirement
      department: Engineering
      time: 20h
  #- !type:SpeciesRequirement # Goob - None Felinid
  #  inverted: true
    #  species:
    #  - Felinid
    - !type:OverallPlaytimeRequirement
      time: 10h # Omu Edit
  weight: 10
  startingGear: ChiefEngineerGear
  icon: "JobIconChiefEngineer"
  supervisors: job-supervisors-captain
  #canBeAntag: false
  antagAdvantage: 75 # Goobstation
  guides: # goobstation
  - Engineering
  - ChiefEngineerSOP
  - EngineeringSOP
  - Command
  - EmergenciesSOP
  - CommandTrainingManual # Omu
  goobcoins: 40 #Goob content
  access:
  - Maintenance
  - Engineering
  - Command
  - External
  - ChiefEngineer
  - Atmospherics
  - Brig
  - Cryogenics
  special:
  - !type:AddImplantSpecial
    implants: [ MindShieldImplant ]
  - !type:AddComponentSpecial
    components:
      - type: CommandStaff
      - type: EngineeringStaff # Goobstation

