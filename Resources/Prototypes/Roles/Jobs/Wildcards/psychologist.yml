- type: job
  id: Psychologist
  name: job-name-psychologist
  description: job-description-psychologist
  playTimeTracker: JobPsychologist
  startingGear: PsychologistGear
  icon: "JobIconPsychologist"
  supervisors: job-supervisors-cmo
  goobcoins: 15 #Goob content
  access:
  - Medical
  - Maintenance
  extendedAccess:
  - Chemistry
  special:
  - !type:AddComponentSpecial
    components:
    - type: RoundStartSkillGranting #omu skill system 
      department: [ Medical, Crew ]
      skillDic:
        Cargo: 0
        Combat: 0
        Command: 0
        Engineering: 0
        Medical: 2
    - type: SpeciesBasedSkillAddition #omu skill system
      skillDic:
        Harpy:
          Cargo: -1
          Combat: -1
          Command: -1
          Engineering: -1
          Medical: 1

- type: startingGear
  id: PsychologistGear
  equipment:
    #shoes: ClothingShoesLeather # Omu, Selectable formal shoes
    id: PsychologistPDA
    ears: ClothingHeadsetMedical
  storage:
    back:
    - RubberStampPsychologist

- type: chameleonOutfit
  id: PsychologistChameleonOutfit
  job: Psychologist
  equipment:
    head: ClothingHeadHatBeretMedic
    eyes: ClothingEyesHudMedical
    mask: ClothingMaskSterile
    outerClothing: ClothingOuterCoatLab
    neck: ClothingNeckStethoscope
    belt: ClothingBeltMedical
    gloves: ClothingHandsGlovesLatex
