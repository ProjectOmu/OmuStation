- type: job
  id: TramDriver
  name: job-name-tram-driver
  description: job-description-tram-driver
  playTimeTracker: JobTramDriver
  startingGear: TramDriverGear
  icon: "JobIconTramDriver"
  supervisors: job-supervisors-hop
  requirements:
    - !type:OverallPlaytimeRequirement # someone that's not doing this job will just be a pain for the station
      time: 10h
  access:
  - Maintenance
  - Service # the tram has command + service access
  - External # to pick up people trapped in the tramway's space
  special: # we don't want it becoming an antag... for now at least
  - !type:AddImplantSpecial
    implants: [ MindShieldImplant ]
  - !type:AddComponentSpecial
    components:
    - type: RoundStartSkillGranting #omu skill system 
      department: [ Crew ]
      skillDic:
        Cargo: 0
        Combat: 0
        Command: 0
        Engineering: 0
        Medical: 0
    - type: SpeciesBasedSkillAddition #omu skill system
      skillDic:
        Harpy:
          Cargo: -1
          Combat: -1
          Command: -1
          Engineering: -1
          Medical: -1

- type: startingGear
  id: TramDriverGear
  equipment:
    shoes: ClothingShoesBootsLaceup
    id: TramDriverPDA
    ears: ClothingHeadsetService
    neck: ClothingNeckTieSerious

- type: chameleonOutfit
  id: TramDriverChameleonOutfit
  job: TramDriver
  equipment:
    head: ClothingHeadHatTramDriver
    eyes: ClothingEyesGlasses
    mask: ClothingMaskBreath
    outerClothing: ClothingOuterSuitTramDriver
    neck: ClothingNeckTieSerious
    belt: ClothingBeltUtility
    gloves: ClothingHandsGlovesColorWhite
