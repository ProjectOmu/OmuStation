- type: job
  id: MedicalIntern
  name: job-name-intern
  description: job-description-intern
  playTimeTracker: JobMedicalIntern
  requirements:
    - !type:OverallPlaytimeRequirement
      time: 0.5h # Omustation
    #- !type:DepartmentTimeRequirement # Sometimes you haven't played a department in a while :shrug:
    #  department: Medical
    #  time: 36000 #10 hours - Omu Edit
    #  inverted: true # stop playing intern if you're good at med! # Omu edit end - no
  startingGear: MedicalInternGear
  icon: "JobIconMedicalIntern"
  supervisors: job-supervisors-medicine
  guides: # goobstation
  - MedicalDoctor
  - Cloning
  - Medicine
  goobcoins: 20 #Goob content
  access:
  - Medical
  - Maintenance
  # Shitmed change
  special:
  - !type:AddComponentSpecial
    components:
    #- type: SurgerySpeedModifier
      #speedModifier: 1.25
    - type: RoundStartSkillGranting #omu skill system 
      department: [ Medical, Crew ]
      skillDic:
        Cargo: 0
        Combat: 0
        Command: 0
        Engineering: 0
        Medical: 2
    - type: SpeciesBasedSkillAddition #omu skill system
      skillDic:
        Harpy:
          Cargo: -1
          Combat: -1
          Command: -1
          Engineering: -1
          Medical: 1

- type: startingGear
  id: MedicalInternGear
  equipment:
    shoes: ClothingShoesColorWhite
    id: MedicalInternPDA
    ears: ClothingHeadsetMedical
    belt: ClothingBeltMedicalFilled
    pocket2: BookMedicalReferenceBook
  #storage:
    #back:
    #- Stuff

- type: chameleonOutfit
  id: MedicalInternChameleonOutfit
  job: MedicalIntern
  equipment:
    head: ClothingHeadHatBeretMedic
    eyes: ClothingEyesHudMedical
    mask: ClothingMaskSterile
    neck: ClothingNeckStethoscope
    outerClothing: ClothingOuterCoatLabOpened
    gloves: ClothingHandsGlovesLatex
