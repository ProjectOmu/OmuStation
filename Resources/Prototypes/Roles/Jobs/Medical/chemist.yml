- type: job
  id: Chemist
  name: job-name-chemist
  description: job-description-chemist
  playTimeTracker: JobChemist
  requirements:
    - !type:DepartmentTimeRequirement
      department: Medical
      time: 5h
  startingGear: ChemistGear
  icon: "JobIconChemist"
  supervisors: job-supervisors-cmo
  guides: # goobstation
  - Chemist
  - Chemicals
  goobcoins: 20 #Goob content
  access:
  - Medical
  - Chemistry
  - Maintenance
  # Shitmed Change
  special:
  - !type:AddComponentSpecial
    components:
    #- type: SurgerySpeedModifier
      #speedModifier: 1.25
    - type: RoundStartSkillGranting #omu skill system 
      department: [ Medical, Crew ]
      skillDic:
        Cargo: 0
        Combat: 0
        Command: 0
        Engineering: 0
        Medical: 2
    - type: SpeciesBasedSkillAddition #omu skill system
      skillDic:
        Harpy:
          Cargo: -1
          Combat: -1
          Command: -1
          Engineering: -1
          Medical: 1

- type: startingGear
  id: ChemistGear
  equipment:
    #id: ChemistryPDA
    ears: ClothingHeadsetMedical
    #belt: ChemBagFilled
    #pocket1: HandLabeler
    #eyes: ClothingEyesGlassesChemical
  #storage:
    #back:
    #- Stuff

- type: chameleonOutfit
  id: ChemistChameleonOutfit
  job: Chemist
  equipment:
    head: ClothingHeadHatBeretMedic
    mask: ClothingMaskSterile
    neck: ClothingNeckStethoscope
    outerClothing: ClothingOuterCoatLabChem
    gloves: ClothingHandsGlovesLatex
