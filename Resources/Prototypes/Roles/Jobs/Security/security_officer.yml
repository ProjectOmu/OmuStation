- type: job
  id: SecurityOfficer
  name: job-name-security
  description: job-description-security
  playTimeTracker: JobSecurityOfficer
  requirements:
    - !type:DepartmentTimeRequirement
      department: Security
      time: 5h # Omustation
  startingGear: SecurityOfficerGear
  icon: "JobIconSecurityOfficer"
  supervisors: job-supervisors-hos
  canBeAntag: false
  guides: # goobstation
  - Security
  - LegalSOP
  - OfficerCadetSOP
  - CorporateJudo
  - AlertLevels
  - ClassifiedTrainingManual # Omu
  goobcoins: 30 #Goob content
  access:
  - Security
  - Brig
  - Maintenance
  - External
  - Cryogenics
  - GenpopEnter
  - GenpopLeave
  special:
  - !type:AddImplantSpecial
    implants: [ MindShieldImplant ]
  - !type:AddComponentSpecial # goobstation
    components:
    - type: SecurityStaff
    - type: RoundStartSkillGranting #omu skill system 
      department: [ Security, Crew  ]
      skillDic:
        Cargo: 0
        Combat: 2
        Command: 0
        Engineering: 0
        Medical: 0
    - type: SpeciesBasedSkillAddition #omu skill system
      skillDic:
        Harpy:
          Cargo: -1
          Combat: 1
          Command: -1
          Engineering: -1
          Medical: -1

- type: startingGear
  id: SecurityOfficerGear
  equipment:
    #eyes: ClothingEyesGlassesSecurity #Omu, glasses options in loadout
    ears: ClothingHeadsetAltSecurityRegular # Goobstation
    #pocket1: OfficerGunCase #Omu, item in loadout instead
  storage:
    back:
    - Flash
    #- MagazinePistol # Omu moved to loadouts and will give ammo based on gun

- type: chameleonOutfit
  id: SecurityOfficerChameleonOutfit
  job: SecurityOfficer
  hasMindShield: true
  equipment:
    head: ClothingHeadHatBeretSecurity
    mask: ClothingMaskGasSecurity
    neck: Dinkystar
    gloves: ClothingHandsGlovesColorBlack
