- type: job
  id: Detective
  name: job-name-detective
  description: job-description-detective
  playTimeTracker: JobDetective
  requirements:
  - !type:RoleTimeRequirement
    role: JobSecurityOfficer
    time: 5h
  startingGear: DetectiveGear
  icon: "JobIconDetective"
  supervisors: job-supervisors-hos
  canBeAntag: false
  guides: # goobstation
  - Forensics
  - Security
  - DetectiveSOP
  - ClassifiedTrainingManual # Omu
  goobcoins: 30 #Goob content
  access:
  - Security
  - Brig
  - Maintenance
  - Detective
  - Cryogenics
  - External
  - GenpopEnter
  - GenpopLeave
  special:
  - !type:AddImplantSpecial
    implants: [ MindShieldImplant ]
  - !type:AddComponentSpecial # goobstation
    components:
    - type: SecurityStaff
    - type: RoundStartSkillGranting #omu skill system 
      department: [ Security, Crew ]
      skillDic:
        Cargo: 0
        Combat: 2
        Command: 0
        Engineering: 0
        Medical: 0
    - type: SpeciesBasedSkillAddition #omu skill system
      skillDic:
        Harpy:
          Cargo: -1
          Combat: 1
          Command: -1
          Engineering: -1
          Medical: -1

- type: startingGear
  id: DetectiveGear
  equipment:
    # eyes: ClothingEyesGlassesSecurity # Omu move to loadouts
    id: DetectivePDA
    #gloves: ClothingHandsGlovesForensic - Goobstation, moved to loadouts
    ears: ClothingHeadsetAltSecurityRegular # Goobstation
    #belt: ClothingBeltHolsterFilled # Omu Moved to loadout
  storage:
    back:
    - Flash
    - ForensicPad
    - ForensicScanner
    #- ClothingMaskGasSecurity # Goobstation # Omu

- type: chameleonOutfit
  id: DetectiveChameleonOutfit
  job: Detective
  hasMindShield: true
  equipment:
    head: ClothingHeadHatFedoraBrown
    mask: ClothingMaskGasSecurity
    neck: ClothingNeckTieDet
    gloves: ClothingHandsGlovesForensic
