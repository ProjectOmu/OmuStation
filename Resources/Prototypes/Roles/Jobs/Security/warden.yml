      role: JobSecurityOfficer
      time: 5h
    - !type:RoleTimeRequirement # Goobstation
      role: JobBrigmedic
      time: 5h
    - !type:DepartmentTimeRequirement
      department: Security
      time: 15h #15 hours - Omu edit end: Earn your thankless spot.
#    - !type:SpeciesRequirement # Goob - None Felinid
#      inverted: true
#      species:
#      - Felinid #Omu, add back Felinid
    - !type:OverallPlaytimeRequirement
      time: 10h #10 hours - Omu Edit
