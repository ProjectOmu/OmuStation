  startingGear: WardenGear
  icon: "JobIconWarden"
  supervisors: job-supervisors-hos
  canBeAntag: false
  guides: # goobstation
  - SpaceLaw
  - LegalSOP
  - Security
  - WardenSOP
  - KravMaga
  - CommandTrainingManual # Omu
  - SecurityTrainingManual # Omu
  goobcoins: 35 #Goob content
  access:
  - Corpsman # Omu
  - Security
  - Brig
  - Armory
  - Maintenance
  - External
  - Detective
  - Cryogenics
