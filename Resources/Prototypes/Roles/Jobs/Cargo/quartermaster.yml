- type: job
  id: Quartermaster
  name: job-name-qm
  description: job-description-qm
  playTimeTracker: JobQuartermaster
  requirements:
    - !type:RoleTimeRequirement
      role: JobCargoTechnician
      time: 10h # Omustation
    - !type:RoleTimeRequirement
      role: JobSalvageSpecialist
      time: 5h # Omustation
    - !type:DepartmentTimeRequirement
      department: Cargo
      time: 20h # Omustation
#    - !type:SpeciesRequirement # Goob - None Felinid
#      inverted: true
#      species:
#      - Felinid #Omu, add back Felinid
    - !type:OverallPlaytimeRequirement # Omustation
      time: 10h
  weight: 10
  startingGear: QuartermasterGear
  icon: "JobIconQuarterMaster"
  supervisors: job-supervisors-captain
  #canBeAntag: false
  antagAdvantage: 75 # Goobstation
  guides: # goobstation
  - Cargo
  - QuartermasterSOP
  - CargoSOP
  - Command
  - CommandTrainingManual # Omu
  goobcoins: 40 #Goob content
  access:
  - Cargo
  - Salvage
  - Quartermaster
  - Maintenance
  - External
  - Command
  - Brig
  - Cryogenics
