- type: entity
  parent: BoxSurvivalSlots
  id: BoxSurvivalBlood
  name: survival box
  description: It's a box with basic internals inside. This one is labelled to contain a haemobrick.
  suffix: Standard, Blood
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: ClothingMaskBreath
        - id: EmergencyOxygenTankFilled
        - id: EmergencyMedipen
        - id: Flare
        - id: FoodSnackBloodBrick
  - type: Sprite
    layers:
    - state: internals

