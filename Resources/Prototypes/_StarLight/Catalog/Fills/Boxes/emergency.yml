- type: entity
  parent: BoxSurvivalSlots
  id: BoxSurvivalBlood
  name: survival box
  description: It's a box with basic internals inside. This one is labelled to contain a haemobrick.
  suffix: Standard, Blood
  components:
  - type: ContainerFill
    containers:
      water:
      - DrinkWaterBottleFull
      nutriblock:
      - FoodSnackBloodBrick
      flare:
      - Flare
      tank:
      - EmergencyOxygenTankFilled
      mask:
      - ClothingMaskBreath
      emergencypen:
      - EmergencyMedipen

