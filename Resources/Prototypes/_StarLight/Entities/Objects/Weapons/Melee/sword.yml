    - type: MeleeWeapon
      attackRate: 1
      damage:
        types:
          Structural: 5
          Slash: 15
          Holy: 20
      soundHit:
        path: /Audio/Weapons/chainsaw.ogg
    - type: Item
    - type: DisarmMalus
    - type: Clothing
      sprite: _Starlight/Objects/Weapons/Melee/chainsaw_sword.rsi
      slots:
      - belt
    - type: Contraband
      allowedJobs: [ Chaplain ]
