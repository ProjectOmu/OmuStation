- type: entity
  parent: BaseItem
  id: FoodSnackBloodBrick
  name: haemobrick
  description: A carefully synthesized brick of condensed blood. Tastes like you would expect.
  components:
  - type: Item
    size: Small
    storedOffset: -1,0
    heldPrefix: nutribrick
  - type: Tag
    tags:
      - FoodSnack
  - type: Sprite
    sprite: Objects/Consumable/Food/snacks.rsi
    state: nutribrick
  - type: SpawnItemsOnUse
    items:
      - id: FoodPacketMRETrash
      - id: FoodSnackBloodBrickOpen
    sound:
      path: /Audio/Effects/unwrap.ogg

- type: entity
