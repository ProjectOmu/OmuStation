  components:
  - type: FlavorProfile
    flavors:
      - metallic
  - type: Item
    size: Small
    storedOffset: -1,0
    heldPrefix: nutribrick-open
  - type: Tag
    tags:
      - Blood
  - type: Sprite
    state: nutribrick-open
    color: '#880000'
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 25
        reagents:
        - ReagentId: Blood
          Quantity: 20