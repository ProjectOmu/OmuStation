- type: entity
  parent: CMPlatformBase
  id: CMPlatformDark
  name: platform
  suffix: Dark
  description: A raised surface. Wait, thats illegal!
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,-0.36"
        density: 1500
        mask:
        - TableMask
        layer:
        - TableLayer
  - type: Sprite
    sprite: _Starlight/Structures/platforms.rsi
    state: platform_dark
    drawdepth: HighFloorObjects
  - type: Climbable

