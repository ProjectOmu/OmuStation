- type: body
  id: Doll
  name: "doll"
  root: torso
  slots:
    head:
      part: HeadDoll
      connections:
      - torso
      organs:
        brain: OrganDollBrain
        eyes: OrganDollEyes
        tongue: OrganDollTongue
        shell: ShellFragmentDoll

    torso:
      part: ChestDoll
      connections:
      - right arm
      - left arm
      - groin
      organs:
        heart: OrganDollHeart
        lungs: OrganDollLungs
        shell: ShellFragmentDoll

    groin:
      part: GroinDoll
      connections:
      - right leg
      - left leg
      organs:
        stomach: OrganDollStomach
        liver: OrganDollLiver
        kidneys: OrganDollKidneys
        shell: ShellFragmentDoll

    right arm:
      part: RightArmDoll
      connections:
      - right hand
      organs:
        shell: ShellFragmentDoll
      

    left arm:
      part: LeftArmDoll
      connections:
      - left hand
      organs:
        shell: ShellFragmentDoll

    right hand:
      part: RightHandDoll
      organs:
        shell: ShellFragmentDoll

    left hand:
      part: LeftHandDoll
      organs:
        shell: ShellFragmentDoll

    right leg:
      part: RightLegDoll
      connections:
      - right foot
      organs:
        shell: ShellFragmentDoll

    left leg:
      part: LeftLegDoll
      connections:
      - left foot
      organs:
        shell: ShellFragmentDoll

    right foot:
      part: RightFootDoll
      organs:
        shell: ShellFragmentDoll

    left foot:
      part: LeftFootDoll
      organs:
        shell: ShellFragmentDoll