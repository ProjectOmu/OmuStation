- type: entity
  parent: SimpleMobBase
  abstract: true
  id: MobSecDog
  name: security dog
  description: Funnily enough, this pig is actually a dog.
  components:
  - type: GhostRole
    makeSentient: true
    allowSpeech: true
    allowMovement: true
    name: "sentient security dog"
    description: "Help out the security team by biting the baddies and barking at everything that moves."
  - type: GhostTakeoverAvailable
  - type: CombatMode
  - type: MovementSpeedModifier
    baseWalkSpeed : 3.5
    baseSprintSpeed : 5.0
  - type: NpcFactionMember
    factions:
    - PetsNT
  - type: Sprite
    drawdepth: Mobs
    sprite: _DV/Mobs/Pets/secdog.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: base
    - map: [ "outerClothing" ]
    - map: ["enum.DamageStateVisualLayers.Tail"]
      state: tail_animated
  - type: DamageStateVisuals
    states:
      Alive:
        Base: base
        Tail: tail_animated
      Critical:
        Base: base
        Tail: tail_static
      Dead:
        Base: base
        Tail: tail_static
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
  - type: Physics
  - type: Speech
    allowedEmotes: ['Bark', 'Snarl', 'Whine', 'Howl', 'Awoo']
    speechVerb: Canine
    speechSounds: SecDogTalk # cooler than just default vulp sounds
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.35
        density: 120 # BIG DOG :3
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: MobThresholds
    thresholds: # BIG DOG. STRONG DOG
      0: Alive
      100: Critical
      200: Dead
  - type: StaminaDamageOnHit
    damage: 22
  - type: MeleeWeapon
    hidden: true
    altDisarm: false
    soundHit:
      path: /Audio/Effects/bite.ogg
    angle: 0
    attackRate: 1
    damage:
      types:
        Slash: 10
  - type: SlowOnDamage
    speedModifierThresholds:
      40: 0.70
      80: 0.30
  - type: Appearance
  - type: Inventory
    speciesId: secdog
    templateId: secdog
  - type: InventorySlots
  - type: Strippable
  - type: UserInterface
    interfaces:
      enum.StrippingUiKey.Key:
        type: StrippableBoundUserInterface
  - type: Butcherable
    spawned:
    - id: FoodMeat
      amount: 2
#  - type: ReplacementAccent # Omu - no need for accent, we have EE's language system
#    accent: dog
  - type: InteractionPopup
    successChance: 0.5
    interactSuccessString: petting-success-dog
    interactFailureString: petting-failure-generic
    interactSuccessSpawn: EffectHearts
    interactSuccessSound:
      path: /Audio/_DV/Voice/Vulpkanin/dog_bark2.ogg
  - type: Grammar
    attributes:
      gender: epicene
  - type: Bloodstream
    bloodMaxVolume: 300 # BIG DOG. MUCH BLOOD :3
  - type: Puller
    needsHands: false
  - type: MobPrice
    price: 400
  - type: Tag
    tags:
    - DoorBumpOpener
    - VimPilot
    - K9
    - DogEmotes # Omu
  - type: AutoImplant
    implants:
    - TrackingImplant
  - type: Vocal
    sounds:
      Unsexed: MobDog
    screamAction: ActionBark # Omu - changes screamaction to bark
    screamId: Bark # Omu - changes the scream sound to bark
  - type: RotationVisuals
    defaultRotation: 90
    horizontalRotation: 90
  - type: ScentTracker # Omu - the best tracker this side of the station
  - type: Grappler
    handDisabling: None
    cooldown: 15
    grapplingPart: grapple-part-jaws
    proneOnGrapple: true # Make sure Secdogs aren't shot by sprays
    grappleSound:
      collection: VulpkaninGrowls
    activationMode:
      !type:GrapplerActivationStaminaDrain
      staminaDrainRate: 5
      movementSpeedModifier: 0.2
      initialDamage:
        types:
          Slash: 5
          Piercing: 10
  - type: LanguageKnowledge # Omu - better than replacement accent
    speaks:
    - Dog
    understands:
    - Dog
    - TauCetiBasic
  - type: MessyDrinker # Omu
