- type: entity
  name: plant analyzer
  parent: [BaseItem, PowerCellSlotSmallItem]
  id: PlantAnalyzer
  description: A handheld device that scans seeds and plants, revealing their properties. Requires a power cell.
  components:
  - type: Sprite
    sprite: _DV/Objects/Devices/plant_analyzer.rsi
    layers:
    - state: plantanalyzer
    - state: unlit
      map: [ "enum.PowerDeviceVisualLayers.Powered" ]
      shader: unshaded
  - type: Item
    storedRotation: -90
  - type: ActivatableUI
    key: enum.PlantAnalyzerUiKey.Key
    inHandsOnly: true
  - type: UserInterface
    interfaces:
      enum.PlantAnalyzerUiKey.Key:
        type: PlantAnalyzerBoundUserInterface
  - type: PlantAnalyzer
  - type: PowerCellDraw
    drawRate: 0.5
  - type: ActivatableUIRequiresPowerCell
  - type: Tag
    tags:
    - PlantAnalyzer

- type: entity
  id: PlantAnalyzerEmpty
  parent: PlantAnalyzer
  suffix: Empty
  components:
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
