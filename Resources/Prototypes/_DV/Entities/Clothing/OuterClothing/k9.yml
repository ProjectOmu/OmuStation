- type: entity
  abstract: true
  id: K9ClothingBase
  components:
    - type: SpecialisedClothing
      whitelist:
        tags:
          - K9

# K9 Combat suit
- type: entity
  parent: [ K9ClothingBase, ClothingOuterVoidsuitSecurity ]
  id: ClothingOuterHardsuitCombatK9
  name: k9 combat hardsuit
  description: A canine-built combat suit designed to protect its against all manner of enemy combatants in low pressure environments.
  components:
    - type: Sprite
      sprite: _DV/Clothing/OuterClothing/Hardsuits/Combat/k9.rsi
    - type: Clothing
      sprite: _DV/Clothing/OuterClothing/Hardsuits/Combat/k9.rsi
    - type: ToggleableClothing
      clothingPrototypes:
        head: ClothingHeadHelmetHardsuitCombatK9
    - type: AllowSuitStorage
    - type: Tag
      tags:
        - K9Armor

- type: entity
  parent: [ K9ClothingBase, ClothingHeadHelmetVoidsuitSecurity ]
  id: ClothingHeadHelmetHardsuitCombatK9
  name: k9 combat hardsuit helmet
  components:
    - type: Sprite
      sprite: _DV/Clothing/Head/Hardsuits/Combat/k9.rsi
    - type: Clothing
      sprite: _DV/Clothing/Head/Hardsuits/Combat/k9.rsi
    - type: HideLayerClothing
      slots:
      - Hair
      - Snout
      - HeadTop
      - HeadSide
      - Eyes
    - type: PointLight
      color: "#f0ff97" #e9ff66
      rotation: 25
      energy: 6
      radius: 3
    - type: Tag
      tags:
        - K9Armor

