- type: entity
  abstract: true
  id: K9ClothingBase
  components:
    - type: SpecialisedClothing
      whitelist:
        tags:
          - K9

# K9 Combat suit
- type: entity
  parent: [ K9ClothingBase, ClothingOuterVoidsuitSecurity ]
  id: ClothingOuterHardsuitCombatK9
  name: k9 combat hardsuit
  description: A canine-built combat suit designed to protect its against all manner of enemy combatants in low pressure environments. This one has station security markings.
  components:
    - type: Sprite
      sprite: _DV/Clothing/OuterClothing/Hardsuits/Combat/k9.rsi
    - type: Clothing
      sprite: _DV/Clothing/OuterClothing/Hardsuits/Combat/k9.rsi
    - type: ExplosionResistance
      damageCoefficient: 0.50
    - type: ToggleableClothing # Goobstation - Modsuits change
      clothingPrototypes:
        head: ClothingHeadHelmetHardsuitCombatK9
    - type: AllowSuitStorage
    - type: Insulated # should I remove this?
    - type: Tag
      tags:
        - K9Armor

- type: entity
  parent: [ K9ClothingBase, ClothingHeadHelmetVoidsuitSecurity ]
  id: ClothingHeadHelmetHardsuitCombatK9
  name: k9 combat hardsuit helmet
  components:
    - type: Sprite
      sprite: _DV/Clothing/Head/Hardsuits/Combat/k9.rsi
    - type: Clothing
      sprite: _DV/Clothing/Head/Hardsuits/Combat/k9.rsi
    - type: PointLight
      color: "#e9ff66" #f0ff97
      rotation: 25
      energy: 6
      radius: 3
    - type: Tag
      tags:
        - K9Armor

