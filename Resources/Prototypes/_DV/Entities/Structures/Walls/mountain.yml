- type: entity
  id: AsteroidAltRock #It's 1994
  parent: BaseStructure
  name: asteroid rock
  suffix: Low Ore Yield
  description: A rocky asteroid.
  components:
  - type: Gatherable
    toolWhitelist:
      tags:
        - Pickaxe
  - type: Sprite
    sprite: _DV/Structures/Walls/asteroid_rock.rsi
    state: full
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Occluder
  - type: Airtight
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        density: 100
        mask:
        - FullTileMask
        layer:
        - WallLayer
  - type: IconSmooth
    key: walls
    base: rock_
  - type: OreVein
    oreChance: 0.2
    oreRarityPrototypeId: RandomOreDistributionStandard

- type: entity
  id: MountainRockMining
  parent: AsteroidAltRock
  name: mountain rock
  suffix: Low Yield/Higher Value Ore
  description: A craggy mountain wall.
  components:
  - type: Sprite
    sprite: _DV/Structures/Walls/mountain_rock_ore.rsi
    state: full
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: OreVein
    oreChance: 0.20
    oreRarityPrototypeId: RandomOreDistributionHigh

- type: entity
  id: MountainRock
  parent: BaseWall # Omu
  name: mountain rock
  suffix: Reinforced Wall # Omu
  description: A craggy mountain wall. It looks as tough as a reinforced wall. #Omu
  components:
  - type: Sprite
    sprite: _DV/Structures/Walls/mountain_rock.rsi
    state: full
  - type: Icon # Omu, Makes it display on maps
    sprite: Structures/Walls/solid.rsi
    state: rgeneric
  - type: Damageable
    damageContainer: StructuralInorganic # Omu
    damageModifierSet: StructuralMetallicStrong # Omu
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 400 # Omu, Lowered to reinforced wall value
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior # Omu, added destruction sound
        sound:
          path: /Audio/Effects/break_stone.ogg
          params:
            volume: -2
  - type: IconSmooth
    key: walls
    base: rock_

- type: entity
  id: AsteroidAltRockMining
  parent: AsteroidAltRock
  name: asteroid rock
  suffix: Higher Ore Yield
  description: A rocky asteroid.
  components:
  - type: Gatherable
    toolWhitelist:
      tags:
        - Pickaxe
  - type: OreVein
    oreChance: 0.33
    oreRarityPrototypeId: RandomOreDistributionStandard

- type: entity
  id: AsteroidRockOreCrab
  parent: AsteroidAltRock
  name: asteroid rock
  suffix: Ore Crab
  description: A rocky asteroid.
  components:
  - type: OreVein
    oreChance: 0.33
    oreRarityPrototypeId: OreCrab
