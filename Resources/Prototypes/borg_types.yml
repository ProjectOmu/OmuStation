# Salvage borg
- type: borgType
  id: mining

  # Description
  dummyPrototype: BorgChassisMining

  # Functional
  extraModuleCount: 3
  moduleWhitelist:
    tags:
    - BorgModuleGeneric
    - BorgModuleCargo

  defaultModules:
  - BorgModuleTool
  - BorgModuleMining
  - BorgModuleTraversal
  - BorgModuleAppraisal
  - BorgModulePKA # Lavaland

  radioChannels:
  - Supply
  - Science

  addComponents: # Goobstation
  - type: NoWieldNeeded
#  - type: SlavedBorg # Goobstation: Special AI labeling for salv borgs. Omu edit
#    law: SalvageObeyAI Omu edit

  lawset: OmuSalvage # Omu edit: using Omu laws

  # Visual
  inventoryTemplateId: borgTall
  spriteBodyState: miner
  spriteBodyMovementState: miner_moving
  spriteHasMindState: miner_e
  spriteNoMindState: miner_e_r
  spriteToggleLightState: miner_l

  # Pet
  petSuccessString: petting-success-salvage-cyborg
  petFailureString: petting-failure-salvage-cyborg


# Janitor borg
- type: borgType
  id: janitor

  # Description
  dummyPrototype: BorgChassisJanitor

  # Functional
  extraModuleCount: 3
  moduleWhitelist:
    tags:
    - BorgModuleGeneric
    - BorgModuleJanitor

  defaultModules:
  - BorgModuleTool # Omu
  - BorgModuleCleaning
  - BorgModuleCustodial

  radioChannels:
  - Science
  - Service

  lawset: OmuJanitor # Omu edit: using Omu laws

  # Visual
  inventoryTemplateId: borgShort
  spriteBodyState: janitor
  spriteBodyMovementState: janitor_moving
  spriteHasMindState: janitor_e
  spriteNoMindState: janitor_e_r
  spriteToggleLightState: janitor_l

  # Pet
  petSuccessString: petting-success-janitor-cyborg
  petFailureString: petting-failure-janitor-cyborg

  #start Byrd, giving all janiborgs a built in Cleanhud so they can see the UNCLEAN
  addComponents:
  - type: JaniVision
    isEquipment: false
    toggleAction: ToggleJaniVision
    janiShader: "unshaded"
    showAllLights: false
    workingLightsColor: "#FFFFFF"
    brokenLightsColor: "#FF0000"
    emptyLightsColor: "#05FCFC"
    burnedLightsColor: "#2AFC05"
    distanceCheckMin: 1
    distanceCheckMax: 1.3
    distanceAlpha: 0.2
    tagColors:
      Trash: "#FF00FF"
  - type: SolutionScanner
  #end Byrd


# Medical borg
- type: borgType
  id: medical

  # Description
  dummyPrototype: BorgChassisMedical

  # Functional
  extraModuleCount: 3
  moduleWhitelist:
    tags:
    - BorgModuleGeneric
    - BorgModuleMedical

  defaultModules:
  - BorgModuleTool # Omu
  - BorgModuleChemical
  - BorgModuleTopicals
  - BorgModuleRescue
  - BorgModuleSurgery
  - BorgModuleVirology # Omu Viro Module
  - BorgModuleLollypop # Goobstation

  lawset: OmuMedical # Omu edit: using Omu laws

  radioChannels:
  - Science
  - Medical

  addComponents:
  - type: SolutionScanner
  - type: ShowHealthBars
    damageContainers:
    - Biological
  - type: ShowHealthIcons
    damageContainers:
    - Biological
  - type: Sanitized # Shitmed
  - type: SurgeryTarget # Shitmed
  - type: SurgeryIgnoreClothing
  - type: SurgerySpeedModifier
    speedModifier: 1.5

  # Visual
  inventoryTemplateId: borgDutch
  spriteBodyState: medical
  spriteBodyMovementState: medical_moving
  spriteHasMindState: medical_e
  spriteNoMindState: medical_e_r
  spriteToggleLightState: medical_l

  # Pet
  petSuccessString: petting-success-medical-cyborg
  petFailureString: petting-failure-medical-cyborg

  # Sounds
  footstepCollection:
    collection: FootstepHoverBorg


