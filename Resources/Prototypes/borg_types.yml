# Generic borg
- type: borgType
  id: generic

  # Description
  dummyPrototype: BorgChassisGeneric

  # Functional
  extraModuleCount: 5
  moduleWhitelist:
    tags:
    - BorgModuleGeneric
    - BorgModuleBasic #Byrd Applied to more basic modules to let generic actually be a jack of all trades
    #  - BorgModuleScience Byrd sciborgs are added

  defaultModules:
  - BorgModuleTool
  - BorgModuleInflatable
	# start Byrd, removing the science modules and replacing with some generic borg modules as a dedicated science borg is now present
  - BorgModuleFireExtinguisher
  - BorgModuleCable
  #  - BorgModuleArtifact
  #  - BorgModuleAnomaly
  # end Byrd
  radioChannels:
  - Science

  lawset: OmuScience # Omu edit: Omu chassis laws

  # Visual
  inventoryTemplateId: borgShort
  spriteBodyState: robot
  spriteHasMindState: robot_e
  spriteNoMindState: robot_e_r
  spriteToggleLightState: robot_l

  # Pet
  petSuccessString: petting-success-generic-cyborg
  petFailureString: petting-failure-generic-cyborg


