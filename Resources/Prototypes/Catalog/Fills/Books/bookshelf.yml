- type: entity
  parent: Bookshelf
  id: BookshelfFilled
  suffix: random filled
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:NestedSelector
        tableId: BookshelfEntityTable

# Entity tables
- type: entityTable
  id: BookshelfEntityTable
  table: !type:AllSelector
    children:
    # Guidebooks
    - !type:NestedSelector
      rolls: !type:RangeNumberSelector
        range: 0, 2
      tableId: RandomGuidebookTable
    # Omu: guide-type heretic tomes, about the chance they had before the story books were removed
    - !type:NestedSelector
      prob: 0.12
      tableId: RandomHandwrittenBookTable

# Omu: premade story / handwritten books no longer spawn, only guide-type tomes remain.
- type: entityTable
  id: RandomHandwrittenBookTable
  table: !type:GroupSelector
    children:
    - id: HereticTomeMansusOverview   ## Omu
    - id: HereticTomeMansusDepthI     ## Omu
    - id: HereticTomeMansusDepthII    ## Omu
    - id: HereticTomeLodestone ## Omu

- type: entityTable
  id: RandomGuidebookTable
  table: !type:GroupSelector
    children:
    - id: BookBartendersManual
    - id: BookChemicalCompendium
    - id: BookEngineersHandbook
    - id: BookHowToCookForFortySpaceman
    - id: BookHowToKeepStationClean
    - id: BookHowToRockAndStone
    - id: BookHowToSurvive
    - id: BookLeafLoversSecret
    - id: BookMedicalReferenceBook
    - id: BookScientistsGuidebook
    - id: BookSecurity
    - id: BookSpaceEncyclopedia
    - id: BookSpaceLaw
    - id: BookTheBookOfControl

- type: entityTable
  id: RandomBookTable
  table: !type:GroupSelector
    children:
    - !type:NestedSelector
      tableId: RandomGuidebookTable
    - !type:NestedSelector
      tableId: RandomHandwrittenBookTable
