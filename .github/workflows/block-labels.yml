name: Block Labels from Merge

on:
  pull_request:
    types: [labeled, unlabeled, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check_bad_labels:
    name: Blocked label found
    runs-on: ubuntu-latest
    if: >
      "${{
        contains(github.event.pull_request.labels.*.name, 'Note: DO NOT MERGE') ||
        contains(github.event.pull_request.labels.*.name, 'Type: DATABASE CHANGES INCLUDED!!!!!') ||
        contains(github.event.pull_request.labels.*.name, 'S: REQUIRES COMMIT MERGE')
      }}"
    steps:
      - name: remove label for merging
        run: exit 1
