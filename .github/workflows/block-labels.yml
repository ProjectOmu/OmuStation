# SPDX-License-Identifier: MIT

name: Block Labels from Merge

on:
  pull_request:
    types: [labeled, unlabeled, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check_bad_labels:
    name: Blocked label found
    runs-on: ubuntu-latest
    if: "${{ contains(github.event.*.labels.*.name, 'Note: DO NOT MERGE') || contains(github.event.*.labels.*.name, 'Type: DATABASE CHANGES INCLUDED!!!!!') )}}"
    steps:
      - name: remove label for merging
        run: exit 1
